name: HERO V11 isolated layered web Preview (NEVER Production)
on:
  push:
    branches:
      - feature/hero-v9-integrated-2026-10-25
    paths:
      - .github/workflows/hero-v10-isolated-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hero-v10-isolated-preview
  cancel-in-progress: false
jobs:
  guard-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TARGET: sindarealest-admin-preview
      PREVIEW_BRANCH: hero-v11-native-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse unexpected repo, branch, target or missing credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/feature/hero-v9-integrated-2026-10-25"
          test "$CF_TARGET" = "sindarealest-admin-preview"
          test "$PREVIEW_BRANCH" = "hero-v11-native-20261025"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Prove isolated Preview D1/R2 and reject Production identities (read-only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {assessAdminPreviewBindings} from './scripts/admin-preview-binding-safety.mjs';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/';
          async function get(name){
            const r=await fetch(root+name,{headers:{Authorization:'Bearer '+token}});
            if(!r.ok)throw Error('Cloudflare project metadata unavailable');
            const result=await r.json();
            if(result.success!==true)throw Error('Cloudflare API rejected metadata request');
            return result;
          }
          const [admin,shop]=await Promise.all([get('sindarealest-admin-preview'),get('sindarealest2')]);
          const report=assessAdminPreviewBindings(admin,shop);
          for(const warning of report.warnings)console.log('::warning::'+warning);
          for(const error of report.blockers)console.error('::error::'+error);
          if(!report.deployAllowed)throw Error('Unsafe Preview bindings: no deploy');
          const db=o=>o?.d1_databases?.DB?.id||o?.d1_databases?.DB?.database_id;
          const d=db(admin.result?.deployment_configs?.preview);
          if(!d||d===db(admin.result?.deployment_configs?.production)||d===db(shop.result?.deployment_configs?.production))
            throw Error('Preview D1 isolation unknown: no deploy');
          console.log('PASS: isolated D1/R2 identities; redacted');
          NODE
      - name: Validate native HTML/CSS HERO before deployment
        run: |
          npm install --no-audit --no-fund
          npm run check
          node tests/hero-render-reference.test.mjs
          node tests/storefront-reference-parity.test.mjs
      - name: Deploy ONLY to isolated Admin Pages Preview non-main branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name "$CF_TARGET" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "native hero V10 Preview $GITHUB_SHA" 2>&1 | tee /tmp/hero-preview-deploy.log
          DEPLOYMENT_URL="$(grep -oE 'https://[[:xdigit:]]+\.sindarealest-admin-preview\.pages\.dev' /tmp/hero-preview-deploy.log | head -n 1 || true)"
          test -n "$DEPLOYMENT_URL" || { echo '::error::No immutable isolated deployment URL'; exit 1; }
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Immutable isolated Preview URL: $DEPLOYMENT_URL"
      - name: Verify real live HTML/CSS on exact isolated Preview URL (read-only)
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          case "$DEPLOYMENT_URL" in
            https://*.sindarealest-admin-preview.pages.dev) ;;
            *) echo '::error::Wrong host: refusing probe'; exit 1 ;;
          esac
          args=(--fail --silent --show-error --location --max-time 35 --retry 4 --retry-all-errors --retry-delay 3)
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            args+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          curl "${args[@]}" "$DEPLOYMENT_URL/" -o /tmp/hero-v10-live.html
          grep -Fq 'HERO V10 — REAL WEB COMPOSITION' /tmp/hero-v10-live.html
          grep -Fq 'HERO V11 — ACTUAL WEB LAYERS' /tmp/hero-v10-live.html
          grep -Fq 'silk-waves.svg' /tmp/hero-v10-live.html
          grep -Fq '<h1 class="serif"><span>Phong cách</span><span>đẳng cấp</span><span>từ da cá sấu</span></h1>' /tmp/hero-v10-live.html
          grep -Fq 'ai-marble-pedestal.webp' /tmp/hero-v10-live.html
          grep -Fq 'heroProductImage' /tmp/hero-v10-live.html
          if grep -Eq 'heroReferenceArt|hero-reference-(desktop|mobile)\.webp|hero-reference-art' /tmp/hero-v10-live.html; then
            echo '::error::Old flattened HERO remains in live HTML'; exit 1
          fi
          curl "${args[@]}" "$DEPLOYMENT_URL/images/hero-rebuild/silk-waves.svg" -o /tmp/hero-v11-silk.svg
          grep -q '<svg' /tmp/hero-v11-silk.svg
          grep -q '<path ' /tmp/hero-v11-silk.svg
          if grep -Eiq '<image|<text|<foreignObject|Phong cách|Khám phá ngay' /tmp/hero-v11-silk.svg; then
            echo '::error::Decorative background contains baked text/image'; exit 1
          fi
          echo 'PASS: immutable isolated Preview serves true HTML/CSS, distinct shoes, podium, decorative-only silk SVG; V9 flattened artwork absent'
          echo "Verified test URL: $DEPLOYMENT_URL"
          echo 'Preview branch alias: https://hero-v11-native-20261025.sindarealest-admin-preview.pages.dev'

# QA trigger: verify HTML/CSS native HERO against isolated Preview; NEVER Production.
