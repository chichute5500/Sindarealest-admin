name: ADMIN isolated Preview remote R2 canary (self-cleaning)

on:
  push:
    branches:
      - feature/admin-isolated-handoff-2026-10-20
    paths:
      - '.github/workflows/admin-preview-r2-canary.yml'
      - 'scripts/qa-admin-preview-r2-canary.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-admin-preview-r2-self-cleaning
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Guard exact isolated Admin feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/feature/admin-isolated-handoff-2026-10-20"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Cloudflare-compatible AWS S3 SDK without saving repo dependencies
        run: npm install --no-save --no-package-lock --no-fund @aws-sdk/client-s3
      - name: Confirm isolated Admin Preview alias has exact SHA before remote R2 canary
        run: node scripts/qa-admin-preview-deployed-sha.mjs
      - name: Test unique run-owned S3 objects, public media route, and two cleanup HEAD reads
        run: node scripts/qa-admin-preview-r2-canary.mjs
      - name: Upload sanitized run-owned R2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-r2-self-cleaning-${{ github.run_number }}
          path: artifacts/admin-r2-canary/
          if-no-files-found: warn
          retention-days: 14
