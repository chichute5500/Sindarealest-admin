name: PhotoAI Android APK
on:
  push:
    branches: [feature/photoai-android-apk-2026-10-25]
    paths: ['mobile/photoai/**', '.github/workflows/photoai-apk.yml']
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android command-line SDK
        run: |
          ls -l "$ANDROID_HOME/cmdline-tools"
          command -v sdkmanager || echo "sdkmanager not on PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract isolated PhotoAI source
        run: |
          mkdir -p mobile/photoai/project
          base64 -d mobile/photoai/source.tar.xz.b64 | tar -xJ -C mobile/photoai/project
          test -f mobile/photoai/project/settings.gradle
      - name: Build Android debug APK
        working-directory: mobile/photoai/project
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SinDarealest-PhotoAI-Android-Debug
          path: mobile/photoai/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
