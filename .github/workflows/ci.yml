name: Validate source and tests

on:
  push:
    # This integration PR is fully tested by pull_request CI and by its
    # isolated Preview gate; avoid launching identical push CI concurrently.
    branches-ignore:
      - integration/storefront-locked-on-main-2026-10-26
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-fund

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Validate project integrity
        run: npm run check

      - name: Run automated tests
        run: npm test
