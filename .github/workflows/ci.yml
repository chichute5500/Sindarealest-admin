name: Validate source, tests, and Pages routing

on:
  # Keep one run per PR update. Production deployment has its own validation gate.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'fix/**'
      - 'rewrite/**'
      - 'maintenance/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source integrity and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check source integrity
        run: npm run check

      - name: Run regression tests
        run: npm test

      - name: Smoke test local Cloudflare Pages routing
        run: node tests/pages-routing.test.mjs
