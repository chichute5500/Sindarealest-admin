name: Validate source and tests

on:
  push:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-fund

      - name: Use current npm CLI with the supported advisory audit endpoint
        run: |
          npm install --global npm@12.2.0 --no-audit --no-fund
          test "$(npm --version)" = "12.2.0"
          npm --version

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Validate project integrity
        run: npm run check

      - name: Run automated tests
        run: npm test
