
name: Import SinDarealest Products to D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source SQL
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/0002_seed_products.sql

          INSERT_COUNT=$(grep -c \
            "INSERT OR IGNORE INTO products" \
            migrations/0002_seed_products.sql)

          echo "Seed INSERT statements: $INSERT_COUNT"

          if [ "$INSERT_COUNT" -ne 235 ]; then
            echo "ERROR: Expected 235 product INSERT statements."
            exit 1
          fi

      - name: Verify target D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;

          if (!accountId || !token) {
            throw new Error("Missing Cloudflare credentials.");
          }

          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`,
            {
              headers: {
                Authorization: `Bearer ${token}`
              }
            }
          );

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error("Unable to verify the D1 database.");
          }

          const database = result.result.find(
            item =>
              item.name === "sindarealest-db" &&
              item.uuid === "f6c208a1-052a-445c-a3b7-a442783f9bd3"
          );

          if (!database) {
            throw new Error(
              "Target database name and ID did not match. Import stopped."
            );
          }

          console.log("Target D1 database verified.");
          NODE

      - name: Import products without overwriting existing rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.149.0 d1 execute sindarealest-db \
            --remote \
            --file=migrations/0002_seed_products.sql

      - name: Verify product count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.149.0 d1 execute sindarealest-db \
            --remote \
            --command="SELECT COUNT(*) AS total_products FROM products;"
