name: Import SinDarealest Products to D1

on:
  workflow_dispatch:
    inputs:
      confirm_empty_database:
        description: "Chỉ chọn YES khi products trong D1 Production đã được xác minh có 0 dòng"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

jobs:
  import-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require explicit confirmation of an empty database
        env:
          CONFIRM_EMPTY_DATABASE: ${{ inputs.confirm_empty_database }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CONFIRM_EMPTY_DATABASE:-NO}" != "YES" ]; then
            echo "::error::Seed stopped. Confirm that the target Production products table is empty before running this workflow."
            exit 1
          fi

      - name: Verify source SQL
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/0002_seed_products.sql

          INSERT_COUNT=$(grep -c "INSERT OR IGNORE INTO products" migrations/0002_seed_products.sql)
          echo "Seed INSERT statements: $INSERT_COUNT"

          if [ "$INSERT_COUNT" -ne 235 ]; then
            echo "ERROR: Expected 235 product INSERT statements."
            exit 1
          fi

      - name: Verify target D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;

          if (!accountId || !token) {
            throw new Error("Missing Cloudflare credentials.");
          }

          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error("Unable to verify the D1 database.");
          }

          const database = result.result.find(
            item => item.name === "sindarealest-db" &&
              item.uuid === "f6c208a1-052a-445c-a3b7-a442783f9bd3"
          );
          if (!database) {
            throw new Error("Target database name and ID did not match. Import stopped.");
          }
          console.log("Target D1 database verified.");
          NODE

      - name: Refuse to seed a database that already has products
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 d1 execute sindarealest-db --remote --json --command="SELECT COUNT(*) AS product_count FROM products;" > product-count.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { parseCliJson } from "./scripts/cloudflare-utils.mjs";

          const raw = readFileSync("product-count.json", "utf8");
          const result = parseCliJson(raw, "số lượng sản phẩm D1 trước khi seed");
          const findCount = value => {
            if (Array.isArray(value)) {
              for (const item of value) {
                const found = findCount(item);
                if (found !== null) return found;
              }
            } else if (value && typeof value === "object") {
              if (Object.hasOwn(value, "product_count")) {
                const count = Number(value.product_count);
                return Number.isSafeInteger(count) && count >= 0 ? count : null;
              }
              for (const item of Object.values(value)) {
                const found = findCount(item);
                if (found !== null) return found;
              }
            }
            return null;
          };

          const count = findCount(result);
          if (count === null) throw new Error("Unable to verify product_count; seed stopped.");
          if (count !== 0) throw new Error(`Target D1 already contains ${count} products. Seed stopped to avoid mixing initial data into an existing catalog.`);
          console.log("Target products table is empty; initial seed may proceed.");
          NODE

      - name: Import initial products without overwriting existing rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.149.0 d1 execute sindarealest-db --remote --file=migrations/0002_seed_products.sql

      - name: Verify product count after import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 d1 execute sindarealest-db --remote --json --command="SELECT COUNT(*) AS product_count FROM products;" > product-count.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { parseCliJson } from "./scripts/cloudflare-utils.mjs";

          const raw = readFileSync("product-count.json", "utf8");
          const result = parseCliJson(raw, "số lượng sản phẩm D1 sau khi seed");
          const findCount = value => {
            if (Array.isArray(value)) {
              for (const item of value) {
                const found = findCount(item);
                if (found !== null) return found;
              }
            } else if (value && typeof value === "object") {
              if (Object.hasOwn(value, "product_count")) {
                const count = Number(value.product_count);
                return Number.isSafeInteger(count) && count >= 0 ? count : null;
              }
              for (const item of Object.values(value)) {
                const found = findCount(item);
                if (found !== null) return found;
              }
            }
            return null;
          };

          const count = findCount(result);
          if (count !== 235) throw new Error(`Expected exactly 235 products after seed, got ${count}.`);
          console.log("Verified exactly 235 products in the target D1.");
          NODE
