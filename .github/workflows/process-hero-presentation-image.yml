name: Process owner Hero image edge alpha

on:
  push:
    branches:
      - fix/liquid-glass-audit-2026-10-19
    paths:
      - 'scripts/process-hero-edge.py'
      - '.github/workflows/process-hero-presentation-image.yml'

permissions:
  contents: write

concurrency:
  group: hero-edge-image-processing
  cancel-in-progress: false

jobs:
  feather-owner-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/liquid-glass-audit-2026-10-19

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow for PNG alpha processing
        run: python -m pip install --disable-pip-version-check --no-input Pillow==11.3.0

      - name: Feather only the image alpha edge
        run: python scripts/process-hero-edge.py

      - name: Commit separate processed image while preserving the uploaded original
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/hero-upload/tb_image_share_1792519964514-blended.png
          if git diff --cached --quiet; then
            echo "Processed Hero edge image is already current; no commit needed."
            exit 0
          fi
          git commit -m "Add edge-feathered Hero presentation image"
          git push origin HEAD:fix/liquid-glass-audit-2026-10-19
