name: Read-only production D1 migration preflight

on:
  push:
    branches:
      - audit/production-d1-readonly-2026-10-17

permissions:
  contents: read

jobs:
  inspect-production-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE: sindarealest-db

    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pinned project tools
        run: npm install --no-fund

      - name: Confirm the migration 0007 table exists (read only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Cloudflare API token secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Cloudflare account ID secret."; exit 1; }
          npx wrangler d1 execute "$CLOUDFLARE_D1_DATABASE" --remote --json --command "SELECT COUNT(*) AS contact_table_exists FROM sqlite_master WHERE type='table' AND name='order_contact_details';" > "$RUNNER_TEMP/contact-table.json"
          node --input-type=module - "$RUNNER_TEMP/contact-table.json" <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          function findNumber(input, key) {
            if (Array.isArray(input)) {
              for (const item of input) { const found = findNumber(item, key); if (found !== null) return found; }
              return null;
            }
            if (input && typeof input === 'object') {
              if (Object.hasOwn(input, key)) {
                const number = Number(input[key]);
                return Number.isSafeInteger(number) && number >= 0 ? number : null;
              }
              for (const item of Object.values(input)) { const found = findNumber(item, key); if (found !== null) return found; }
            }
            return null;
          }
          const exists = findNumber(value, 'contact_table_exists');
          if (exists !== 1) {
            console.error('BLOCKED: order_contact_details is absent in remote D1; migration 0007 must be reviewed/backed up/applied deliberately before this code can be considered fully ready.');
            process.exit(1);
          }
          console.log('PASS: order_contact_details exists in remote D1.');
          NODE

      - name: Count missing historical snapshots (read only)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$CLOUDFLARE_D1_DATABASE" --remote --json --command "SELECT COUNT(*) AS missing_order_contact_snapshots FROM orders o LEFT JOIN order_contact_details d ON d.order_id=o.id WHERE d.order_id IS NULL;" > "$RUNNER_TEMP/contact-backfill.json"
          node --input-type=module - "$RUNNER_TEMP/contact-backfill.json" <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          function findNumber(input, key) {
            if (Array.isArray(input)) {
              for (const item of input) { const found = findNumber(item, key); if (found !== null) return found; }
              return null;
            }
            if (input && typeof input === 'object') {
              if (Object.hasOwn(input, key)) {
                const number = Number(input[key]);
                return Number.isSafeInteger(number) && number >= 0 ? number : null;
              }
              for (const item of Object.values(input)) { const found = findNumber(item, key); if (found !== null) return found; }
            }
            return null;
          }
          const missing = findNumber(value, 'missing_order_contact_snapshots');
          if (missing !== 0) {
            console.error('BLOCKED: remote D1 has ' + (missing === null ? 'an unknown number of' : missing) + ' orders without contact snapshots. No data was written.');
            process.exit(1);
          }
          console.log('PASS: every historical order has an order_contact_details snapshot.');
          NODE
