name: Forensic Preview 503 Probe (NO PRODUCT OR R2 WRITES)
on:
  push:
    branches:
      - feature/admin-bulk-folder-import-2026-10-26
    paths:
      - 'scripts/qa-bulk-import-503-forensic.mjs'
      - '.github/workflows/forensic-preview-503.yml'
permissions:
  contents: read
jobs:
  sample-authenticated-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Classify safe Preview API results (synthetic login, GET catalog, invalid-body POST only)
        run: node scripts/qa-bulk-import-503-forensic.mjs
