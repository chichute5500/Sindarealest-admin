name: HERO V9.4 integrated Chromium visual QA (NO DEPLOY)
on:
  push:
    branches:
      - feature/hero-v9-integrated-2026-10-25
    paths:
      - public/index.html
      - public/images/hero-rebuild/**
      - scripts/audit-hero-local-v9.mjs
      - .github/workflows/hero-v9-local-visual-qa.yml
  pull_request:
    branches:
      - integration/full-site-admin-storefront-2026-10-25
    paths:
      - public/index.html
      - public/images/hero-rebuild/**
      - scripts/audit-hero-local-v9.mjs
      - .github/workflows/hero-v9-local-visual-qa.yml
permissions:
  contents: read
jobs:
  browser-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium locally (no Cloudflare access)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit 7 viewports × 2 themes and CTA keyboard navigation
        run: node scripts/audit-hero-local-v9.mjs
      - name: Upload screenshots and pixel parity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-v9-integrated-chromium
          path: artifacts/hero-v9-isolated-browser-qa/
          if-no-files-found: warn
          retention-days: 14
