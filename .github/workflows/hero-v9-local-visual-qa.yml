name: HERO V10 actual HTML/CSS Chromium UI — NO DEPLOY
on:
  push:
    branches:
      - feature/hero-v9-integrated-2026-10-25
    paths:
      - public/index.html
      - public/images/hero-rebuild/silk-waves.svg
      - public/images/hero-rebuild/marble-shelf-v14.svg
      - tests/hero-render-reference.test.mjs
      - scripts/audit-hero-local-v9.mjs
      - .github/workflows/hero-v9-local-visual-qa.yml
  pull_request:
    branches:
      - integration/full-site-admin-storefront-2026-10-25
permissions:
  contents: read
jobs:
  browser-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium locally (no Cloudflare access)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Native DOM contract
        run: node tests/hero-render-reference.test.mjs
      - name: Audit all 14 layouts plus 10 QA-only contact-shadow variants
        env:
          HERO_CONTACT_SWEEP: '1'
        run: node scripts/audit-hero-local-v9.mjs
      - name: Upload actual HERO screenshots and DOM metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-v10-native-browser
          path: artifacts/hero-v10-native-browser-qa/
          if-no-files-found: warn
          retention-days: 14
