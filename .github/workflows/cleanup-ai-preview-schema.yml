name: One-time cleanup of isolated AI preview D1

on:
  push:
    branches:
      - cleanup/remove-ai-preview-schema-2026-10-16

permissions:
  contents: read

jobs:
  cleanup-preview-only:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact isolated preview database (read-only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) throw new Error('Missing Cloudflare credentials.');
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const body = await response.json();
          if (!response.ok || !body.success) throw new Error('Cannot verify D1 database list.');
          const db = (body.result || []).find(x => x.name === 'sindarealest-ai-preview-db');
          if (!db || !db.uuid) throw new Error('Dedicated AI preview database was not found. Nothing was changed.');
          if (db.uuid === 'f6c208a1-052a-445c-a3b7-a442783f9bd3' || db.name === 'sindarealest-db') {
            throw new Error('Safety stop: target matches production D1. Nothing was changed.');
          }
          console.log('Verified isolated preview database by exact name; it is not production D1.');
          NODE

      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4.149.0

      - name: Drop only AI experiment tables from isolated preview D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute sindarealest-ai-preview-db --remote --command="DROP TABLE IF EXISTS ai_request_limits;"
          npx wrangler d1 execute sindarealest-ai-preview-db --remote --command="DROP TABLE IF EXISTS image_ai_reviews;"

      - name: Verify AI-only tables are gone
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(npx wrangler d1 execute sindarealest-ai-preview-db --remote --command="SELECT CASE WHEN COUNT(*) = 0 THEN 'CLEAN' ELSE 'ERROR' END AS status FROM sqlite_master WHERE type='table' AND name IN ('ai_request_limits','image_ai_reviews');")"
          printf '%s\n' "$RESULT"
          echo "$RESULT" | grep -q CLEAN
