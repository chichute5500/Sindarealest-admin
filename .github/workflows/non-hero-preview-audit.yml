name: Non-Hero order-section live Preview audit

on:
  push:
    branches:
      - fix/liquid-glass-audit-2026-10-19
    paths:
      - 'public/**'
      - 'scripts/cloudflare-access-service-token.mjs'
      - 'scripts/preview-external-read-allowlist.mjs'
      - '.github/workflows/non-hero-preview-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: non-hero-order-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/fix/liquid-glass-audit-2026-10-19'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://fix-liquid-glass-audit-2026.sindarealest2.pages.dev/
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'e520f2230ac9945b35f525adc2b99026' }}
      CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check out selected branch with deployment history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify alias deployment SHA, then capture only #order in Light/Dark
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { promises as fs } from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { chromium } from 'playwright';
          import { buildCloudflareAccessHeaders } from './scripts/cloudflare-access-service-token.mjs';
          import { isApprovedPreviewExternalRead } from './scripts/preview-external-read-allowlist.mjs';
          import { sanitizeText } from './scripts/sanitize-audit-value.mjs';

          const expectedBranch = 'fix/liquid-glass-audit-2026-10-19';
          const sourceSha = String(process.env.GITHUB_SHA || '').trim().toLowerCase();
          const branch = String(process.env.GITHUB_REF_NAME || '').trim();
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const apiToken = String(process.env.CLOUDFLARE_PAGES_READ_TOKEN || '').trim();
          const outDir = path.join(process.cwd(), 'artifacts', 'non-hero-order-preview');
          const manifestPath = path.join(outDir, 'visual-audit.json');
          const viewports = [
            { name: 'mobile-360', width: 360, height: 800 },
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'desktop-1440', width: 1440, height: 900 }
          ];
          const themes = ['light', 'dark'];
          const targetSelector = 'section.section.wrap#order';
          let previewUrl;
          try { previewUrl = new URL(String(process.env.PREVIEW_URL || '')); }
          catch { throw new Error('The configured Preview URL is invalid; capture refused.'); }
          if (previewUrl.protocol !== 'https:' ||
              !/^[a-z0-9-]+\.sindarealest2\.pages\.dev$/i.test(previewUrl.hostname) ||
              previewUrl.hostname.toLowerCase() === 'sindarealest2.pages.dev' ||
              previewUrl.username || previewUrl.password || previewUrl.search || previewUrl.hash ||
              (previewUrl.pathname !== '/' && previewUrl.pathname !== '')) {
            throw new Error('Refused URL: only the configured non-Production HTTPS Pages alias is allowed.');
          }
          previewUrl.pathname = '/';
          const origin = previewUrl.origin;
          assert.equal(branch, expectedBranch, 'Capture is restricted to the approved Preview branch.');
          assert.match(sourceSha, /^[a-f0-9]{40}$/, 'The source revision must be an exact Git SHA.');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim().toLowerCase(), sourceSha,
            'Checked-out source must match the triggering commit.');
          assert.equal(targetSelector, 'section.section.wrap#order', 'Only the order-process section is in scope.');
          assert.doesNotMatch(targetSelector, /hero/i, 'The paused Hero must never be a screenshot target.');
          if (!/^[a-f0-9]{32}$/i.test(accountId)) throw new Error('Missing or invalid Cloudflare account ID.');
          if (!apiToken) throw new Error('Missing read-only Cloudflare Pages metadata token.');

          const audit = {
            sourceKind: 'cloudflare-pages-preview-live-read-only',
            auditScope: 'order-process-section-only',
            previewOrigin: origin,
            branch,
            sourceHeadSha: sourceSha,
            deployedPreviewSha: null,
            deployment: null,
            sourcePublicTreeEquivalentToDeployment: false,
            captureCompleted: false,
            status: 'IN_PROGRESS',
            ownerVisualAcceptance: 'PENDING',
            accessBlocked: false,
            accessServiceTokenConfigured: false,
            screenshotTarget: targetSelector,
            requiredVisibleState: '#orderDetailsPanel:not([hidden]) with exactly four .order-step cards',
            runtimeErrors: [],
            sameOriginHttpErrors: [],
            readOnlyViolations: [],
            blockedExternalRequests: [],
            screenshots: [],
            startedAtUtc: new Date().toISOString()
          };
          await fs.rm(outDir, { recursive: true, force: true });
          await fs.mkdir(outDir, { recursive: true });
          async function writeAudit() {
            await fs.mkdir(outDir, { recursive: true });
            await fs.writeFile(manifestPath, JSON.stringify(audit, null, 2) + '\n', 'utf8');
          }

          function publicTreeEquivalent(deployedSha) {
            if (!/^[a-f0-9]{40}$/.test(deployedSha)) return false;
            try {
              execFileSync('git', ['merge-base', '--is-ancestor', deployedSha, sourceSha], { stdio: 'ignore' });
              execFileSync('git', ['diff', '--quiet', deployedSha, sourceSha, '--', 'public'], { stdio: 'ignore' });
              return true;
            } catch { return false; }
          }

          async function readAliasDeployment() {
            let totalPages = 1;
            const matches = [];
            for (let pageNumber = 1; pageNumber <= Math.min(totalPages, 10); pageNumber += 1) {
              const endpoint = new URL('https://api.cloudflare.com/client/v4/accounts/' +
                encodeURIComponent(accountId) + '/pages/projects/sindarealest2/deployments');
              endpoint.searchParams.set('env', 'preview');
              endpoint.searchParams.set('per_page', '20');
              endpoint.searchParams.set('page', String(pageNumber));
              const response = await fetch(endpoint, {
                method: 'GET',
                headers: { Authorization: 'Bearer ' + apiToken, Accept: 'application/json' },
                signal: AbortSignal.timeout(15000)
              });
              const payload = await response.json().catch(() => null);
              if (!response.ok || payload?.success !== true || !Array.isArray(payload?.result)) {
                throw new Error('Cloudflare Pages read-only metadata request failed (HTTP ' + response.status + ').');
              }
              totalPages = Number(payload?.result_info?.total_pages || 1);
              for (const deployment of payload.result) {
                const aliases = Array.isArray(deployment?.aliases) ? deployment.aliases : [];
                let deployedOrigin = '';
                try { deployedOrigin = new URL(deployment?.url || '').origin.toLowerCase(); } catch {}
                const aliasOrigins = aliases.map((alias) => {
                  try { return new URL(alias).origin.toLowerCase(); } catch { return ''; }
                });
                if (aliasOrigins.includes(origin.toLowerCase()) || deployedOrigin === origin.toLowerCase()) matches.push(deployment);
              }
            }
            return matches.filter((item, index, all) => item?.id
              ? all.findIndex((other) => other?.id === item.id) === index : true);
          }

          async function verifyDeployment() {
            let reason = 'No deployment record matched the exact Preview alias.';
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const matches = await readAliasDeployment();
              if (matches.length > 1) throw new Error('The exact alias matched multiple deployments; refusing to guess.');
              if (matches.length === 1) {
                const deployment = matches[0];
                const metadata = deployment?.deployment_trigger?.metadata || {};
                const deployedSha = String(metadata.commit_hash || '').trim().toLowerCase();
                const deployedBranch = String(metadata.branch || '').trim();
                const stage = deployment?.latest_stage ||
                  (Array.isArray(deployment?.stages) ? deployment.stages.at(-1) : null);
                const stageStatus = String(stage?.status || '').toLowerCase();
                const status = String(deployment?.status || stageStatus).toLowerCase();
                const environment = String(deployment?.environment || '').toLowerCase();
                if (environment !== 'preview' || deployedBranch !== expectedBranch) {
                  throw new Error('Alias deployment is not the expected Preview branch; no screenshot was captured.');
                }
                if (!/^[a-f0-9]{40}$/.test(deployedSha) || stageStatus !== 'success' ||
                    status !== 'success' || !deployment?.id || deployment?.is_skipped === true) {
                  reason = 'Alias deployment metadata is incomplete or its deployment has not completed.';
                } else if (deployedSha === sourceSha || publicTreeEquivalent(deployedSha)) {
                  audit.deployment = {
                    id: String(deployment.id),
                    sha: deployedSha,
                    branch: deployedBranch,
                    environment,
                    status,
                    latestStage: { name: String(stage?.name || ''), status: stageStatus },
                    url: typeof deployment.url === 'string' ? deployment.url : null,
                    aliases: Array.isArray(deployment.aliases) ? deployment.aliases : [],
                    exactSourceHeadMatch: deployedSha === sourceSha
                  };
                  audit.deployedPreviewSha = deployedSha;
                  audit.sourcePublicTreeEquivalentToDeployment = true;
                  return;
                } else {
                  reason = 'Alias deployment SHA is valid, but public storefront files differ from source HEAD.';
                }
              }
              if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            throw new Error('Could not prove that the Preview alias serves an accepted deployment: ' + reason);
          }

          function isAccessPage(url, status, title, body) {
            let parsed;
            try { parsed = new URL(url); } catch { return true; }
            return status === 401 || status === 403 ||
              parsed.pathname.startsWith('/cdn-cgi/access/login') ||
              parsed.hostname.toLowerCase().endsWith('.cloudflareaccess.com') ||
              /cloudflare access|sign in to continue|log in to .*cloudflare pages|access denied/i.test((title || '') + '\n' + (body || ''));
          }

          function safeError(error) {
            return sanitizeText(error?.message || 'Capture failed; detailed error omitted.');
          }

          const browserAccessHeaders = buildCloudflareAccessHeaders();
          audit.accessServiceTokenConfigured = Object.keys(browserAccessHeaders).length > 0;
          let browser;
          try {
            await writeAudit();
            await verifyDeployment();
            browser = await chromium.launch({ headless: true });
            for (const viewport of viewports) {
              for (const theme of themes) {
                const contextName = viewport.name + '-' + theme;
                const context = await browser.newContext({
                  viewport: { width: viewport.width, height: viewport.height },
                  deviceScaleFactor: 1,
                  colorScheme: theme,
                  reducedMotion: 'reduce',
                  serviceWorkers: 'block'
                });
                await context.addInitScript(({ themeName }) => {
                  try { localStorage.setItem('sd-theme-mode', themeName); } catch {}
                }, { themeName: theme });
                const page = await context.newPage();
                page.setDefaultTimeout(20000);
                page.on('pageerror', (error) => {
                  if (audit.runtimeErrors.length < 80) audit.runtimeErrors.push({
                    context: contextName, type: 'pageerror', message: sanitizeText(error.message || 'Page error')
                  });
                });
                page.on('console', (message) => {
                  if (message.type() !== 'error' || audit.runtimeErrors.length >= 80) return;
                  const locationUrl = message.location()?.url || '';
                  try {
                    if (locationUrl && new URL(locationUrl).origin !== origin) return;
                  } catch {}
                  audit.runtimeErrors.push({ context: contextName, type: 'console', message: sanitizeText(message.text()) });
                });
                page.on('response', (response) => {
                  let responseUrl;
                  try { responseUrl = new URL(response.url()); } catch { return; }
                  if (responseUrl.origin === origin && response.status() >= 400 && audit.sameOriginHttpErrors.length < 80) {
                    audit.sameOriginHttpErrors.push({
                      context: contextName, status: response.status(), method: response.request().method(),
                      path: responseUrl.pathname
                    });
                  }
                });
                await page.route('**/*', async (route) => {
                  const request = route.request();
                  let requestUrl;
                  try { requestUrl = new URL(request.url()); } catch {
                    await route.abort();
                    return;
                  }
                  if (request.isNavigationRequest() && requestUrl.hostname.toLowerCase().endsWith('.cloudflareaccess.com')) {
                    audit.accessBlocked = true;
                    await route.abort();
                    return;
                  }
                  if (requestUrl.origin === origin) {
                    if (!['GET', 'HEAD'].includes(request.method().toUpperCase())) {
                      if (audit.readOnlyViolations.length < 80) audit.readOnlyViolations.push({
                        context: contextName, method: request.method(), path: requestUrl.pathname
                      });
                      await route.abort();
                      return;
                    }
                    const headers = Object.keys(browserAccessHeaders).length
                      ? { ...request.headers(), ...browserAccessHeaders } : request.headers();
                    await route.continue({ headers });
                    return;
                  }
                  if (isApprovedPreviewExternalRead(request.url(), request.method())) {
                    await route.continue();
                    return;
                  }
                  if (audit.blockedExternalRequests.length < 80) audit.blockedExternalRequests.push({
                    context: contextName, method: request.method(), origin: requestUrl.origin, type: request.resourceType()
                  });
                  await route.abort();
                });
                try {
                  const response = await page.goto(previewUrl.href, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  const title = await page.title().catch(() => '');
                  const body = await page.locator('body').innerText().catch(() => '');
                  if (isAccessPage(page.url(), response?.status() || 0, title, body)) {
                    audit.accessBlocked = true;
                    throw new Error('Cloudflare Access blocked the permitted Preview request; no bypass was attempted.');
                  }
                  if (!response || response.status() < 200 || response.status() >= 400) {
                    throw new Error('The Preview main document did not return a usable successful response.');
                  }
                  const skipIntro = page.locator('#skipIntro').first();
                  if (await skipIntro.isVisible().catch(() => false)) await skipIntro.click().catch(() => {});
                  await page.waitForTimeout(350);
                  const order = page.locator(targetSelector).first();
                  await order.waitFor({ state: 'visible', timeout: 25000 });
                  const toggle = page.locator('#orderDetailsToggle');
                  await toggle.waitFor({ state: 'visible', timeout: 10000 });
                  if ((await toggle.getAttribute('aria-expanded')) !== 'true') await toggle.click();
                  const detailsPanel = page.locator('#orderDetailsPanel:not([hidden])');
                  await detailsPanel.waitFor({ state: 'visible', timeout: 15000 });
                  const stepCards = detailsPanel.locator('.order-steps .order-step');
                  await stepCards.first().waitFor({ state: 'visible', timeout: 15000 });
                  const stepCount = await stepCards.count();
                  assert.equal(stepCount, 4, 'The expanded order process must show exactly four steps before capture.');
                  await page.waitForTimeout(350);
                  const screenshotFile = 'order-process-' + contextName + '.png';
                  await order.screenshot({
                    path: path.join(outDir, screenshotFile),
                    animations: 'disabled',
                    timeout: 30000
                  });
                  audit.screenshots.push({
                    filename: screenshotFile,
                    section: 'order-process',
                    selector: targetSelector,
                    viewport: viewport.name,
                    width: viewport.width,
                    height: viewport.height,
                    theme,
                    expandedProcessStepCount: 4,
                    deployedPreviewSha: audit.deployedPreviewSha
                  });
                } catch (error) {
                  if (audit.accessBlocked) throw new Error('Cloudflare Access blocked the permitted Preview request; no bypass was attempted.');
                  throw new Error('Capture failed for ' + contextName + ': ' + safeError(error));
                } finally {
                  await context.close().catch(() => {});
                }
              }
            }
            const expectedCount = viewports.length * themes.length;
            audit.screenshotCount = audit.screenshots.length;
            audit.expectedScreenshotCount = expectedCount;
            audit.captureCompleted = audit.screenshotCount === expectedCount;
            audit.status = audit.captureCompleted
              ? 'CAPTURED_AWAITING_OWNER_VISUAL_ACCEPTANCE' : 'CAPTURE_INCOMPLETE';
            audit.ownerVisualAcceptance = 'PENDING';
            audit.completedAtUtc = new Date().toISOString();
            await writeAudit();
            if (process.env.GITHUB_STEP_SUMMARY) {
              await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,
                '## Non-Hero order-process Preview screenshots\n\n' +
                '- Result: **' + audit.status + '**\n' +
                '- Source HEAD: `' + sourceSha + '`\n' +
                '- Actual deployed Preview SHA: `' + audit.deployedPreviewSha + '`\n' +
                '- Verified deployment branch: `' + audit.deployment.branch + '`\n' +
                '- Target: `#order` only\n' +
                '- Screenshots: ' + audit.screenshotCount + ' / ' + expectedCount + '\n' +
                '- Viewports/themes: four viewport sizes × Light/Dark\n' +
                '- Owner visual acceptance: **PENDING**\n');
            }
            console.log(JSON.stringify({
              status: audit.status,
              sourceHeadSha: sourceSha,
              deployedPreviewSha: audit.deployedPreviewSha,
              exactSourceHeadMatch: audit.deployment.exactSourceHeadMatch,
              selector: targetSelector,
              screenshotCount: audit.screenshotCount,
              expectedScreenshotCount: expectedCount,
              ownerVisualAcceptance: audit.ownerVisualAcceptance
            }, null, 2));
            if (!audit.captureCompleted || audit.readOnlyViolations.length > 0 || audit.accessBlocked) process.exitCode = 1;
          } catch (error) {
            audit.captureCompleted = false;
            audit.status = audit.accessBlocked ? 'BLOCKED_ACCESS_GATE'
              : !audit.deployment ? 'BLOCKED_DEPLOYMENT_VERIFICATION' : 'CAPTURE_FAILED';
            audit.ownerVisualAcceptance = 'PENDING';
            audit.error = safeError(error);
            audit.completedAtUtc = new Date().toISOString();
            await writeAudit().catch(() => {});
            if (process.env.GITHUB_STEP_SUMMARY) {
              await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,
                '## Non-Hero order-process Preview screenshots\n\n' +
                '- Result: **' + audit.status + '**\n' +
                '- Source HEAD: `' + sourceSha + '`\n' +
                '- Owner visual acceptance: **PENDING**\n' +
                '- Detail: ' + audit.error + '\n');
            }
            console.error(audit.error);
            process.exitCode = 1;
          } finally {
            if (browser) await browser.close().catch(() => {});
          }
          NODE

      - name: Upload order-section live screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-hero-order-live-preview-${{ github.sha }}
          path: artifacts/non-hero-order-preview/
          if-no-files-found: warn
          retention-days: 14

  publish-result:
    if: always() && github.ref == 'refs/heads/fix/liquid-glass-audit-2026-10-19'
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Publish capture result without claiming visual acceptance
        uses: actions/github-script@v7
        env:
          CAPTURE_RESULT: ${{ needs.capture.result }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const outcome = process.env.CAPTURE_RESULT;
            const state = outcome === 'success' ? 'success' : outcome === 'failure' ? 'failure' : 'error';
            const description = state === 'success'
              ? 'Order-section live screenshots captured; owner visual acceptance is pending.'
              : 'Order-section live capture failed or was blocked; inspect the run logs and artifact.';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT_SHA,
              state,
              context: 'non-hero-order-live-preview-capture',
              description,
              target_url: process.env.TARGET_URL
            });
