name: Deploy image backup Admin Preview (isolated)
on:
  push:
    branches:
      - feat/automatic-r2-image-backup-20261105
    paths:
      - 'public/admin/index.html'
      - 'functions/api/admin/image-backup.js'
      - 'functions/api/admin/image-archive.js'
      - 'functions/_lib/image-archive.js'
      - 'tests/image-archive.test.mjs'
      - 'tests/image-archive-single.test.mjs'
      - 'public/admin/image-archive-single.js'
      - 'public/admin/image-archive-client.js'
      - 'functions/_lib/image-backup.js'
      - 'tests/image-backup.test.mjs'
      - 'tests/admin-route-auth-surface.test.mjs'
      - 'tests/admin-route-runtime-auth.test.mjs'
      - 'package.json'
      - '.github/workflows/deploy-image-backup-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-backup-isolated-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_PROJECT: sindarealest-admin-preview
      PREVIEW_BRANCH: image-backup-20261105
    steps:
      - name: Exact branch and preview-only guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/feat/automatic-r2-image-backup-20261105'
          test "$PREVIEW_PROJECT" = 'sindarealest-admin-preview'
          test "$PREVIEW_BRANCH" = 'image-backup-20261105'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies and validate
        run: |
          npm install --no-fund
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Confirm Production is main and Preview storage is isolated
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/$PREVIEW_PROJECT" > "$RUNNER_TEMP/backup-preview.json"
          curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/backup-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/backup-preview.json" "$RUNNER_TEMP/backup-production.json"
      - name: Deploy preview branch only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name "$PREVIEW_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Image backup UI Preview $GITHUB_SHA"
      - name: Verify Cloudflare reports exact SHA at preview alias
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}/deployments"
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" \
            > "$RUNNER_TEMP/backup-deployments.json"
          jq -e --arg sha "$GITHUB_SHA" --arg branch "$PREVIEW_BRANCH" \
            --arg host "$PREVIEW_BRANCH.$PREVIEW_PROJECT.pages.dev" \
            '.success == true and ([.result[] | select(
              .environment == "preview" and
              .latest_stage.status == "success" and
              .deployment_trigger.metadata.commit_hash == $sha and
              .deployment_trigger.metadata.branch == $branch and
              ([.aliases[]? | contains($host)] | any)
             )] | length > 0)' "$RUNNER_TEMP/backup-deployments.json" >/dev/null
          echo "Verified source SHA $GITHUB_SHA at isolated Cloudflare Pages Preview alias"
      - name: Preview link
        if: always()
        shell: bash
        run: |
          echo "Preview candidate: https://image-backup-20261105.sindarealest-admin-preview.pages.dev/admin/" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Production deploy: none; Production D1/R2 writes: none." >> "$GITHUB_STEP_SUMMARY"
