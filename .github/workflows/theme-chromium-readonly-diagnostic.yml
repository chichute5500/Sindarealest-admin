name: Theme Chromium Read-only Diagnostic (NO DEPLOY)
# Run manually only AFTER the isolated integrated deployment of the exact SHA.
# Running on push races ahead of deployment and produces false missing-element FAILs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-chromium-readonly-diagnostic
  cancel-in-progress: true

jobs:
  theme-perf:
    name: Read-only Chromium theme A/B diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: https://integration-storefront-locke.sindarealest-admin-preview.pages.dev/
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout exactly this integration revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache isolated Chromium headless shell
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-headless-shell-${{ runner.os }}-playwright-1.56.1-v1
      - name: Prepare Chromium without redundant system reinstall
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --only-shell chromium
          node --input-type=module -e "import('playwright').then(async ({chromium})=>{const b=await chromium.launch({headless:true});await b.close()})" || {
            npx playwright install-deps chromium
            node --input-type=module -e "import('playwright').then(async ({chromium})=>{const b=await chromium.launch({headless:true});await b.close()})"
          }
      - name: Measure independent empty-page Chromium compositor baseline
        run: node scripts/qa-theme-frame-scheduler-baseline.mjs
      - name: Isolate CSS cascade blocks responsible for theme repaint (GET only)
        env:
          SD_THEME_DIAGNOSTIC_VARIANTS: '1'
          SD_THEME_TRACE: '1'
        run: node scripts/qa-storefront-theme-material.mjs
