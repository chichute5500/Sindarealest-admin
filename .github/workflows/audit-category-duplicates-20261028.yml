name: Audit duplicate category labels in Production D1 (read only)
on:
  push:
    branches:
      - fix/category-canonical-dedupe-2026-10-28
    paths:
      - scripts/audit-category-duplicates-readonly.mjs
      - .github/workflows/audit-category-duplicates-20261028.yml
permissions:
  contents: read
jobs:
  category-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-category-duplicates-readonly.mjs
