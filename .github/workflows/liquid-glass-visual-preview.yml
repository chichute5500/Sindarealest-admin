name: Liquid Glass isolated visual preview

on:
  push:
    branches:
      - fix/liquid-glass-redesign
      - fix/liquid-glass-audit-2026-10-19
    paths-ignore:
      - 'docs/website-screenshots/start-of-work/**'
      - 'docs/website-screenshots/end-of-work/**'
  workflow_dispatch:
    inputs:
      capture_stage:
        description: 'Save this real capture as the start or end snapshot'
        required: true
        type: choice
        options:
          - start-of-work
          - end-of-work
      confirm_preview_only:
        description: 'Confirm this is a fix/Preview branch only; never Production'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: liquid-glass-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visual-preview:
    if: github.ref == 'refs/heads/fix/liquid-glass-redesign' || github.ref == 'refs/heads/fix/liquid-glass-audit-2026-10-19'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Reject unsafe manual capture
        if: github.event_name == 'workflow_dispatch'
        env:
          STAGE: ${{ inputs.capture_stage }}
          PREVIEW_ONLY: ${{ inputs.confirm_preview_only }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "${PREVIEW_ONLY}" = "true"
          case "${REF_NAME}" in
            fix/liquid-glass-redesign|fix/liquid-glass-audit-2026-10-19) ;;
            *) echo "Refused: only an approved fix branch is allowed."; exit 1 ;;
          esac
          case "${STAGE}" in
            start-of-work|end-of-work) ;;
            *) echo "Refused: capture stage must be explicitly selected."; exit 1 ;;
          esac
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Record source revision before screenshot commit
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install temporary Playwright dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Run complete project tests
        run: npm test
      - name: Run project and migration checks
        run: npm run check
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Start read-only local static preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory public > /tmp/sindarealest-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Local static preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sindarealest-preview.log
          exit 1
      - name: Capture Light/Dark screenshots and audit responsive layouts
        run: node scripts/capture-liquid-glass-preview.mjs
      - name: Save independently captured images into selected repository archive
        if: github.event_name == 'workflow_dispatch'
        env:
          STAGE: ${{ inputs.capture_stage }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "${STAGE}" in
            start-of-work|end-of-work) ;;
            *) echo "Refused invalid capture stage"; exit 1 ;;
          esac
          source_dir="artifacts/liquid-glass-preview"
          target_dir="docs/website-screenshots/${STAGE}"
          manifest_path="docs/website-screenshots/manifest.json"
          test -d "${source_dir}"
          mkdir -p "${target_dir}" docs/website-screenshots
          find "${source_dir}" -maxdepth 1 -type f -name '*.jpg' -print -quit | grep -q .
          # Replace only this stage's generated captures; never create RUN_ID subfolders.
          find "${target_dir}" -maxdepth 1 -type f -name '*.jpg' -delete
          rm -f "${target_dir}/MANIFEST.md"
          while IFS= read -r file; do
            name="$(basename "$file")"
            cp "$file" "${target_dir}/${name}"
          done < <(find "${source_dir}" -maxdepth 1 -type f -name '*.jpg' -print | sort)
          image_count="$(find "${target_dir}" -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')"
          test "${image_count}" -gt 1
          CAPTURED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" IMAGE_COUNT="${image_count}" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const file = 'docs/website-screenshots/manifest.json';
          let manifest = {};
          try { manifest = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
          manifest.schemaVersion = 1;
          manifest.repository = process.env.REPOSITORY;
          manifest.branch = process.env.REF_NAME;
          manifest.sourceCommit = process.env.SOURCE_SHA;
          manifest.previewUrl = 'http://127.0.0.1:4173/';
          manifest.captureSource = 'GitHub Actions read-only local static preview; not the deployed Cloudflare Preview';
          manifest.updatedAtUtc = process.env.CAPTURED_AT;
          manifest.stages ??= {};
          manifest.stages[process.env.STAGE] = {
            capturedAtUtc: process.env.CAPTURED_AT,
            runId: process.env.RUN_ID,
            imageCount: Number(process.env.IMAGE_COUNT),
            directory: `docs/website-screenshots/${process.env.STAGE}/`,
            images: fs.readdirSync(`docs/website-screenshots/${process.env.STAGE}/`).filter(name => name.endsWith('.jpg')).sort().map(name => ({
              path: `docs/website-screenshots/${process.env.STAGE}/${name}`,
              status: 'captured-local-preview',
              comparisonStatus: 'UNVERIFIED'
            }))
          };
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          git add "${target_dir}" "${manifest_path}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: archive ${STAGE} website screenshots (run ${RUN_ID})"
          git push origin "HEAD:${REF_NAME}"
      - name: Upload screenshots and HTML audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sindarealest-liquid-glass-preview-${{ github.run_number }}
          path: artifacts/liquid-glass-preview/
          if-no-files-found: error
          retention-days: 14
