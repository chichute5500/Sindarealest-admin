name: Liquid Glass isolated visual preview

on:
  push:
    branches:
      - fix/liquid-glass-redesign
      - fix/liquid-glass-audit-2026-10-19
    paths-ignore:
      - 'docs/static-web-reference/website-start-of-work.jpg'
      - 'docs/static-web-reference/website-end-of-work.jpg'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liquid-glass-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-preview:
    if: github.ref == 'refs/heads/fix/liquid-glass-redesign' || github.ref == 'refs/heads/fix/liquid-glass-audit-2026-10-19'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install temporary Playwright dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Run complete project tests
        run: npm test
      - name: Run project and migration checks
        run: npm run check
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Start read-only local static preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory public > /tmp/sindarealest-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Local static preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sindarealest-preview.log
          exit 1
      - name: Capture Light/Dark screenshots and audit responsive layouts
        run: node scripts/capture-liquid-glass-preview.mjs
      - name: Save start/end full-page website screenshots to reference folder
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/static-web-reference
          test -s artifacts/liquid-glass-preview/desktop-1440-light-full.jpg
          cp artifacts/liquid-glass-preview/desktop-1440-light-full.jpg docs/static-web-reference/website-start-of-work.jpg
          cp artifacts/liquid-glass-preview/desktop-1440-light-full.jpg docs/static-web-reference/website-end-of-work.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/static-web-reference/website-start-of-work.jpg docs/static-web-reference/website-end-of-work.jpg
          if ! git diff --cached --quiet; then
            git commit -m "docs: save Playwright start and end website screenshots"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload screenshots and HTML audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sindarealest-liquid-glass-preview-${{ github.run_number }}
          path: artifacts/liquid-glass-preview/
          if-no-files-found: error
          retention-days: 14
