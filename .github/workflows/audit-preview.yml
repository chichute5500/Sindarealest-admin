name: Audit — isolated Cloudflare storefront preview
on:
  push:
    branches:
      - fix/audit-2026-10
    paths:
      - 'functions/**'
      - 'public/**'
      - 'scripts/verify-audit-preview.mjs'
      - 'tests/**'
      - 'audit/**'
      - '.github/workflows/audit-preview.yml'
      - '.github/workflows/audit-after-qa.yml'
      - 'scripts/audit-*.mjs'
      - 'scripts/qa-material-network.mjs'
      - 'scripts/build-material-thumbnails.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-storefront-preview-2026-10
  cancel-in-progress: false
jobs:
  safe-preview:
    if: github.ref == 'refs/heads/fix/audit-2026-10'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout audit branch only
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund
      - name: Generate small logo UI asset (read-only source)
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow fonttools brotli
          python3 scripts/build-logo-asset.py
          python3 scripts/build-font-assets.py
          python3 scripts/build-material-thumbnails.py
          test -s public/logo-ui.webp
          test -s public/images/brand-emblem-nav.webp
          test -s public/images/theme-croc-dark-tile.webp
          test -s public/images/theme-croc-albino-tile.webp
      - name: Validate before deploy
        run: |
          npm run check
          npm test
      - name: Read-only verify separate Preview Pages, D1 and R2
        run: node scripts/verify-audit-preview.mjs
      - name: Stamp source revision in isolated Preview output only
        run: printf '%s\n' "$GITHUB_SHA" > public/audit-source-revision.txt
      - name: Deploy to separate Cloudflare Pages Preview project (NEVER storefront Production)
        run: >
          npx wrangler pages deploy public
          --project-name sindarealest-admin-preview
          --branch fix/audit-2026-10
      - name: Verify deployed no-JS catalog SSR, metadata and real 404 (GET only)
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const base='https://fix-audit-2026-10.sindarealest-admin-preview.pages.dev';
          for(const path of ['/','/sanpham']){
            const r=await fetch(base+path,{signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,path);
            const html=await r.text();
            assert.ok(html.includes('sd-server-rendered'),path+' no server-rendered products');
            assert.ok(html.includes('"@type":"ItemList"'),path+' missing product list schema');
            assert.ok(html.includes('rel="canonical"'),path+' missing canonical');
            console.log('PASS: no-JS SSR visible,',path,'HTTP',r.status);
          }

          const image=await fetch(base+'/logo-ui.webp',{signal:AbortSignal.timeout(12000)});
          assert.equal(image.status,200,'Compressed original logo image must exist');
          assert.match(image.headers.get('content-type')||'',/image\/webp/);
          assert.ok(Number(image.headers.get('content-length')||0)<140000,'Mobile UI brand image exceeds 140kB');
          console.log('PASS: optimized brand logo exists on live Preview');
          for(const name of ['theme-croc-dark-tile.webp','theme-croc-albino-tile.webp']){
            const texture=await fetch(base+'/images/'+name,{signal:AbortSignal.timeout(12000)});
            assert.equal(texture.status,200,'Optimized material texture missing: '+name);
            assert.match(texture.headers.get('content-type')||'',/image\/webp/);
            assert.ok(Number(texture.headers.get('content-length')||0)<120000,'Material tile must be small: '+name);
          }
          console.log('PASS: both optimized leather tile assets available on live Preview');
          for (const name of ['NotoSans-Regular','NotoSans-Bold','NotoSerif-Regular','NotoSerif-Bold']) {
            const font=await fetch(base+'/fonts/'+name+'.woff2',{signal:AbortSignal.timeout(12000)});
            assert.equal(font.status,200,'Lossless web font must exist: '+name);
            assert.match(font.headers.get('content-type')||'',/font\/woff2|application\/font-woff|application\/octet-stream/);
            assert.ok(Number(font.headers.get('content-length')||0)<220000,'Unexpectedly large WOFF2 font: '+name);
          }
          console.log('PASS: all four original-glyph WOFF2 fonts available on live Preview');
          const unknown=await fetch(base+'/qa-unknown-route-20261031',{signal:AbortSignal.timeout(12000)});
          assert.equal(unknown.status,404,'Unknown URLs must not serve home HTML');
          console.log('PASS: genuine HTTP 404, no customer/private API requests executed');
          JS
      - name: Record preview gate result
        run: |
          echo 'Audit-only branch deployed to separate Preview Pages project.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production deployment, database migrations or data writes were executed.' >> "$GITHUB_STEP_SUMMARY"
