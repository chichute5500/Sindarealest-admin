name: AI rewrite checks

on:
  pull_request:
    branches: [main, rewrite/ai-system-2026-10-14]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check project integrity
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Validate Workers AI binding configuration
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const c = readFileSync("wrangler.toml", "utf8");
            if (!/\[ai\]\s*\nbinding\s*=\s*"AI"/m.test(c)) process.exit(1);
            console.log("PASS: local AI binding is named AI; Preview and Production still need separate dashboard configuration.");
          '
