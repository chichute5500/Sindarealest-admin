name: Taobao Android owner-signed one-install release
# Manual only; no Production deploy or credential export.
on:
  workflow_dispatch:
  # Signed releases can be promoted by an explicit immutable tag on the tested
  # feature commit without merging unrelated PR #137 changes into Production.
  push:
    tags:
      - 'taobao-android-owner-release-v*'
permissions:
  contents: read
jobs:
  signed-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check approved branch, immutable source and durable signing credentials
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SD_TAOBAO_ANDROID_KEYSTORE_B64 }}
          SD_TAOBAO_RELEASE_STORE_PASSWORD: ${{ secrets.SD_TAOBAO_ANDROID_STORE_PASSWORD }}
          SD_TAOBAO_RELEASE_KEY_ALIAS: ${{ secrets.SD_TAOBAO_ANDROID_KEY_ALIAS }}
          SD_TAOBAO_RELEASE_KEY_PASSWORD: ${{ secrets.SD_TAOBAO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          if [[ "$GITHUB_REF" != 'refs/heads/feat/product-options-shoes-belts-phone-2026-10-28' &&
                "$GITHUB_REF" != refs/tags/taobao-android-owner-release-v* ]]; then
            echo '::error::Release trigger must be the approved feature branch or an explicit owner release tag'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for name in KEYSTORE_B64 SD_TAOBAO_RELEASE_STORE_PASSWORD SD_TAOBAO_RELEASE_KEY_ALIAS SD_TAOBAO_RELEASE_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing protected signing secret: $name"; exit 1; }
          done
      - name: Verify production importer really exists before a distributable APK
        shell: bash
        run: |
          set -euo pipefail
          base='https://sindarealest2.pages.dev'
          status="$(curl -sSL --max-time 30 -o "$RUNNER_TEMP/owner-import-page.html" -w '%{http_code}' "$base/admin/taobao-import.html")"
          test "$status" = '200' || { echo "::error::Production importer is not published yet (HTTP $status), release blocked"; exit 1; }
          grep -q '<title>Nhập ảnh Taobao · SinDarealest Admin</title>' "$RUNNER_TEMP/owner-import-page.html" || { echo '::error::Production importer HTML identity mismatch'; exit 1; }
          grep -q 'id="picker"' "$RUNNER_TEMP/owner-import-page.html" || { echo '::error::Production importer file-picker missing'; exit 1; }
          grep -q 'id="createForm"' "$RUNNER_TEMP/owner-import-page.html" || { echo '::error::Production importer product form missing'; exit 1; } || { echo "::error::Production import page mismatch"; exit 1; }
          code="$(curl -sSL --max-time 30 -o "$RUNNER_TEMP/owner-unauthed.json" -w '%{http_code}' "$base/api/admin/import-draft?id=12345678-1234-4234-8234-000000000001")"
          test "$code" = '401' || { echo "::error::Admin import API did not enforce auth on Production (HTTP $code)"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run security, API, and disposable real D1/R2 checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund
          npm run check
          npm test
          node tools/taobao-import/tests/import-draft.test.mjs
          node tests/taobao-import-local-d1-r2.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Load encrypted owner signing key only in ephemeral runner
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SD_TAOBAO_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/owner-release-keystore.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          test -s "$key_path"
          echo "SD_TAOBAO_RELEASE_KEYSTORE_FILE=$key_path" >> "$GITHUB_ENV"
      - name: Build signed APK and run Android lint
        working-directory: tools/taobao-import/android
        env:
          SD_TAOBAO_RELEASE_STORE_PASSWORD: ${{ secrets.SD_TAOBAO_ANDROID_STORE_PASSWORD }}
          SD_TAOBAO_RELEASE_KEY_ALIAS: ${{ secrets.SD_TAOBAO_ANDROID_KEY_ALIAS }}
          SD_TAOBAO_RELEASE_KEY_PASSWORD: ${{ secrets.SD_TAOBAO_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease :qa-sender:assembleDebug
      - name: Verify signed APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk='tools/taobao-import/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk"
      - name: Retain candidate only for emulator verification
        uses: actions/upload-artifact@v4
        with:
          name: taobao-owner-signed-qa-only
          path: tools/taobao-import/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 2
      - name: Keep cross-package test sender separately from signed application
        uses: actions/upload-artifact@v4
        with:
          name: taobao-emulator-cross-app-helper
          path: tools/taobao-import/android/qa-sender/build/outputs/apk/debug/qa-sender-debug.apk
          retention-days: 2
  emulator:
    needs: signed-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: taobao-owner-signed-qa-only
          path: signed-qa
      - uses: actions/download-artifact@v4
        with:
          name: taobao-emulator-cross-app-helper
          path: signed-test-helper
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          script: bash tools/taobao-import/tests/emulator-smoke.sh signed-qa/app-release.apk signed-test-helper/qa-sender-debug.apk
      - name: Publish ONE emulator-verified owner-signed APK, never signing secrets
        uses: actions/upload-artifact@v4
        with:
          name: SinDarealest-Taobao-Android-Owner-Release
          path: signed-qa/app-release.apk
          retention-days: 30
