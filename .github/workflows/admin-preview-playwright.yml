name: Admin Preview Playwright

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-preview-playwright
  cancel-in-progress: false

jobs:
  admin-preview:
    name: Test Admin Preview (read-only smoke checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies and Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Test the supplied Preview URL
        run: npx playwright test tests/e2e/admin-preview.spec.js
        env:
          # PR174 has its own verified, isolated Preview; the global Preview secret
          # points to a different deployment whose D1 login is not healthy.
          # Keep this smoke check enabled, targeting the matching PR174 Preview.
          ADMIN_TEST_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'chichute5500/Sindarealest-admin' && github.event.pull_request.head.ref == 'feat/manual-warranty-management-20261105' && 'https://warranty-pr174-20261105.sindarealest-admin-preview.pages.dev/admin/' || secrets.ADMIN_TEST_URL }}
          ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
