name: One-shot customer session PageSpeed Preview (no Production)

on:
  push:
    branches: [perf/account-session-on-demand-20261108]
    paths: [.github/workflows/storefront-session-preview-20261108.yml]

permissions:
  contents: read

concurrency:
  group: storefront-session-preview-20261108
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'push' && github.ref_name == 'perf/account-session-on-demand-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_PROJECT: sindarealest-admin-preview
      PREVIEW_BRANCH: session-on-demand-20261108
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard exact candidate and Preview-only target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/perf/account-session-on-demand-20261108'
          test "$PREVIEW_PROJECT" = 'sindarealest-admin-preview'
          test "$PREVIEW_BRANCH" = 'session-on-demand-20261108'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Verify isolated Preview resources differ from Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/$PREVIEW_PROJECT" > "$RUNNER_TEMP/session-preview.json"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/session-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/session-preview.json" "$RUNNER_TEMP/session-production.json"
      - name: Deploy exact candidate to isolated Preview branch only
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund
          npx wrangler pages deploy public --project-name "$PREVIEW_PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$CANDIDATE_SHA" --commit-message "PageSpeed candidate $CANDIDATE_SHA"
      - name: Verify deployed Preview points to the exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}/deployments"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" > "$RUNNER_TEMP/session-deployments.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/session-deployments.json','utf8'));
          const exact=(data.result||[]).some(d=>d.environment==='preview' &&
            d.deployment_trigger?.metadata?.branch==='session-on-demand-20261108' &&
            d.deployment_trigger?.metadata?.commit_hash===process.env.CANDIDATE_SHA);
          if(!exact)throw Error('Cloudflare did not report the exact candidate SHA on the isolated Preview branch');
          console.log('PASS: isolated Preview reports the exact PR candidate SHA.');
          NODE
          echo 'Production deployment: none. Production D1/R2 writes: none.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview URL: https://session-on-demand-20261108.sindarealest-admin-preview.pages.dev/' >> "$GITHUB_STEP_SUMMARY"
