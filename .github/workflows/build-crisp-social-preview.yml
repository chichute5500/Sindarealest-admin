name: Build approved crisp social preview binary (isolated)
on:
  push:
    branches:
      - fix/crisp-social-preview-native-2026-10-28
    paths:
      - scripts/build-crisp-social-preview.py
      - .github/workflows/build-crisp-social-preview.yml
permissions:
  contents: write
concurrency:
  group: crisp-social-preview-20261028
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build original-logo native-resolution preview (no Production)
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build-crisp-social-preview.py
          python - <<'PY'
          from PIL import Image
          from io import BytesIO
          import base64
          img=Image.open('public/og-sindarealest-crisp-20261028.jpg')
          preview=img.resize((480,252),Image.Resampling.LANCZOS)
          output=BytesIO()
          preview.save(output,format='JPEG',quality=73,optimize=True)
          print('CRISP_PREVIEW_THUMB_B64='+base64.b64encode(output.getvalue()).decode())
          PY
      - name: Commit only new immutable public preview JPEG to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/fix/crisp-social-preview-native-2026-10-28'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/og-sindarealest-crisp-20261028.jpg
          git diff --cached --name-only | grep -qx 'public/og-sindarealest-crisp-20261028.jpg'
          git commit -m 'Add truly native crisp pale-blue OG JPEG for social sharing'
          git push origin HEAD:fix/crisp-social-preview-native-2026-10-28
