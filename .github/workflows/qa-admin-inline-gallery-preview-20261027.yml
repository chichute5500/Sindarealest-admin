name: Owner Admin inline edit and touch gallery Preview (ISOLATED)
on:
  push:
    branches:
      - feature/admin-inline-edit-photo-drag-preorder-2026-10-27
    paths:
      - '.github/workflows/qa-admin-inline-gallery-preview-20261027.yml'
permissions:
  contents: read
concurrency:
  group: owner-admin-inline-preview-20261027
  cancel-in-progress: false
jobs:
  preview:
    name: Validate current SHA and deploy isolated nonproduction Admin Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TARGET: sindarealest-admin-preview
      CF_PREVIEW_BRANCH: owner-admin-quickedit-1027
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require exact feature branch, no Production mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/feature/admin-inline-edit-photo-drag-preorder-2026-10-27"
          test "$CF_TARGET" = "sindarealest-admin-preview"
          test "$CF_PREVIEW_BRANCH" != "main"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate all source and unit/integration tests
        run: |
          npm install --no-fund
          npm run check
          npm test
      - name: Verify isolated Admin Preview is bound to a different D1/R2 from Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/sindarealest-admin-preview" > "$RUNNER_TEMP/admin-preview.json"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/sindarealest2" > "$RUNNER_TEMP/production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/admin-preview.json" "$RUNNER_TEMP/production.json"
      - name: Deploy only isolated Pages branch Preview, never production
        run: |
          npx wrangler pages deploy public --project-name "$CF_TARGET" --branch "$CF_PREVIEW_BRANCH" --commit-hash "$GITHUB_SHA" --commit-message "Owner inline editor + touch image reorder $GITHUB_SHA"
      - name: Report exact Preview URL
        run: |
          echo "Owner review: https://owner-admin-quickedit-1027.sindarealest-admin-preview.pages.dev/admin/"
          echo "Source SHA: $GITHUB_SHA"
