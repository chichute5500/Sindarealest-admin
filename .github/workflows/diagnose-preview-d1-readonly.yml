name: Read-only diagnose Pages Preview and Production D1
on:
  push:
    branches:
      - diagnose/preview-d1-readonly-2026-10-16

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Pages bindings and count products (read-only)
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            throw new Error("Required Cloudflare repository secrets are missing.");
          }

          const base = "https://api.cloudflare.com/client/v4";
          async function api(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: \`Bearer \${token}\`,
                "Content-Type": "application/json",
                ...(options.headers || {})
              }
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              const details = (body.errors || []).map(e => e.message).join("; ");
              throw new Error(\`Cloudflare API request failed (\${response.status}): \${details || path}\`);
            }
            return body;
          }

          const projectResponse = await api(
            \`/accounts/\${accountId}/pages/projects/sindarealest2\`
          );
          const project = projectResponse.result;
          console.log("Pages project:", project.name);
          console.log("Configured production branch:", project.production_branch || "(not returned)");

          const configs = project.deployment_configs || {};
          const reports = [];

          for (const environment of ["production", "preview"]) {
            const config = configs[environment] || {};
            const databases = config.d1_databases || {};
            const buckets = config.r2_buckets || {};
            console.log(\`\n--- \${environment.toUpperCase()} bindings ---\`);

            for (const [binding, value] of Object.entries(databases)) {
              console.log(\`D1 binding \${binding}: database ID \${value?.id || "(missing ID)"}\`);
            }
            if (!Object.keys(databases).length) console.log("No D1 bindings returned by Pages API.");

            for (const [binding, value] of Object.entries(buckets)) {
              console.log(\`R2 binding \${binding}: bucket \${value?.name || "(missing name)"}\`);
            }

            const dbId = databases.DB?.id;
            if (!dbId) {
              reports.push({ environment, dbId: null, issue: "DB binding absent from API response" });
              console.log("RESULT: DB binding not found; product count cannot be queried for this environment.");
              continue;
            }

            const query = await api(
              \`/accounts/\${accountId}/d1/database/\${dbId}/query\`,
              {
                method: "POST",
                body: JSON.stringify({
                  sql: "SELECT COUNT(*) AS total_products, COALESCE(SUM(CASE WHEN published = 1 THEN 1 ELSE 0 END), 0) AS published_products, COALESCE(SUM(CASE WHEN published != 1 THEN 1 ELSE 0 END), 0) AS unpublished_products, COALESCE(SUM(CASE WHEN images_json IS NOT NULL AND length(trim(images_json)) > 2 THEN 1 ELSE 0 END), 0) AS products_with_image_data FROM products"
                })
              }
            );
            const result = query.result?.[0];
            if (!result?.success) {
              const message = (query.errors || []).map(e => e.message).join("; ") || "D1 query unsuccessful";
              reports.push({ environment, dbId, issue: message });
              console.log("RESULT: D1 count query failed:", message);
              continue;
            }
            const counts = result.results?.[0] || {};
            reports.push({ environment, dbId, counts });
            console.log("Read-only products summary:", JSON.stringify(counts));
          }

          console.log("\n--- COMPARISON ---");
          const production = reports.find(x => x.environment === "production");
          const preview = reports.find(x => x.environment === "preview");
          if (production?.dbId && preview?.dbId) {
            console.log("Preview uses the same D1 as Production:", production.dbId === preview.dbId);
            console.log("Production DB ID:", production.dbId);
            console.log("Preview DB ID:", preview.dbId);
            console.log("Production counts:", JSON.stringify(production.counts || production.issue || null));
            console.log("Preview counts:", JSON.stringify(preview.counts || preview.issue || null));
          }
          console.log("\nNo rows, settings, database bindings, or R2 objects were changed.");
          NODE
