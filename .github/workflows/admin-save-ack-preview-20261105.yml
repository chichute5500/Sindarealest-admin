name: Admin product save confirmation — isolated Preview candidate
on:
  push:
    branches: [fix/admin-product-write-ack-20261105]
    # Trigger once on this workflow's explicit candidate commit, not on routine code edits.
    paths: ['.github/workflows/admin-save-ack-preview-20261105.yml']
permissions:
  contents: read
concurrency:
  group: admin-save-ack-preview-20261105
  cancel-in-progress: false
jobs:
  one-candidate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TARGET: sindarealest-admin-preview
      CF_ALIAS: admin-save-ack-20261105
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard exact source and Preview-only destination
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/fix/admin-product-write-ack-20261105'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format=%s | grep -F '[admin-save-ack-preview-candidate]' >/dev/null
          test "$CF_TARGET" = 'sindarealest-admin-preview'
          test "$CF_ALIAS" = 'admin-save-ack-20261105'
          test "$CF_ALIAS" != 'main'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Local-only QA and preventive resource guard
        run: |
          set -euo pipefail
          npm install --no-fund
          npm run check
          npm test
          node scripts/qa-resource-guard.mjs
      - name: Verify Preview D1/R2 and Cloudflare project are NOT Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest-admin-preview" > "$RUNNER_TEMP/save-ack-preview.json"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/save-ack-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/save-ack-preview.json" "$RUNNER_TEMP/save-ack-production.json"
      - name: Deploy exact SHA to isolated Preview branch, NEVER main
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy public --project-name "$CF_TARGET" --branch "$CF_ALIAS" --commit-hash "$GITHUB_SHA" --commit-message "Admin save-ack QA Preview $GITHUB_SHA"
      - name: Verify Cloudflare reports exact Preview alias / branch / commit
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_TARGET}/deployments"
          found=0
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" > "$RUNNER_TEMP/save-ack-deployments.json"
            if jq -e --arg sha "$GITHUB_SHA" --arg branch "$CF_ALIAS" --arg host "$CF_ALIAS.$CF_TARGET.pages.dev" '.success == true and ([.result[] | select(.environment == "preview" and .latest_stage.status == "success" and .deployment_trigger.metadata.commit_hash == $sha and .deployment_trigger.metadata.branch == $branch and ([.aliases[]? | contains($host)] | any))] | length > 0)' "$RUNNER_TEMP/save-ack-deployments.json" >/dev/null; then found=1; break; fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          test "$found" = 1 || { echo '::error::Exact SHA Preview alias not confirmed'; exit 1; }
          echo "PASS: Verified isolated Preview alias with commit $GITHUB_SHA"
      - name: Prepare browser for single authenticated mobile QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'SD_OWNER_QA_SYSTEM_CHROME=1' >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Run single real Preview create / price / gallery / reload / cleanup QA
        shell: bash
        env:
          SD_ADMIN_SAVE_ACK_PREVIEW_BASE: https://admin-save-ack-20261105.sindarealest-admin-preview.pages.dev
          ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_TEST_PASSWORD" || { echo '::error::Missing Preview admin test password'; exit 1; }
          npx playwright test tests/e2e/admin-save-ack-preview-20261105.spec.js --config=playwright.owner-gesture.config.js --reporter=list
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-save-ack-preview-${{ github.sha }}
          path: |
            artifacts/admin-save-ack/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Report scoped result
        if: always()
        shell: bash
        run: |
          echo "Preview: https://${CF_ALIAS}.${CF_TARGET}.pages.dev/admin/" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production Main/D1/R2 unchanged. Only a QA-owned Preview product may be temporarily created and deleted.' >> "$GITHUB_STEP_SUMMARY"
