name: Deploy and QA FULL-SITE on isolated Cloudflare Preview ONLY
on:
  push:
    branches:
      - integration/full-site-admin-storefront-2026-10-25
    paths:
      - ".github/workflows/full-site-isolated-preview.yml"
      - "tests/e2e/full-site-isolated-preview.spec.js"
      - "tests/e2e/full-site-admin-security-a11y-perf.spec.js"
      - "scripts/qa-full-site-deployed-sha.mjs"
      - "functions/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sindarealest-full-site-isolated-preview
  cancel-in-progress: false

jobs:
  safe-deploy:
    name: Verify isolated bindings then deploy tested branch to isolated Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TARGET: sindarealest-admin-preview
      PREVIEW_ALIAS_BRANCH: integration-fullsite-20261025
    outputs:
      preview_url: ${{ steps.target.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refuse unexpected repository, branch, target or credential absence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/integration/full-site-admin-storefront-2026-10-25"
          test "$CF_TARGET" = "sindarealest-admin-preview"
          test "$PREVIEW_ALIAS_BRANCH" = "integration-fullsite-20261025"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Read-only verify Preview D1/R2 isolation before any deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { assessAdminPreviewBindings } from "./scripts/admin-preview-binding-safety.mjs";
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env;
          const root = "https://api.cloudflare.com/client/v4/accounts/" + account + "/pages/projects/";
          async function get(name) {
            const response = await fetch(root + name, { headers: {Authorization:"Bearer " + token} });
            if (!response.ok) throw Error("Cloudflare metadata unavailable; no deploy.");
            const value = await response.json();
            if (value.success !== true) throw Error("Cloudflare metadata rejected; no deploy.");
            return value;
          }
          const [admin, shop] = await Promise.all([get("sindarealest-admin-preview"),get("sindarealest2")]);
          const report = assessAdminPreviewBindings(admin, shop);
          for (const warning of report.warnings) console.log("::warning::" + warning);
          if (!report.deployAllowed) {
            for (const code of report.blockers) console.error("::error::" + code);
            throw Error("Isolated Preview binding not proven; deployment refused.");
          }
          const adminPreview = admin.result.deployment_configs.preview;
          const shopProd = shop.result.deployment_configs.production;
          const db = (b) => b?.d1_databases?.DB?.id || b?.d1_databases?.DB?.database_id;
          const r2 = (b,k) => b?.r2_buckets?.[k]?.name || b?.r2_buckets?.[k]?.bucket_name;
          if (!db(adminPreview) || !db(shopProd) || db(adminPreview) === db(shopProd))
            throw Error("Unsafe/missing Preview D1; no deployment.");
          if (!r2(adminPreview,"IMAGES") || [r2(shopProd,"IMAGES"),r2(shopProd,"ORIGINALS")].includes(r2(adminPreview,"IMAGES")))
            throw Error("Unsafe Preview IMAGES; no deployment.");
          if (r2(adminPreview,"ORIGINALS") && [r2(shopProd,"IMAGES"),r2(shopProd,"ORIGINALS"),r2(adminPreview,"IMAGES")].includes(r2(adminPreview,"ORIGINALS")))
            throw Error("Unsafe Preview ORIGINALS; no deployment.");
          console.log("PASS: safe isolated Pages Preview selected; metadata only; no resource IDs, names or tokens printed.");
          NODE
      - name: Install deps and run full source validations
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund
          npm audit --audit-level=high
          npm run check
          npm test
          node tests/storefront-integration-route.test.mjs
      - name: Publish exact SHA to isolated branch alias — never Production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name "$CF_TARGET" \
            --branch "$PREVIEW_ALIAS_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "full-site isolated Preview $GITHUB_SHA"
      - name: Verify exact deployed Cloudflare alias / branch / SHA (read only)
        run: node scripts/qa-full-site-deployed-sha.mjs
      - name: Expose exact non-production target
        id: target
        shell: bash
        run: |
          url="https://integration-fullsite-2026102.sindarealest-admin-preview.pages.dev"
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          echo "Isolated Preview URL: $url"
          echo "Exact source SHA: $GITHUB_SHA"
          echo "Production has not been deployed."
  browser-qa:
    name: Chromium PC/mobile/light/dark + public Admin login + API probe
    needs: safe-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FULL_SITE_PREVIEW_URL: ${{ needs.safe-deploy.outputs.preview_url }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-fund
      - name: Install Playwright browser test dependencies
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Run exact-Preview source/render/browser evidence
        run: npx playwright test tests/e2e/full-site-isolated-preview.spec.js tests/e2e/full-site-admin-security-a11y-perf.spec.js --workers=2 --reporter=line
      - name: Upload screenshots and QA report (no customer records)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-preview-evidence
          path: |
            artifacts/full-site-preview-evidence/
            artifacts/full-site-admin-security-a11y-perf/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
