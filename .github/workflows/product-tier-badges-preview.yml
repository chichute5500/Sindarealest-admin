name: Product tier badges — isolated storefront Preview

on:
  push:
    branches: [test]
    paths:
      - 'public/index.html'
      - '.github/workflows/product-tier-badges-preview.yml'

permissions:
  contents: read

concurrency:
  group: product-tier-badges-test-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.repository == 'chichute5500/Sindarealest-admin' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_PROJECT: sindarealest-admin-preview
      PREVIEW_BRANCH: product-tier-badges-test-20261109
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard Preview-only target and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/test'
          test "$PREVIEW_PROJECT" = 'sindarealest-admin-preview'
          test "$PREVIEW_BRANCH" = 'product-tier-badges-test-20261109'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install deploy tooling
        run: npm install --no-fund
      - name: Verify Preview bindings are isolated from Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/$PREVIEW_PROJECT" > "$RUNNER_TEMP/tier-preview.json"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/tier-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/tier-preview.json" "$RUNNER_TEMP/tier-production.json"
      - name: Deploy exact candidate to isolated Preview alias
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy public --project-name "$PREVIEW_PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$CANDIDATE_SHA" --commit-message "Product tier badge review $CANDIDATE_SHA"
      - name: Verify Cloudflare reports the exact Preview commit
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}/deployments"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" > "$RUNNER_TEMP/tier-deployments.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/tier-deployments.json','utf8'));
          const exact=(data.result||[]).some(d=>d.environment==='preview' &&
            d.deployment_trigger?.metadata?.branch==='product-tier-badges-test-20261109' &&
            d.deployment_trigger?.metadata?.commit_hash===process.env.CANDIDATE_SHA);
          if(!exact)throw Error('Cloudflare did not report the exact test candidate on the isolated Preview alias');
          console.log('PASS: isolated Preview reports the exact test candidate commit.');
          NODE
          echo 'Production deployment: none. Production D1/R2 writes: none.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview URL: https://product-tier-badges-test-20261109.sindarealest-admin-preview.pages.dev/' >> "$GITHUB_STEP_SUMMARY"
