name: Owner-approved production D1 0016-0017
on:
  push:
    branches: [release/d1-revision-only-2026-11-01]
    paths:
      - '.github/workflows/d1-production-only-0016-0017.yml'
      - 'scripts/d1-production-only-0016-0017.mjs'
permissions:
  contents: read
concurrency:
  group: owner-approved-production-d1-revisions
  cancel-in-progress: false
jobs:
  guarded-d1-migration:
    if: github.ref == 'refs/heads/release/d1-revision-only-2026-11-01'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund
      - name: Validate source, SQL parity and safety guards
        run: |
          npm run check
          npm test
          node tests/d1-production-identity.test.mjs
          node --check scripts/d1-production-only-0016-0017.mjs
      - name: Back up and apply only 0016 and 0017 on verified Production DB
        run: node scripts/d1-production-only-0016-0017.mjs
