name: Verify image backup Cloudflare bindings (READ-ONLY)
on:
  push:
    branches:
      - feat/automatic-r2-image-backup-20261105
    paths:
      - 'scripts/check-image-backup-cloudflare-readonly.mjs'
      - 'tests/image-backup-cloudflare-readonly.test.mjs'
      - '.github/workflows/verify-image-backup-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-backup-cloudflare-readonly-preflight
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_API_TOKEN }}
    steps:
      - name: Enforce exact repository/branch; read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/feat/automatic-r2-image-backup-20261105'
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_R2_READ_API_TOKEN"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify fail-closed preflight logic
        run: node tests/image-backup-cloudflare-readonly.test.mjs
      - name: Verify Cloudflare production binding identity and private backup bucket (GET only)
        run: node scripts/check-image-backup-cloudflare-readonly.mjs
      - name: Report preflight success
        if: success()
        run: |
          echo "Production IMAGE_BACKUPS binding and privacy verified by GET-only Cloudflare API. No Worker deployed or scheduled; no D1/R2 objects changed." >> "$GITHUB_STEP_SUMMARY"
