name: SinDarealest comprehensive read-only audit (isolated QA)
on:
  push:
    branches: [audit/full-security-css-qa-2026-10-28]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sd-full-audit-1028-${{ github.sha }}
  cancel-in-progress: false
jobs:
  android-apk:
    name: Android APK compile, WebView TLS and signature audit (no device grant)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK and Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify secure WebView bridge and manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MIXED_CONTENT_NEVER_ALLOW' android-admin/app/src/main/java/com/sindarealest/admin/MainActivity.java
          grep -Fq 'handler.cancel()' android-admin/app/src/main/java/com/sindarealest/admin/MainActivity.java
          grep -Fq 'setWebContentsDebuggingEnabled(false)' android-admin/app/src/main/java/com/sindarealest/admin/MainActivity.java
          grep -Fq 'android:usesCleartextTraffic="false"' android-admin/app/src/main/AndroidManifest.xml
          install -m 644 -D public/images/brand-emblem.png android-admin/app/src/main/res/drawable/brand_emblem.png
      - name: Compile and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd android-admin
          gradle --no-daemon :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.sindarealest.admin'"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -E 'READ_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|CAMERA'

  source:
    name: API, SQLite, release configuration, dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-fund
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test

  browser-storefront:
    name: Chromium Storefront welcome/theme/cart/checkout visual matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-fund
      - run: npm install --no-save --no-package-lock --no-fund @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Test static browser flow against disposable API fixtures (no Production writes)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > "$RUNNER_TEMP/storefront-browser.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .5; done
          SD_AUDIT_BASE_URL=http://127.0.0.1:4173 SD_STOREFRONT_TEST_URL=http://127.0.0.1:4173/ SD_OPTIONS_BASE_URL=http://127.0.0.1:4173 \
            npx playwright test tests/e2e/owner-css-parity-security.spec.js tests/e2e/storefront-welcome-device-theme-20261028.spec.js tests/e2e/product-options-mobile-desktop.spec.js --config=playwright.owner-gesture.config.js --workers=2 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-audit-${{ github.sha }}
          path: |
            artifacts/owner-css-parity-security/
            artifacts/welcome-device-theme-20261028/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  browser-admin:
    name: Chromium Admin responsive baseline and product-options parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-fund
      - run: npm install --no-save --no-package-lock --no-fund @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Independent responsive UI QA on disposable data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > "$RUNNER_TEMP/admin-browser.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/admin/ >/dev/null && break; sleep .5; done
          SD_OPTIONS_BASE_URL=http://127.0.0.1:4173 LOCAL_ADMIN_URL=http://127.0.0.1:4173/admin/ \
            npx playwright test tests/e2e/product-options-admin-mobile-desktop.spec.js tests/e2e/admin-search-live-input-race.spec.js tests/e2e/admin-static-baseline.spec.js --config=playwright.owner-gesture.config.js --workers=2 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-audit-${{ github.sha }}
          path: |
            artifacts/product-options/
            artifacts/admin-preview-evidence/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  isolated-preview:
    name: Verify isolated Cloudflare bindings and deploy QA only
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TARGET: sindarealest-admin-preview
      CF_BRANCH: full-security-audit-1028
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Refuse Production and mismatched revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/audit/full-security-css-qa-2026-10-28"
          test "$CF_TARGET" = "sindarealest-admin-preview"
          test "$CF_BRANCH" != "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-fund
      - name: Verify Cloudflare D1/R2 Preview is not Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/sindarealest-admin-preview" > "$RUNNER_TEMP/admin-preview.json"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/sindarealest2" > "$RUNNER_TEMP/production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/admin-preview.json" "$RUNNER_TEMP/production.json"
      - name: Deploy only isolated Preview
        run: npx wrangler pages deploy public --project-name "$CF_TARGET" --branch "$CF_BRANCH" --commit-hash "$GITHUB_SHA" --commit-message "Full audit isolated QA $GITHUB_SHA"
      - name: Check headers and unauthenticated admin rejection (read-only)
        shell: bash
        run: |
          set -euo pipefail
          url="https://full-security-audit-1028.sindarealest-admin-preview.pages.dev"
          curl -fsSI "$url/" | grep -i "x-frame-options: DENY"
          curl -fsSI "$url/" | grep -i "content-security-policy:"
          status="$(curl -sS -o "$RUNNER_TEMP/anon-admin.json" -w '%{http_code}' "$url/api/admin/session")"
          test "$status" = 401
