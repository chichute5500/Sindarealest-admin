name: Full Site Admin + Storefront integration acceptance (NO DEPLOY)
on:
  push:
    branches:
      - integration/full-site-admin-storefront-2026-10-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-scope:
    name: Verify approved Storefront hashes and unchanged Admin runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert exact original Hero and accepted HTML, and protect Admin
        shell: bash
        run: |
          set -euo pipefail
          BASE=777988063adabc3fac3796468f2ab0f77c5606ed
          test "$(git hash-object public/index.html)" = "a9d65d5732301bb774e729fee266ff173c6c46fe"
          test "$(git hash-object 'public/images/hero-upload/tb_image_share_1792519964514 (1).png')" = "c17cc9058ae3008dc662806d21d2cf8f7d83b8a9"
          test "$(git hash-object public/images/hero-upload/ai-marble-pedestal.webp)" = "25230efbf4d3c9457dc36ce91b75fbf60f56d157"
          for path in public/admin/index.html functions/_lib.js functions/api/orders.js functions/api/admin/products.js migrations/0008_product_sku_verification.sql; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$BASE:$path")" || {
              echo "::error::Protected Admin backend or schema changed: $path"; exit 1;
            }
          done
          git diff --name-only "$BASE"...HEAD > /tmp/integrated-changes
          while IFS= read -r path; do
            case "$path" in
              "public/index.html"|"public/404.html"|"public/images/hero-upload/tb_image_share_1792519964514 (1).png"|"public/images/hero-upload/ai-marble-pedestal.webp"|"public/images/liquid-glass-light.svg"|"public/images/liquid-glass-dark.svg"|"public/images/liquid-glass-light-mobile.svg"|"public/images/liquid-glass-dark-mobile.svg"|"functions/_storefront-route.js"|"functions/_middleware.js"|"functions/sitemap.xml.js"|"functions/api/products.js"|"tests/benefit-tiles-responsive.test.mjs"|"tests/detail-gallery-integrity.test.mjs"|"tests/order-trust-layout.test.mjs"|"tests/sitemap-safety.test.mjs"|"tests/product-card-liquid-glass.test.mjs"|"tests/storefront-integration-route.test.mjs"|"tests/storefront-reference-parity.test.mjs"|"tests/gallery-transition-mobile-cart-badge.test.mjs"|"tests/storefront-accessibility-contract.test.mjs"|"tests/storefront-operations.test.mjs"|"tests/admin-upgrade.test.mjs"|".github/workflows/full-site-integration-acceptance.yml"|"docs/integration/FULL-SITE-ACCEPTANCE-2026-10-25.md") ;;
              *) echo "::error::Unreviewed full integration change: $path"; exit 1;;
            esac
          done < /tmp/integrated-changes
          echo "PASS: no Admin, payment, D1 migration or locked Storefront assets were rewritten."
  storefront-contracts:
    name: Accepted mobile/PC UI, route and SKU contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run independent frontend and runtime acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          node tests/product-card-liquid-glass.test.mjs
          node tests/detail-gallery-integrity.test.mjs
          node tests/gallery-transition-mobile-cart-badge.test.mjs
          node tests/storefront-reference-parity.test.mjs
          node tests/benefit-tiles-responsive.test.mjs
          node tests/order-trust-layout.test.mjs
          node tests/storefront-accessibility-contract.test.mjs
          node tests/storefront-integration-route.test.mjs
  admin-commerce-contracts:
    name: Admin orders and QR, payment and SKU integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify Admin commerce contracts without remote writes
        shell: bash
        run: |
          set -euo pipefail
          node tests/fulfillment-payment-contract.test.mjs
          node tests/payment-ledger-route.test.mjs
          node tests/payment-qr-activation-race.test.mjs
          node tests/payment-qr-upload-atomicity.test.mjs
          node tests/admin-order-price-immutability.test.mjs
          node tests/admin-order-status-transition.test.mjs
