name: One-time Production D1 customer-auth schema (Owner PASS)
on:
  push:
    branches:
      - feat/zalo-customer-login-2026-10-29
    paths:
      - '.github/workflows/customer-auth-production-migrate-once.yml'
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/customer-auth-production-migrate-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-customer-auth-migrate-once
  cancel-in-progress: false

jobs:
  apply-once:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'ops(auth): apply one-time Production D1 auth migration after Owner PASS') ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 150 &&
       github.event.pull_request.head.ref == 'feat/zalo-customer-login-2026-10-29' &&
       github.event.pull_request.head.repo.full_name == 'chichute5500/Sindarealest-admin')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_AUTH_ONE_SHOT: owner-pass-google-20261029
      SD_AUTH_RELEASE_PR: "150"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: sindarealest2
      CLOUDFLARE_PAGES_BRANCH: main
    steps:
      - name: Checkout exact approved branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact Owner-authorized trigger message
        shell: bash
        run: |
          test "$(git log -1 --format=%s)" = 'ops(auth): apply one-time Production D1 auth migration after Owner PASS'
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler
        run: npm install --no-audit --no-fund
      - name: Validate all source and regression tests before Production D1 access
        run: |
          npm run check
          npm test
      - name: Check if Production D1 schema already ready without writes
        id: baseline
        continue-on-error: true
        run: node scripts/check-customer-auth-production-ready.mjs
      - name: Apply migrations once only if Production D1 auth schema missing
        id: migrate
        if: steps.baseline.outcome == 'failure'
        run: node scripts/migrate-customer-auth-production-once.mjs
      - name: Independently verify Production D1 after migration
        id: final
        if: steps.baseline.outcome == 'success' || steps.migrate.outcome == 'success'
        run: node scripts/check-customer-auth-production-ready.mjs
      - name: Publish exact result on head commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_RESULT: ${{ steps.final.outcome }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$FINAL_RESULT" == "success" ]]; then
            state=success
            description='Production D1 customer-auth schema and Google binding verified'
          else
            state=failure
            description='Production D1 auth migration/preflight did not pass; merge blocked'
          fi
          jq -n --arg state "$state" --arg description "$description" --arg url "$RUN_URL"             '{state:$state,context:"customer-auth-production-migration",description:$description,target_url:$url}' > /tmp/sd-d1-status.json
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             --data-binary @/tmp/sd-d1-status.json             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" >/dev/null
      - name: Confirmation
        if: success()
        run: echo "D1 schema and Google Production binding independently verified; Main merge remains a separate step." >> "$GITHUB_STEP_SUMMARY"
