name: One-time Production D1 customer-auth schema (Owner PASS)
on:
  push:
    branches:
      - feat/zalo-customer-login-2026-10-29
    paths:
      - '.github/workflows/customer-auth-production-migrate-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-customer-auth-migrate-once
  cancel-in-progress: false

jobs:
  apply-once:
    if: github.event.head_commit.message == 'ops(auth): apply one-time Production D1 auth migration after Owner PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_REF_TYPE: branch
      RELEASE_AUTH_ONE_SHOT: owner-pass-google-20261029
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: sindarealest2
      CLOUDFLARE_PAGES_BRANCH: main
    steps:
      - name: Checkout exact authorized feature branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler
        run: npm install --no-audit --no-fund
      - name: Validate source and regression tests before touching Production D1
        run: |
          npm run check
          npm test
      - name: Verify exact Production target and apply additive auth migrations ONCE
        id: migrate
        run: node scripts/migrate-customer-auth-production-once.mjs
      - name: Publish auditable result on exact GitHub commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_RESULT: ${{ steps.migrate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MIGRATION_RESULT" == "success" ]]; then
            state=success
            description='Production D1 customer-auth schema verified after migration'
          else
            state=failure
            description='Production D1 migration did not pass; do not merge'
          fi
          jq -n --arg state "$state" --arg description "$description" --arg url "$RUN_URL"             '{state:$state,context:"customer-auth-production-migration",description:$description,target_url:$url}' > /tmp/sd-d1-status.json
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             --data-binary @/tmp/sd-d1-status.json             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
      - name: Migration completion
        if: success()
        run: echo "Production D1 migration 0011-0014 verified. The Main merge remains gated by independent CI." >> "$GITHUB_STEP_SUMMARY"
