name: Private Production D1 Snapshot (No Product Changes)
on:
  push:
    branches:
      - audit/import-218-921-readonly-2026-10-26
    paths:
      - scripts/backup-production-d1-private-r2-2026-10-26.mjs
      - .github/workflows/backup-production-d1-private-r2-2026-10-26.yml
permissions:
  contents: read
concurrency:
  group: sindarealest-production-d1-private-backup-2026-10-26
  cancel-in-progress: false
jobs:
  private-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
    steps:
      - name: Guard isolated audit branch
        run: |
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/audit/import-218-921-readonly-2026-10-26"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install R2 client
        run: npm install --no-save --no-package-lock --no-audit --no-fund @aws-sdk/client-s3@3.914.0
      - name: Export complete Production D1 into access-controlled private R2 and read back
        run: node scripts/backup-production-d1-private-r2-2026-10-26.mjs
