name: Admin Preview diagnostic smoke test

on:
  push:
    branches:
      - feature/admin-isolated-handoff-2026-10-20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-preview-diagnostics
  cancel-in-progress: false

jobs:
  admin-preview:
    name: Verify the real ADMIN Preview and retain safe diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ADMIN branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-isolated-handoff-2026-10-20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Test the configured Preview URL
        run: npx playwright test tests/e2e/admin-preview.spec.js --reporter=line,html
        env:
          ADMIN_TEST_URL: ${{ secrets.ADMIN_TEST_URL }}
          ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}

      - name: Upload safe Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-preview-diagnostics-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
