name: ADMIN disposable remote D1 Restore acceptance (self-deleting)

on:
  push:
    branches: [feature/admin-isolated-handoff-2026-10-20]
    paths:
      - '.github/workflows/admin-disposable-restore.yml'
      - 'scripts/qa-admin-disposable-remote-restore.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-disposable-remote-d1-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Guard Admin-only branch and available token
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/feature/admin-isolated-handoff-2026-10-20"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned Wrangler migration executor
        run: npm install --no-fund
      - name: Execute real Restore POST handler against brand-new unbound remote D1; delete by verified UUID
        run: node scripts/qa-admin-disposable-remote-restore.mjs
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-disposable-d1-restore-${{ github.run_number }}
          path: artifacts/disposable-remote-restore/
          if-no-files-found: warn
          retention-days: 14
