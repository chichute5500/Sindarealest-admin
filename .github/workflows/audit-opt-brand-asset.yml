name: Audit — commit optimized brand asset to branch only
on:
  push:
    branches: [fix/audit-2026-10]
    paths:
      - '.github/workflows/audit-opt-brand-asset.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize-original-logo:
    if: github.ref == 'refs/heads/fix/audit-2026-10'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate asset without editing source
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 scripts/build-logo-asset.py
          test -s public/logo-ui.webp
      - name: Commit generated binary only to the audit branch
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = 'fix/audit-2026-10'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/logo-ui.webp
          if git diff --cached --quiet; then
            echo 'Brand asset already matches audited original'
            exit 0
          fi
          git diff --cached --name-only | grep -qx 'public/logo-ui.webp'
          git commit -m 'perf(assets): retain compressed mobile brand logo for all deployment modes'
          git push origin HEAD:fix/audit-2026-10
