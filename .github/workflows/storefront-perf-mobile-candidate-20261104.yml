name: One-shot Storefront mobile Lighthouse Preview (no Production)
on:
  # GitHub App file commits emit push checks, not necessarily PR synchronize.
  # A marker-only push to the exact experimental branch allows bounded QA.
  push:
    branches: [fix/storefront-mobile-critical-requests-20261104]
    paths: [docs/qa/PERF_MOBILE_20261104.trigger]
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: [docs/qa/PERF_MOBILE_20261104.trigger]
permissions:
  contents: read
concurrency:
  group: storefront-perf-mobile-candidate-20261104
  cancel-in-progress: false
jobs:
  preview-qa:
    if: (github.event_name == 'push' && github.ref_name == 'fix/storefront-mobile-critical-requests-20261104') || (github.event_name == 'pull_request' && github.head_ref == 'fix/storefront-mobile-critical-requests-20261104')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PERF_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard exact candidate and run isolated Preview tests
        run: bash scripts/qa-storefront-perf-mobile-pipeline.sh
      - name: Save bound evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-mobile-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/perf-mobile-20261104/
          if-no-files-found: warn
          retention-days: 14
      - name: Confirm no Production deployment
        if: always()
        run: |
          echo "Only separate sindarealest-admin-preview is an allowed deployment target." >> "$GITHUB_STEP_SUMMARY"
          echo "Main and Production D1/R2 remain untouched." >> "$GITHUB_STEP_SUMMARY"
