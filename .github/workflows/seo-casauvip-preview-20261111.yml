name: SEO exact candidate isolated Preview (no Production)
# Final candidate includes corrected canonical sitemap routing assertion.
on:
  push:
    branches: [seo-casauvip-20261111]
    paths: [public/index.html, .github/workflows/seo-casauvip-preview-20261111.yml]

permissions:
  contents: read

concurrency:
  group: seo-casauvip-preview-20261111
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_PROJECT: sindarealest-admin-preview
      PREVIEW_BRANCH: seo-casauvip-20261111
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard exact candidate and Preview-only target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/seo-casauvip-20261111'
          test "$PREVIEW_PROJECT" = 'sindarealest-admin-preview'
          test "$PREVIEW_BRANCH" = 'seo-casauvip-20261111'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Verify isolated Preview resources differ from Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/$PREVIEW_PROJECT" > "$RUNNER_TEMP/seo-preview.json"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/seo-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/seo-preview.json" "$RUNNER_TEMP/seo-production.json"
      - name: Deploy exact candidate to isolated branch Preview
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund
          npx wrangler pages deploy public --project-name "$PREVIEW_PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$CANDIDATE_SHA" --commit-message "SEO candidate $CANDIDATE_SHA"
      - name: Verify deployed alias and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}/deployments"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" > "$RUNNER_TEMP/seo-deployments.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/seo-deployments.json','utf8'));
          const exact=(data.result||[]).some(d=>d.environment==='preview' &&
            d.deployment_trigger?.metadata?.branch===process.env.PREVIEW_BRANCH &&
            d.deployment_trigger?.metadata?.commit_hash===process.env.CANDIDATE_SHA);
          if(!exact)throw Error('Cloudflare did not report exact SEO candidate SHA on Preview branch');
          console.log('PASS: isolated Preview reports exact SEO candidate SHA.');
          NODE
          echo "Preview: https://seo-casauvip-20261111.sindarealest-admin-preview.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA: $CANDIDATE_SHA; Production deploy: none." >> "$GITHUB_STEP_SUMMARY"

  browser-qa:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://seo-casauvip-20261111.sindarealest-admin-preview.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --only-shell chromium
      - name: Capture desktop and mobile category and product
        shell: bash
        run: |
          mkdir -p artifacts/seo-preview
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const [device,viewport] of [['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]]) {
            const page=await browser.newPage({viewport,deviceScaleFactor:1,isMobile:device==='mobile',hasTouch:device==='mobile'});
            for(const [kind,path,expected] of [
              ['category','/sanpham/vinamnu','Ví da cá sấu nam và nữ'],
              ['product','/sanpham/sneaker/SD-SN021','Mẫu #021']
            ]) {
              const response=await page.goto(process.env.PREVIEW_URL+path,{waitUntil:'domcontentloaded',timeout:20000});
              if(response.status()!==200)throw Error(device+' '+path+' HTTP '+response.status());
              if(kind==='product')await page.locator('#detailTitle').waitFor({state:'visible',timeout:20000});
              else await page.getByRole('heading',{name:expected,level:1}).waitFor({state:'visible',timeout:15000});
              await page.waitForFunction(sel=>{const img=document.querySelector(sel);return img?.complete&&img.naturalWidth>0},kind==='product'?'#detailMainImage':'#catalogGrid img',{timeout:20000});
              await page.waitForTimeout(600);
              const data=await page.evaluate((kind) => ({
                title:document.title,
                visibleH1:[...document.querySelectorAll('h1')].filter(e=>!!e.getClientRects().length).map(e=>e.textContent.trim()),
                canonical:document.querySelector('link[rel="canonical"]')?.href,
                viewport:innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                images:[...document.querySelectorAll(kind==='product'?'#productOverlay img':'#catalogGrid img')].slice(0,4).map(i=>({alt:i.alt,loaded:i.complete&&i.naturalWidth>0}))
              }),kind);
              await page.screenshot({path:'artifacts/seo-preview/'+device+'-'+kind+'.png'});
              if(data.visibleH1.length!==1)throw Error(device+' '+kind+' visible H1 count '+data.visibleH1.length);
              if(kind==='category' && data.images.length<1)throw Error(device+' category has no product images');
              report.push({device,kind,path,http:response.status(),...data});
            }
            await page.close();
          }
          await browser.close();
          writeFileSync('artifacts/seo-preview/report.json',JSON.stringify({sha:process.env.GITHUB_SHA,report},null,2));
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Upload SHA-bound visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-preview-visual-${{ github.sha }}
          path: artifacts/seo-preview/
          if-no-files-found: warn
          retention-days: 14
