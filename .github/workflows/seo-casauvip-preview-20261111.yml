name: SEO exact candidate isolated Preview (no Production)
# Final candidate includes corrected canonical sitemap routing assertion.
on:
  push:
    branches: [seo-casauvip-20261111]
    paths: [.github/workflows/seo-casauvip-preview-20261111.yml]

permissions:
  contents: read

concurrency:
  group: seo-casauvip-preview-20261111
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_PROJECT: sindarealest-admin-preview
      PREVIEW_BRANCH: seo-casauvip-20261111
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Guard exact candidate and Preview-only target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/seo-casauvip-20261111'
          test "$PREVIEW_PROJECT" = 'sindarealest-admin-preview'
          test "$PREVIEW_BRANCH" = 'seo-casauvip-20261111'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Verify isolated Preview resources differ from Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/$PREVIEW_PROJECT" > "$RUNNER_TEMP/seo-preview.json"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/seo-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/seo-preview.json" "$RUNNER_TEMP/seo-production.json"
      - name: Deploy exact candidate to isolated branch Preview
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund
          npx wrangler pages deploy public --project-name "$PREVIEW_PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$CANDIDATE_SHA" --commit-message "SEO candidate $CANDIDATE_SHA"
      - name: Verify deployed alias and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}/deployments"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" > "$RUNNER_TEMP/seo-deployments.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/seo-deployments.json','utf8'));
          const exact=(data.result||[]).some(d=>d.environment==='preview' &&
            d.deployment_trigger?.metadata?.branch===process.env.PREVIEW_BRANCH &&
            d.deployment_trigger?.metadata?.commit_hash===process.env.CANDIDATE_SHA);
          if(!exact)throw Error('Cloudflare did not report exact SEO candidate SHA on Preview branch');
          console.log('PASS: isolated Preview reports exact SEO candidate SHA.');
          NODE
          echo "Preview: https://seo-casauvip-20261111.sindarealest-admin-preview.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA: $CANDIDATE_SHA; Production deploy: none." >> "$GITHUB_STEP_SUMMARY"
