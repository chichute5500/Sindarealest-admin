name: D1 index optimization — PREVIEW only (guarded)

on:
  push:
    branches:
      - perf/d1-rows-read-safe-2026-10-30
    paths:
      - '.github/workflows/d1-preview-index-apply-guarded.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-preview-index-guarded
  cancel-in-progress: false

jobs:
  apply:
    name: Apply additive indexes to exact Preview D1 after safety and live parity gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guard exact repo, branch and Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/perf/d1-rows-read-safe-2026-10-30"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify immutable feature HEAD before making schema changes
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/perf/d1-rows-read-safe-2026-10-30 | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA" || {
            echo "::error::Branch HEAD moved; refusing Preview D1 index apply."
            exit 1
          }
      - name: Test project and SQLite index parity before remote work
        run: |
          npm install --no-fund
          npm run check
          node tests/d1-rows-read-regression.test.mjs
      - name: Verify binding + bookmark, apply 7 indexes to Preview D1 only, compare actual SQL results
        run: node scripts/d1-preview-index-apply-guarded.mjs
      - name: Upload recovery bookmark and sanitized validation metrics (no order data)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-preview-index-checkpoint
          path: artifacts/d1-preview-index/checkpoint.json
          if-no-files-found: ignore
          retention-days: 7
