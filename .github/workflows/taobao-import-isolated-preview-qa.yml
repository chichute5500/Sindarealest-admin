name: Taobao importer isolated Preview and real D1/R2 QA
on:
  push:
    branches: [feat/product-options-shoes-belts-phone-2026-10-28]
    paths:
      - '.github/workflows/taobao-import-isolated-preview-qa.yml'
      - 'public/admin/taobao-import.html'
      - 'functions/api/admin/import-draft.js'
      - 'functions/_taobao-official.js'
      - 'functions/api/admin/taobao-photos.js'
      - 'functions/api/admin/taobao-photo.js'
      - 'tools/taobao-import/web/taobao-import-client.js'
      - 'tests/taobao-official-import.test.mjs'
      - 'tests/taobao-owner-real-share-probe.mjs'
      - 'functions/api/admin/upload.js'
      - 'functions/_lib.js'
      - 'migrations/**'
      - 'tests/taobao-import-local-d1-r2.test.mjs'
      - 'tests/e2e/taobao-import-real-indexeddb.spec.js'
      - 'tools/taobao-import/tests/import-draft.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sd-taobao-import-isolated-preview
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and isolated real D1/R2 import
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/feat/product-options-shoes-belts-phone-2026-10-28'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --no-fund
          npm run check
          node tools/taobao-import/tests/import-draft.test.mjs
          node tests/taobao-import-local-d1-r2.test.mjs
          node tests/taobao-official-import.test.mjs
          node tests/taobao-owner-real-share-probe.mjs
      - name: Exercise real Chromium IndexedDB across reloads
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
          if command -v google-chrome >/dev/null 2>&1; then
            export SD_OWNER_QA_SYSTEM_CHROME=1
          else
            npx playwright install chromium
          fi
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public >/tmp/taobao-browser-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/admin/taobao-import.html >/dev/null; then break; fi
            sleep .3
          done
          npx playwright test tests/e2e/taobao-import-real-indexeddb.spec.js --config=playwright.owner-gesture.config.js --reporter=list
      - name: Verify nonproduction D1/R2 isolation before deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/sindarealest-admin-preview" > "$RUNNER_TEMP/taobao-preview.json"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/sindarealest2" > "$RUNNER_TEMP/taobao-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/taobao-preview.json" "$RUNNER_TEMP/taobao-production.json"
      - name: Deploy ONLY to independent Preview project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx wrangler pages deploy public --project-name 'sindarealest-admin-preview' --branch 'taobao-import-20261028' --commit-hash "$GITHUB_SHA" --commit-message "Taobao importer isolated preview $GITHUB_SHA"
      - name: Smoke real Preview and anonymous API rejection
        shell: bash
        run: |
          set -euo pipefail
          base='https://taobao-import-20261028.sindarealest-admin-preview.pages.dev'
          page_code="$(curl -sSL --max-time 30 --output "$RUNNER_TEMP/taobao-page.html" --write-out '%{http_code}' "$base/admin/taobao-import.html")"
          echo "Importer page HTTP status: $page_code"
          echo "Importer page bytes: $(wc -c < "$RUNNER_TEMP/taobao-page.html")"
          grep -oE '<title>[^<]{1,120}</title>' "$RUNNER_TEMP/taobao-page.html" | head -1 || true
          test "$page_code" = '200' || { echo "::error::Importer preview page HTTP $page_code"; exit 1; }
          grep -q 'SinDarealest' "$RUNNER_TEMP/taobao-page.html" || { echo "::error::Importer preview content not delivered"; exit 1; }
          code="$(curl -sSL --max-time 30 --output "$RUNNER_TEMP/taobao-unauthed.json" --write-out '%{http_code}' "$base/api/admin/import-draft?id=12345678-1234-4234-8234-000000000001")"
          echo "Anonymous import API HTTP status: $code"
          test "$code" = '401' || { echo "::error::Expected anonymous request rejection 401, got $code"; exit 1; }
          echo 'PASS: independent Cloudflare Preview and anonymous importer access denied.'
