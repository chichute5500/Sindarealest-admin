name: Verify SinDarealest source

on:
  push:
    branches:
      - main
      - cleanup/**
      - maintenance/**
  pull_request:
    branches:
      - main
      - fix/**
      - rewrite/**

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source integrity and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check source integrity
        run: npm run check

      - name: Run regression tests
        run: npm test
