name: Stage 921 R2 Photos to Production (No D1 Changes)
on:
  push:
    branches:
      - audit/import-218-921-readonly-2026-10-26
    paths:
      - docs/import/RUN-PRODUCTION-R2-STAGE-2026-10-26.trigger
permissions:
  contents: read
concurrency:
  group: owner-import-r2-prod-staging-2026-10-26
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
    steps:
      - name: Enforce isolated cutover branch
        run: |
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/audit/import-218-921-readonly-2026-10-26"
          test -n "$R2_PRODUCTION_ACCESS_KEY_ID"
          test -n "$R2_PRODUCTION_SECRET_ACCESS_KEY"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install production R2 transfer client
        run: npm install --no-save --no-package-lock --no-audit --no-fund @aws-sdk/client-s3@3.914.0
      - name: Stage Preview image copies in isolated Production R2 without D1 writes
        run: node scripts/stage-imported-r2-to-production-2026-10-26.mjs
