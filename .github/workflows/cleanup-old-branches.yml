name: One-time branch consolidation

on:
  push:
    branches:
      - fix/active

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Keep only main, backup, and active fix branch
        if: contains(github.event.head_commit.message, 'ops: reduce branches')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|backup|fix/active)
                echo "KEEP $branch"
                ;;
              *)
                echo "DELETE $branch"
                git push origin --delete "$branch"
                ;;
            esac
          done
