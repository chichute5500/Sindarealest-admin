name: Isolated Admin project Preview binding safety — READ ONLY
on:
  push:
    branches:
      - integration/full-site-admin-storefront-2026-10-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify isolated Admin Preview target against Storefront Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only binding identities — never log IDs, names or secret values
        run: |
          node --input-type=module <<'NODE'
          import { assessAdminPreviewBindings } from './scripts/admin-preview-binding-safety.mjs';
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env;
          if (!token || !account) throw new Error("Cloudflare read credentials unavailable; no Preview deployment allowed.");
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/`;
          async function get(name) {
            const result = await fetch(endpoint + name, { headers: { Authorization: `Bearer ${token}` } });
            if (!result.ok) throw new Error("Cloudflare Pages project metadata unavailable.");
            return await result.json();
          }
          const admin = await get("sindarealest-admin-preview");
          const storefront = await get("sindarealest2");
          const safety = assessAdminPreviewBindings(admin, storefront);
          for (const code of safety.blockers) console.error("::error::" + code);
          for (const code of safety.warnings) console.log("::warning::" + code);
          if (!safety.deployAllowed) throw new Error("ISOLATED_ADMIN_PREVIEW_UNSAFE; no deploy, no D1/R2 write tests.");
          const liveDB = storefront.result?.deployment_configs?.production?.d1_databases?.DB?.id;
          const storePreviewDB = storefront.result?.deployment_configs?.preview?.d1_databases?.DB?.id;
          if (liveDB && storePreviewDB && liveDB === storePreviewDB)
            console.log("::warning::STOREFRONT_PAGES_PREVIEW_SHARES_PRODUCTION_D1 — do not use sindarealest2 Preview for write testing.");
          console.log("PASS: selected target is isolated Admin Preview project; separate from Storefront Production D1/IMAGES and private originals. No API writes or deploy.");
          NODE
