name: Shipping policy exact candidate Preview
on:
  push:
    branches: [fix-shipping-policy-schema-20261112]
    paths:
      - 'functions/_middleware.js'
      - 'public/terms-of-service.html'
      - 'tests/seo-category-keywords.test.mjs'
      - '.github/workflows/shipping-policy-preview-20261112.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/_middleware.js'
      - 'public/terms-of-service.html'
      - 'tests/seo-category-keywords.test.mjs'
      - '.github/workflows/shipping-policy-preview-20261112.yml'
permissions:
  contents: read
concurrency:
  group: shipping-policy-preview-20261112
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_PROJECT: sindarealest-admin-preview
      PREVIEW_BRANCH: fix-shipping-policy-schema-20261112
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check exact branch, SHA, and Preview target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            test "$GITHUB_REF" = 'refs/heads/fix-shipping-policy-schema-20261112'
          else
            test "$GITHUB_EVENT_NAME" = 'pull_request'
            test "$GITHUB_HEAD_REF" = 'fix-shipping-policy-schema-20261112'
          fi
          test "$PREVIEW_PROJECT" = 'sindarealest-admin-preview'
          test "$PREVIEW_BRANCH" = 'fix-shipping-policy-schema-20261112'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install pinned Wrangler
        run: npm install --no-save --no-package-lock --no-audit --no-fund wrangler@4.152.0
      - name: Verify Preview bindings differ from Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/${PREVIEW_PROJECT}" > "$RUNNER_TEMP/shipping-preview.json"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/shipping-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/shipping-preview.json" "$RUNNER_TEMP/shipping-production.json"
      - name: Deploy exact candidate to Preview only
        run: npx wrangler pages deploy public --project-name "$PREVIEW_PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$CANDIDATE_SHA" --commit-message "Shipping policy Preview $CANDIDATE_SHA"
      - name: Verify deployed Preview branch and SHA
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}/deployments"
          curl -fsS --max-time 25 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" > "$RUNNER_TEMP/shipping-deployments.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/shipping-deployments.json','utf8'));
          const exact=(data.result||[]).some(d=>d.environment==='preview' &&
            d.deployment_trigger?.metadata?.branch===process.env.PREVIEW_BRANCH &&
            d.deployment_trigger?.metadata?.commit_hash===process.env.CANDIDATE_SHA);
          if(!exact)throw Error('Preview does not report the exact candidate SHA.');
          console.log('PASS: exact Preview SHA verified.');
          NODE
          echo "Preview: https://${PREVIEW_BRANCH}.sindarealest-admin-preview.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA: $CANDIDATE_SHA. Production deployment: none." >> "$GITHUB_STEP_SUMMARY"
