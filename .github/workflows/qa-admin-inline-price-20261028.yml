name: QA Admin inline price save (isolated Preview, no Production writes)
on:
  push:
    branches: [fix/admin-inline-price-validation-2026-10-28]
    paths:
      - '.github/workflows/qa-admin-inline-price-20261028.yml'
      - 'public/admin/index.html'
      - 'package.json'
      - 'tests/admin-inline-price-validation.test.mjs'
      - 'tests/e2e/admin-inline-price-mobile-desktop.spec.js'
permissions:
  contents: read
concurrency:
  group: sd-inline-price-1028
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify exact QA-only branch and immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/fix/admin-inline-price-validation-2026-10-28'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Source checks and complete regression suite
        run: |
          npm install --no-fund
          npm run check
          npm test
      - name: Browser QA setup
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo 'SD_OWNER_QA_SYSTEM_CHROME=1' >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test price save on mobile and desktop, light and dark
        env:
          SD_INLINE_PRICE_BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public >/tmp/inline-price-qa.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/admin/ >/dev/null; then break; fi
            sleep .3
          done
          npx playwright test tests/e2e/admin-inline-price-mobile-desktop.spec.js --config=playwright.owner-gesture.config.js --reporter=list
      - name: Check Preview D1/R2 identities differ from Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/sindarealest-admin-preview" > "$RUNNER_TEMP/inline-price-preview.json"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/sindarealest2" > "$RUNNER_TEMP/inline-price-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/inline-price-preview.json" "$RUNNER_TEMP/inline-price-production.json"
      - name: Deploy checked source to isolated Preview only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/admin-inline-price-validation-2026-10-28'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx wrangler pages deploy public --project-name 'sindarealest-admin-preview' --branch 'inline-price-1028' --commit-hash "$GITHUB_SHA" --commit-message "Admin inline price fix $GITHUB_SHA"
          echo 'Owner preview: https://inline-price-1028.sindarealest-admin-preview.pages.dev/admin/'
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-inline-price-${{ github.sha }}
          path: |
            artifacts/admin-inline-price/
            test-results/
          if-no-files-found: warn
          retention-days: 14
