name: Validate project integrity and tests

on:
  pull_request:
    branches:
      - fix/ai-review-quota-scope-2026-10-15
  push:
    branches:
      - fix/workers-ai-malformed-feature-array-2026-10-16

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project integrity
        run: npm run check

      - name: Run API and data smoke tests
        run: npm test
