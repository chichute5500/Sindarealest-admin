name: Deploy ADMIN feature branch to isolated Cloudflare Pages Preview

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "ADMIN feature branch to deploy (must be the isolated feature branch)"
        required: true
        type: choice
        options:
          - feature/admin-isolated-handoff-2026-10-20
        default: feature/admin-isolated-handoff-2026-10-20

permissions:
  contents: read

concurrency:
  group: admin-feature-pages-preview
  cancel-in-progress: false

jobs:
  deploy-admin-preview:
    name: Deploy isolated feature Preview (never production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PREVIEW_BRANCH: feature-admin-isolated-handoff-2026-10-20
      SOURCE_BRANCH: ${{ inputs.source_branch }}
    steps:
      - name: Guard exact feature branch and configured target
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_BRANCH" = "feature/admin-isolated-handoff-2026-10-20" || {
            echo "::error::Only the approved ADMIN feature branch may be deployed."
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "::error::Missing CLOUDFLARE_PAGES_PROJECT repository variable"; exit 1; }
          test "$CLOUDFLARE_PAGES_PROJECT" = "sindarealest-admin-preview" || {
            echo "::error::Unexpected Admin Preview Pages project; refusing to deploy."
            exit 1
          }

      - name: Check out exact feature branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}

      - name: Record deployed source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-fund

      - name: Validate source and tests
        run: |
          npm run check
          npm test

      - name: Verify project production branch remains main
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}")"
          printf '%s' "$response" | jq -e '.success == true and .result.production_branch == "main"' >/dev/null || {
            echo "::error::Production branch is not confirmed as main; refusing Preview deployment."
            exit 1
          }

      - name: Deploy to isolated non-production branch
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "ADMIN feature Preview $SOURCE_SHA"

      - name: Print Preview alias and source commit
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          echo "Preview branch: $PREVIEW_BRANCH"
          echo "Expected branch alias: https://${PREVIEW_BRANCH}.${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
          echo "Deployed source commit: $SOURCE_SHA"
          echo "Production branch is checked to remain main; this workflow does not deploy to main."
