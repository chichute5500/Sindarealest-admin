name: Non-Hero catalog-filter live Preview audit

on:
  push:
    branches:
      - fix/liquid-glass-audit-2026-10-19
    paths:
      - 'public/index.html'
      - 'scripts/cloudflare-access-service-token.mjs'
      - 'scripts/preview-external-read-allowlist.mjs'
      - '.github/workflows/catalog-filter-preview-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-filter-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/fix/liquid-glass-audit-2026-10-19'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://5c3369cb.sindarealest2.pages.dev/
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || 'e520f2230ac9945b35f525adc2b99026' }}
      CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check out exact branch commit with ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Preview SHA and capture only catalog filters
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { promises as fs } from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { chromium } from 'playwright';
          import { buildCloudflareAccessHeaders } from './scripts/cloudflare-access-service-token.mjs';
          import { isApprovedPreviewExternalRead } from './scripts/preview-external-read-allowlist.mjs';
          import { sanitizeText } from './scripts/sanitize-audit-value.mjs';

          const expectedBranch = 'fix/liquid-glass-audit-2026-10-19';
          const sourceSha = String(process.env.GITHUB_SHA || '').trim().toLowerCase();
          const branch = String(process.env.GITHUB_REF_NAME || '').trim();
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const apiToken = String(process.env.CLOUDFLARE_PAGES_READ_TOKEN || '').trim();
          const outDir = path.join(process.cwd(), 'artifacts', 'catalog-filter-preview');
          const manifestPath = path.join(outDir, 'catalog-filter-audit.json');
          const viewports = [
            { name: 'mobile-360', width: 360, height: 800 },
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'desktop-1440', width: 1440, height: 900 }
          ];
          const themes = ['light', 'dark'];
          const targetSelectors = ['#products .catalog-tools'];
          const previewUrl = new URL(process.env.PREVIEW_URL);
          const origin = previewUrl.origin;
          const targetUrl = new URL('#products', previewUrl).href;
          assert.equal(branch, expectedBranch, 'Capture is restricted to the approved Preview branch.');
          assert.match(sourceSha, /^[a-f0-9]{40}$/, 'The triggering source revision must be an exact Git SHA.');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim().toLowerCase(), sourceSha,
            'Checked-out source must match the triggering commit.');
          assert.equal(previewUrl.protocol, 'https:', 'Preview must use HTTPS.');
          assert.match(previewUrl.hostname, /^[a-z0-9-]+\.sindarealest2\.pages\.dev$/i,
            'Only the project Pages hostname is allowed.');
          assert.notEqual(previewUrl.hostname.toLowerCase(), 'sindarealest2.pages.dev',
            'Production Pages hostname is forbidden.');
          assert.equal(previewUrl.username + previewUrl.password + previewUrl.search + previewUrl.hash, '',
            'Preview base URL must not contain credentials, query parameters or a fragment.');
          for (const selector of targetSelectors) {
            assert.doesNotMatch(selector, /hero|order/i, 'Only catalog filter elements may be captured.');
          }
          if (!/^[a-f0-9]{32}$/i.test(accountId)) throw new Error('Missing or invalid Cloudflare account ID.');
          if (!apiToken) throw new Error('Missing read-only Cloudflare Pages metadata token.');

          const audit = {
            sourceKind: 'cloudflare-pages-preview-live-read-only',
            auditScope: 'catalog-search-and-category-controls-only',
            referenceImage: 'docs/design-reference/liquid-glass-product-filters.png',
            previewOrigin: origin,
            branch,
            sourceHeadSha: sourceSha,
            deployedPreviewSha: null,
            deployment: null,
            sourcePublicTreeEquivalentToDeployment: false,
            exactSourceHeadMatch: false,
            captureCompleted: false,
            status: 'IN_PROGRESS',
            ownerVisualAcceptance: 'PENDING',
            accessBlocked: false,
            accessServiceTokenConfigured: false,
            screenshotTargets: targetSelectors,
            runtimeErrors: [],
            sameOriginHttpErrors: [],
            readOnlyViolations: [],
            blockedExternalRequests: [],
            filterChecks: [],
            stateChecks: [],
            touchChecks: [],
            screenshots: [],
            startedAtUtc: new Date().toISOString()
          };
          await fs.rm(outDir, { recursive: true, force: true });
          await fs.mkdir(outDir, { recursive: true });
          await fs.copyFile(
            path.join(process.cwd(), 'docs/design-reference/liquid-glass-product-filters.png'),
            path.join(outDir, 'liquid-glass-product-filters-reference.png')
          );
          const writeAudit = async () => {
            await fs.mkdir(outDir, { recursive: true });
            await fs.writeFile(manifestPath, JSON.stringify(audit, null, 2) + '\n', 'utf8');
          };

          function publicTreeEquivalent(deployedSha) {
            if (!/^[a-f0-9]{40}$/.test(deployedSha)) return false;
            try {
              execFileSync('git', ['merge-base', '--is-ancestor', deployedSha, sourceSha], { stdio: 'ignore' });
              execFileSync('git', ['diff', '--quiet', deployedSha, sourceSha, '--', 'public'], { stdio: 'ignore' });
              return true;
            } catch { return false; }
          }

          async function readAliasDeployment() {
            let totalPages = 1;
            const matches = [];
            for (let pageNumber = 1; pageNumber <= Math.min(totalPages, 10); pageNumber += 1) {
              const endpoint = new URL('https://api.cloudflare.com/client/v4/accounts/' +
                encodeURIComponent(accountId) + '/pages/projects/sindarealest2/deployments');
              endpoint.searchParams.set('env', 'preview');
              endpoint.searchParams.set('per_page', '20');
              endpoint.searchParams.set('page', String(pageNumber));
              const response = await fetch(endpoint, {
                method: 'GET',
                headers: { Authorization: 'Bearer ' + apiToken, Accept: 'application/json' },
                signal: AbortSignal.timeout(15000)
              });
              const payload = await response.json().catch(() => null);
              if (!response.ok || payload?.success !== true || !Array.isArray(payload?.result)) {
                throw new Error('Cloudflare Pages read-only metadata request failed (HTTP ' + response.status + ').');
              }
              totalPages = Number(payload?.result_info?.total_pages || 1);
              for (const deployment of payload.result) {
                const aliases = Array.isArray(deployment?.aliases) ? deployment.aliases : [];
                let deployedOrigin = '';
                try { deployedOrigin = new URL(deployment?.url || '').origin.toLowerCase(); } catch {}
                const aliasOrigins = aliases.map((alias) => {
                  try { return new URL(alias).origin.toLowerCase(); } catch { return ''; }
                });
                if (aliasOrigins.includes(origin.toLowerCase()) || deployedOrigin === origin.toLowerCase()) matches.push(deployment);
              }
            }
            return matches.filter((item, index, all) => item?.id
              ? all.findIndex((other) => other?.id === item.id) === index : true);
          }

          async function verifyDeployment() {
            let reason = 'No deployment record matched the exact Preview alias.';
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const matches = await readAliasDeployment();
              if (matches.length > 1) throw new Error('The Preview alias matched multiple deployments; refusing to guess.');
              if (matches.length === 1) {
                const deployment = matches[0];
                const metadata = deployment?.deployment_trigger?.metadata || {};
                const deployedSha = String(metadata.commit_hash || '').trim().toLowerCase();
                const deployedBranch = String(metadata.branch || '').trim();
                const stage = deployment?.latest_stage ||
                  (Array.isArray(deployment?.stages) ? deployment.stages.at(-1) : null);
                const stageStatus = String(stage?.status || '').toLowerCase();
                const status = String(deployment?.status || stageStatus).toLowerCase();
                const environment = String(deployment?.environment || '').toLowerCase();
                if (environment !== 'preview' || deployedBranch !== expectedBranch) {
                  throw new Error('Alias deployment is not the expected Preview branch; no screenshot was captured.');
                }
                if (!/^[a-f0-9]{40}$/.test(deployedSha) || stageStatus !== 'success' ||
                    status !== 'success' || !deployment?.id || deployment?.is_skipped === true) {
                  reason = 'Alias deployment metadata is incomplete or its deployment has not completed.';
                } else if (deployedSha === sourceSha || publicTreeEquivalent(deployedSha)) {
                  audit.deployment = {
                    id: String(deployment.id),
                    sha: deployedSha,
                    branch: deployedBranch,
                    environment,
                    status,
                    latestStage: { name: String(stage?.name || ''), status: stageStatus },
                    url: typeof deployment.url === 'string' ? deployment.url : null,
                    aliases: Array.isArray(deployment.aliases) ? deployment.aliases : []
                  };
                  audit.deployedPreviewSha = deployedSha;
                  audit.exactSourceHeadMatch = deployedSha === sourceSha;
                  audit.sourcePublicTreeEquivalentToDeployment = true;
                  return;
                } else {
                  reason = 'Alias deployment SHA differs and public storefront files are not proven equivalent.';
                }
              }
              if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            throw new Error('Preview alias could not be verified safely: ' + reason);
          }

          function isAccessPage(url, status, title, body) {
            let parsed;
            try { parsed = new URL(url); } catch { return true; }
            return status === 401 || status === 403 ||
              parsed.pathname.startsWith('/cdn-cgi/access/login') ||
              parsed.hostname.toLowerCase().endsWith('.cloudflareaccess.com') ||
              /cloudflare access|sign in to continue|log in to .*cloudflare pages|access denied/i.test((title || '') + '\n' + (body || ''));
          }

          const browserAccessHeaders = buildCloudflareAccessHeaders();
          audit.accessServiceTokenConfigured = Object.keys(browserAccessHeaders).length > 0;
          let browser;
          try {
            await writeAudit();
            await verifyDeployment();
            browser = await chromium.launch({ headless: true });
            for (const viewport of viewports) {
              for (const theme of themes) {
                const contextName = viewport.name + '-' + theme;
                const context = await browser.newContext({
                  viewport: { width: viewport.width, height: viewport.height },
                  deviceScaleFactor: 1,
                  colorScheme: theme,
                  reducedMotion: 'no-preference',
                  serviceWorkers: 'block'
                });
                await context.addInitScript(({ themeName }) => {
                  try { localStorage.setItem('sd-theme-mode', themeName); } catch {}
                }, { themeName: theme });
                const page = await context.newPage();
                page.setDefaultTimeout(20000);
                page.on('pageerror', (error) => {
                  if (audit.runtimeErrors.length < 80) audit.runtimeErrors.push({
                    context: contextName, type: 'pageerror', message: sanitizeText(error.message || 'Page error')
                  });
                });
                page.on('console', (message) => {
                  if (message.type() !== 'error' || audit.runtimeErrors.length >= 80) return;
                  const sourceUrl = message.location()?.url || '';
                  try { if (sourceUrl && new URL(sourceUrl).origin !== origin) return; } catch {}
                  audit.runtimeErrors.push({ context: contextName, type: 'console', message: sanitizeText(message.text()) });
                });
                page.on('response', (response) => {
                  let responseUrl;
                  try { responseUrl = new URL(response.url()); } catch { return; }
                  if (responseUrl.origin === origin && response.status() >= 400 && audit.sameOriginHttpErrors.length < 80) {
                    audit.sameOriginHttpErrors.push({
                      context: contextName, status: response.status(), method: response.request().method(),
                      path: responseUrl.pathname
                    });
                  }
                });
                await page.route('**/*', async (route) => {
                  const request = route.request();
                  let requestUrl;
                  try { requestUrl = new URL(request.url()); } catch {
                    await route.abort();
                    return;
                  }
                  if (requestUrl.origin === origin) {
                    if (!['GET', 'HEAD'].includes(request.method().toUpperCase())) {
                      if (audit.readOnlyViolations.length < 80) audit.readOnlyViolations.push({
                        context: contextName, method: request.method(), path: requestUrl.pathname
                      });
                      await route.abort();
                      return;
                    }
                    const headers = Object.keys(browserAccessHeaders).length
                      ? { ...request.headers(), ...browserAccessHeaders } : request.headers();
                    await route.continue({ headers });
                    return;
                  }
                  if (isApprovedPreviewExternalRead(request.url(), request.method())) {
                    await route.continue();
                    return;
                  }
                  if (audit.blockedExternalRequests.length < 80) audit.blockedExternalRequests.push({
                    context: contextName, method: request.method(), origin: requestUrl.origin, type: request.resourceType()
                  });
                  await route.abort();
                });
                try {
                  const response = await page.goto(targetUrl, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  const title = await page.title().catch(() => '');
                  const body = await page.locator('body').innerText().catch(() => '');
                  if (isAccessPage(page.url(), response?.status() || 0, title, body)) {
                    audit.accessBlocked = true;
                    throw new Error('Cloudflare Access blocked the authorized Preview request; no bypass was attempted.');
                  }
                  if (!response || response.status() < 200 || response.status() >= 400) {
                    throw new Error('Preview main document did not return a successful response.');
                  }

                  // Wait for the page's non-catalog intro to release its scroll lock. Do not capture or inspect that section.
                  await page.waitForFunction(() => !document.body.classList.contains('welcome-active'), null, { timeout: 8000 });
                  const productsSection = page.locator('#products');
                  await productsSection.scrollIntoViewIfNeeded();
                  assert.equal(await page.locator('#products .fulfillment-filter-row, #fulfillmentFilters').count(), 0,
                    'The dedicated product-status panel and its filter controls must be absent.');
                  const categoryGroup = page.locator('#categoryFilters');
                  await categoryGroup.waitFor({ state: 'visible', timeout: 25000 });
                  assert.equal(await categoryGroup.getAttribute('role'), 'group');
                  assert.equal(await categoryGroup.getAttribute('aria-label'), 'Lọc theo danh mục');

                  const categoryButtons = categoryGroup.locator('button[data-category]');
                  await categoryButtons.first().waitFor({ state: 'visible', timeout: 25000 });
                  assert.ok(await categoryButtons.count() >= 1, 'Category filter group has no buttons.');
                  assert.equal(await categoryGroup.locator('button[aria-pressed="true"]').count(), 1);

                  for (const selector of targetSelectors) {
                    const target = page.locator(selector);
                    await target.scrollIntoViewIfNeeded();
                    const box = await target.boundingBox();
                    assert.ok(box && box.width > 0 && box.height > 0, 'Catalog filter target is missing or has no layout: ' + selector);
                    assert.ok(box.height < viewport.height * 0.75, 'Refusing a catalog-filter screenshot whose target unexpectedly spans most of the viewport.');
                    const filename = 'catalog-search-and-category-filters-' + contextName + '.png';
                    await target.screenshot({
                      path: path.join(outDir, filename),
                      animations: 'disabled',
                      timeout: 30000
                    });
                    audit.screenshots.push({
                      filename,
                      selector,
                      stage: 'catalog-controls-resting-state',
                      viewport: viewport.name,
                      width: viewport.width,
                      height: viewport.height,
                      theme
                    });
                  }

                  let categoryInteraction = 'SKIPPED_NO_NONDEFAULT_CATEGORY';
                  const searchField = page.locator('#products .search-field');
                  const searchInput = searchField.locator('input');
                  const searchDefault = await searchField.evaluate(el => {
                    const css = getComputedStyle(el);
                    return { background: css.backgroundColor, border: css.borderColor, shadow: css.boxShadow };
                  });
                  await page.mouse.move(0, 0);
                  await searchField.hover();
                  await page.waitForTimeout(240);
                  const searchHoverStyle = await searchField.evaluate(el => {
                    const css = getComputedStyle(el);
                    return { background: css.backgroundColor, shadow: css.boxShadow };
                  });
                  const searchHover = searchHoverStyle.background;
                  assert.notEqual(searchHover, searchDefault.background,
                    'Search surface hover must visibly differ from its default surface.');
                  await page.mouse.down();
                  // The catalog surface has 220ms transitions; sample after the pressed glass has settled.
                  await page.waitForTimeout(240);
                  const searchPressed = await searchField.evaluate(el => {
                    const css = getComputedStyle(el);
                    return { background: css.backgroundColor, shadow: css.boxShadow };
                  });
                  assert.notEqual(searchPressed.background, searchHover,
                    'Search surface pressed state must be distinguishable from hover after its transition.');
                  assert.notEqual(searchPressed.shadow, searchHoverStyle.shadow,
                    'Search press must change its glass depth from the hover treatment.');
                  assert.notEqual(searchPressed.shadow, searchDefault.shadow,
                    'Search surface pressed state must change its inset/depth treatment.');
                  await page.mouse.up();
                  await page.mouse.move(0, 0);
                  const searchReleased = await searchField.evaluate(el => getComputedStyle(el).backgroundColor);
                  assert.notEqual(searchReleased, searchPressed.background,
                    'Search pressed treatment must end after pointer release.');
                  await searchInput.focus();
                  await page.waitForTimeout(300);
                  const searchFocus = await searchField.evaluate(el => {
                    const css = getComputedStyle(el);
                    return { border: css.borderColor, shadow: css.boxShadow, outlineStyle: css.outlineStyle, outlineWidth: Number.parseFloat(css.outlineWidth), hasFocusWithin: el.matches(':focus-within') };
                  });
                  assert.equal(searchFocus.hasFocusWithin, true,
                    'Search input focus must reach its containing field.');
                  assert.equal(searchFocus.outlineStyle, 'solid',
                    'Focused search must expose a visible outline.');
                  assert.ok(searchFocus.outlineWidth >= 3,
                    'Focused search outline must be at least 3px wide.');
                  assert.notEqual(searchFocus.shadow, searchDefault.shadow,
                    'Focused search must expose a distinct glass focus treatment.');
                  await page.keyboard.press('Tab');
                  await page.waitForTimeout(50);
                  const firstCategoryButton = categoryGroup.locator('button').first();
                  assert.equal(await firstCategoryButton.evaluate(el => el.matches(':focus-visible')), true,
                    'Keyboard navigation must expose focus-visible on the next category pill.');
                  const keyboardFocusOutline = await firstCategoryButton.evaluate(el => {
                    const css = getComputedStyle(el);
                    return { style: css.outlineStyle, width: Number.parseFloat(css.outlineWidth) };
                  });
                  assert.equal(keyboardFocusOutline.style, 'solid',
                    'Keyboard-focused category pill must retain a visible outline style.');
                  assert.ok(keyboardFocusOutline.width >= 3,
                    'Keyboard-focused category pill outline must be at least 3px wide.');
                  await page.mouse.move(0, 0);

                  const otherCategory = categoryGroup.locator('button[data-category]:not([data-category="all"])').first();
                  let categoryHover = 'SKIPPED_NO_NONDEFAULT_CATEGORY';
                  let categoryPressed = 'SKIPPED_NO_NONDEFAULT_CATEGORY';
                  let categoryKeyboardFocus = 'PASS';
                  if (await otherCategory.count() > 0) {
                    const defaultChipStyle = await otherCategory.evaluate(el => {
                      const css = getComputedStyle(el);
                      return { background: css.backgroundColor, shadow: css.boxShadow };
                    });
                    const defaultChipBackground = defaultChipStyle.background;
                    await otherCategory.hover();
                    await page.waitForTimeout(240);
                    const hoverChipStyle = await otherCategory.evaluate(el => {
                      const css = getComputedStyle(el);
                      return { background: css.backgroundColor, shadow: css.boxShadow };
                    });
                    assert.notEqual(hoverChipStyle.background, defaultChipBackground,
                      'Unselected category chip hover must differ from its default surface.');
                    categoryHover = 'PASS';
                    await page.mouse.down();
                    await page.waitForTimeout(240);
                    const pressedChip = await otherCategory.evaluate(el => {
                      const css = getComputedStyle(el);
                      return { background: css.backgroundColor, shadow: css.boxShadow };
                    });
                    assert.notEqual(pressedChip.background, hoverChipStyle.background,
                      'Physical chip press must be visibly distinct from hover.');
                    assert.notEqual(pressedChip.shadow, hoverChipStyle.shadow,
                      'The press state must expose a different inset depth treatment from hover.');
                    assert.equal(await otherCategory.getAttribute('aria-pressed'), 'false',
                      'A physical press alone must not set persistent selection before click release.');
                    await page.mouse.move(0, 0);
                    await page.mouse.up();
                    await page.waitForTimeout(240);
                    assert.equal(await otherCategory.getAttribute('aria-pressed'), 'false',
                      'Moving away and releasing a pressed chip must not accidentally select it.');
                    const afterPressRelease = await otherCategory.evaluate(el => getComputedStyle(el).backgroundColor);
                    assert.equal(afterPressRelease, defaultChipBackground,
                      'The temporary press treatment must end after release without selection.');
                    categoryPressed = 'PASS';
                  }
                  const stateCheck = {
                    context: contextName,
                    searchHover: 'PASS',
                    searchPressed: 'PASS',
                    searchFocus: 'PASS',
                    categoryHover,
                    categoryPressed,
                    categoryKeyboardFocus
                  };
                  const otherCategoryState = stateCheck;
                  if (await otherCategory.count() > 0) {
                    await otherCategory.click();
                    assert.equal(await otherCategory.getAttribute('aria-pressed'), 'true',
                      'Selected category did not expose aria-pressed=true.');
                    const selectedGlassMotion = await otherCategory.evaluate(el => {
                      const css = getComputedStyle(el);
                      return { animationName: css.animationName, animationDuration: css.animationDuration };
                    });
                    assert.equal(selectedGlassMotion.animationName,
                      theme === 'dark' ? 'sdCatalogGlassActivateDark' : 'sdCatalogGlassActivate',
                      'Selecting a category must start the visible Liquid Glass activation animation for the current theme.');
                    assert.equal(selectedGlassMotion.animationDuration, '0.46s',
                      'Category activation must retain the visible 460ms glass-pop timing.');
                    // Sample actual computed frames while the CSS animation is running, not just its declaration.
                    await page.waitForTimeout(135);
                    const activationMidFrame = await otherCategory.evaluate(el => {
                      const css = getComputedStyle(el);
                      const animation = el.getAnimations().find(item =>
                        typeof item.animationName === 'string' && item.animationName.startsWith('sdCatalogGlassActivate'));
                      const matrix = css.transform.match(/^matrix\(([^)]+)\)$/);
                      return {
                        animationName: css.animationName,
                        currentTime: typeof animation?.currentTime === 'number' ? animation.currentTime : null,
                        playState: animation?.playState || 'missing',
                        transform: css.transform,
                        scaleX: matrix ? Number(matrix[1].split(',')[0]) : 1,
                        boxShadow: css.boxShadow
                      };
                    });
                    assert.ok(activationMidFrame.currentTime !== null && activationMidFrame.currentTime < 460,
                      'Category click must leave a live CSS animation in progress; observed ' + JSON.stringify(activationMidFrame));
                    assert.ok(activationMidFrame.scaleX > 1.005,
                      'The mid-animation category chip must visibly spring above its resting size; observed ' + JSON.stringify(activationMidFrame));
                    assert.notEqual(activationMidFrame.boxShadow, defaultChipStyle.shadow,
                      'The selected chip must bloom beyond its unselected glass shadow during activation.');
                    const frameBox = await otherCategory.boundingBox();
                    assert.ok(frameBox && frameBox.height > 0 && frameBox.height < 100,
                      'Activation evidence must be a single category chip, not a page/section screenshot.');
                    const midFilename = 'category-activation-midframe-' + contextName + '.png';
                    await otherCategory.screenshot({ path: path.join(outDir, midFilename), animations: 'allow', timeout: 30000 });
                    audit.screenshots.push({ filename: midFilename, selector: '#products .filter-pill[aria-pressed="true"]', stage: 'activation-midframe', viewport: viewport.name, width: Math.round(frameBox.width), height: Math.round(frameBox.height), theme });

                    await page.waitForTimeout(105);
                    const activationLaterFrame = await otherCategory.evaluate(el => {
                      const css = getComputedStyle(el);
                      const animation = el.getAnimations().find(item =>
                        typeof item.animationName === 'string' && item.animationName.startsWith('sdCatalogGlassActivate'));
                      return {
                        currentTime: typeof animation?.currentTime === 'number' ? animation.currentTime : null,
                        transform: css.transform,
                        boxShadow: css.boxShadow
                      };
                    });
                    assert.ok(activationLaterFrame.currentTime !== null && activationLaterFrame.currentTime > activationMidFrame.currentTime,
                      'Animation timeline must advance after the category selection state change.');
                    assert.notEqual(activationLaterFrame.transform, activationMidFrame.transform,
                      'Computed transform must change between real animation frames.');
                    assert.notEqual(activationLaterFrame.boxShadow, activationMidFrame.boxShadow,
                      'Computed glass bloom must evolve between real animation frames.');

                    await page.waitForTimeout(300);
                    const settledCategoryStyle = await otherCategory.evaluate(el => {
                      const css = getComputedStyle(el);
                      return { background: css.backgroundColor, boxShadow: css.boxShadow, transform: css.transform };
                    });
                    assert.equal(await otherCategory.getAttribute('aria-pressed'), 'true',
                      'Selected category must remain selected after the activation animation ends.');
                    assert.notEqual(settledCategoryStyle.boxShadow, activationMidFrame.boxShadow,
                      'The settled selected-glass state must be distinct from the activation bloom frame.');
                    const settledBox = await otherCategory.boundingBox();
                    const settledFilename = 'category-selection-settled-' + contextName + '.png';
                    await otherCategory.screenshot({ path: path.join(outDir, settledFilename), animations: 'disabled', timeout: 30000 });
                    audit.screenshots.push({ filename: settledFilename, selector: '#products .filter-pill[aria-pressed="true"]', stage: 'selection-settled', viewport: viewport.name, width: Math.round(settledBox.width), height: Math.round(settledBox.height), theme });
                    otherCategoryState.categoryActivationBehavior = {
                      status: 'PASS',
                      animationName: selectedGlassMotion.animationName,
                      animationDuration: selectedGlassMotion.animationDuration,
                      midFrameScaleX: activationMidFrame.scaleX,
                      midFrameCurrentTimeMs: activationMidFrame.currentTime,
                      laterFrameCurrentTimeMs: activationLaterFrame.currentTime,
                      transformChangedBetweenFrames: activationMidFrame.transform !== activationLaterFrame.transform,
                      bloomChangedBetweenFrames: activationMidFrame.boxShadow !== activationLaterFrame.boxShadow,
                      persistentSelectedState: 'PASS'
                    };
                    const selectedCategoryBackground = settledCategoryStyle.background;
                    await page.mouse.move(0, 0);
                    assert.equal(await otherCategory.getAttribute('aria-pressed'), 'true',
                      'Selected category must remain selected after pointer release and mouse leave.');
                    assert.equal(await otherCategory.evaluate(el => getComputedStyle(el).backgroundColor), selectedCategoryBackground,
                      'Selected category glass must persist after hover ends.');
                    otherCategoryState.categorySelectedPersists = 'PASS';
                    await categoryGroup.locator('button[data-category="all"]').click();
                    assert.equal(await categoryGroup.locator('button[data-category="all"]').getAttribute('aria-pressed'), 'true');
                    // Exercise the real selection handler under a reduced-motion preference.
                    await page.emulateMedia({ reducedMotion: 'reduce' });
                    await otherCategory.click();
                    const reducedMotionState = await otherCategory.evaluate(el => ({
                      animationName: getComputedStyle(el).animationName,
                      activationAnimations: el.getAnimations().filter(item =>
                        typeof item.animationName === 'string' && item.animationName.startsWith('sdCatalogGlassActivate')).length
                    }));
                    assert.equal(reducedMotionState.animationName, 'none',
                      'Reduced-motion preference must suppress category activation animation.');
                    assert.equal(reducedMotionState.activationAnimations, 0,
                      'Reduced-motion selection must not start a category animation.');
                    otherCategoryState.reducedMotionSelection = 'PASS';
                    await page.emulateMedia({ reducedMotion: 'no-preference' });
                    const allCategoryButton = categoryGroup.locator('button[data-category="all"]');
                    await allCategoryButton.click();
                    await allCategoryButton.focus();
                    await page.keyboard.press('Tab');
                    assert.equal(await otherCategory.evaluate(el => el.matches(':focus-visible')), true,
                      'Keyboard navigation must focus the next category before keyboard activation.');
                    await page.keyboard.press('Enter');
                    assert.equal(await otherCategory.getAttribute('aria-pressed'), 'true',
                      'Enter on a keyboard-focused category must change the selected category.');
                    assert.equal(await categoryGroup.locator('button[data-category="all"]').getAttribute('aria-pressed'), 'false',
                      'Keyboard category selection must clear the previous selected state.');
                    const keyboardActivation = await otherCategory.evaluate(el => ({
                      animationName: getComputedStyle(el).animationName,
                      running: el.getAnimations().some(item => typeof item.animationName === 'string' && item.animationName.startsWith('sdCatalogGlassActivate') && item.playState === 'running')
                    }));
                    assert.equal(keyboardActivation.animationName, theme === 'dark' ? 'sdCatalogGlassActivateDark' : 'sdCatalogGlassActivate',
                      'Keyboard selection must trigger the theme-appropriate activation animation.');
                    assert.equal(keyboardActivation.running, true,
                      'Keyboard selection must start the category activation animation, not merely set aria-pressed.');
                    otherCategoryState.keyboardSelection = 'PASS';
                    categoryInteraction = 'PASS';
                  }
                  audit.stateChecks.push(otherCategoryState);
                  audit.filterChecks.push({
                    context: contextName,
                    dedicatedProductStatusPanelAbsent: true,
                    namedCategoryGroup: true,
                    categoryButtonCount: await categoryButtons.count(),
                    categoryInteraction
                  });
                } finally {
                  await context.close();
                  await writeAudit();
                }
              }
            }

            // Add genuine touch-device checks; these contexts are scoped to the catalog controls only.
            for (const theme of themes) {
              const contextName = 'mobile-390-touch-' + theme;
              const touchContext = await browser.newContext({
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 1,
                isMobile: true,
                hasTouch: true,
                colorScheme: theme,
                reducedMotion: 'no-preference',
                serviceWorkers: 'block'
              });
              try {
                await touchContext.addInitScript(({ themeName }) => {
                  try { localStorage.setItem('sd-theme-mode', themeName); } catch {}
                }, { themeName: theme });
                const touchPage = await touchContext.newPage();
                touchPage.setDefaultTimeout(20000);
                touchPage.on('pageerror', error => {
                  if (audit.runtimeErrors.length < 80) audit.runtimeErrors.push({
                    context: contextName, type: 'pageerror', message: sanitizeText(error.message || 'Page error')
                  });
                });
                touchPage.on('response', response => {
                  let responseUrl;
                  try { responseUrl = new URL(response.url()); } catch { return; }
                  if (responseUrl.origin === origin && response.status() >= 400 && audit.sameOriginHttpErrors.length < 80) {
                    audit.sameOriginHttpErrors.push({
                      context: contextName, status: response.status(), method: response.request().method(),
                      path: responseUrl.pathname
                    });
                  }
                });
                await touchPage.route('**/*', async route => {
                  const request = route.request();
                  let requestUrl;
                  try { requestUrl = new URL(request.url()); } catch {
                    await route.abort();
                    return;
                  }
                  if (requestUrl.origin === origin) {
                    if (!['GET', 'HEAD'].includes(request.method().toUpperCase())) {
                      if (audit.readOnlyViolations.length < 80) audit.readOnlyViolations.push({
                        context: contextName, method: request.method(), path: requestUrl.pathname
                      });
                      await route.abort();
                      return;
                    }
                    const headers = Object.keys(browserAccessHeaders).length
                      ? { ...request.headers(), ...browserAccessHeaders } : request.headers();
                    await route.continue({ headers });
                    return;
                  }
                  if (isApprovedPreviewExternalRead(request.url(), request.method())) {
                    await route.continue();
                    return;
                  }
                  if (audit.blockedExternalRequests.length < 80) audit.blockedExternalRequests.push({
                    context: contextName, method: request.method(), origin: requestUrl.origin, type: request.resourceType()
                  });
                  await route.abort();
                });
                await touchPage.goto(targetUrl, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await touchPage.waitForFunction(() => !document.body.classList.contains('welcome-active'), null, { timeout: 8000 });
                await touchPage.locator('#products').scrollIntoViewIfNeeded();
                const touchGroup = touchPage.locator('#categoryFilters');
                await touchGroup.waitFor({ state: 'visible', timeout: 25000 });
                const touchCategory = touchGroup.locator('button[data-category]:not([data-category="all"])').first();
                await touchCategory.waitFor({ state: 'visible', timeout: 25000 });
                const touchBox = await touchCategory.boundingBox();
                assert.ok(touchBox && touchBox.height >= 44 && touchBox.height < 100,
                  'Touch category chip must be a valid, single mobile tap target.');
                await touchPage.touchscreen.tap(touchBox.x + touchBox.width / 2, touchBox.y + touchBox.height / 2);
                assert.equal(await touchCategory.getAttribute('aria-pressed'), 'true',
                  'A real touchscreen tap must change selected category state.');
                await touchPage.waitForTimeout(135);
                const touchActivation = await touchCategory.evaluate(el => {
                  const css = getComputedStyle(el);
                  const animation = el.getAnimations().find(item =>
                    typeof item.animationName === 'string' && item.animationName.startsWith('sdCatalogGlassActivate'));
                  const matrix = css.transform.match(/^matrix\(([^)]+)\)$/);
                  return {
                    animationName: css.animationName,
                    currentTime: typeof animation?.currentTime === 'number' ? animation.currentTime : null,
                    scaleX: matrix ? Number(matrix[1].split(',')[0]) : 1,
                    boxShadow: css.boxShadow
                  };
                });
                assert.equal(touchActivation.animationName, theme === 'dark' ? 'sdCatalogGlassActivateDark' : 'sdCatalogGlassActivate',
                  'Touch selection must trigger the theme-appropriate activation animation.');
                assert.ok(touchActivation.currentTime !== null && touchActivation.currentTime < 460 && touchActivation.scaleX > 1.005,
                  'Touch selection must expose a live, perceptible animation frame; observed ' + JSON.stringify(touchActivation));
                const touchFrameFile = 'touch-category-activation-midframe-' + theme + '.png';
                await touchCategory.screenshot({ path: path.join(outDir, touchFrameFile), animations: 'allow', timeout: 30000 });
                audit.screenshots.push({
                  filename: touchFrameFile,
                  selector: '#products .filter-pill[aria-pressed="true"]',
                  stage: 'touch-activation-midframe',
                  viewport: 'mobile-390-touch',
                  width: Math.round(touchBox.width),
                  height: Math.round(touchBox.height),
                  theme
                });
                await touchPage.waitForTimeout(500);
                assert.equal(await touchCategory.getAttribute('aria-pressed'), 'true',
                  'Touch selected state must persist after the activation effect settles.');
                audit.touchChecks.push({
                  context: contextName,
                  input: 'touchscreen.tap',
                  selectedState: 'PASS',
                  animationName: touchActivation.animationName,
                  animationCurrentTimeMs: touchActivation.currentTime,
                  peakFrameScaleX: touchActivation.scaleX,
                  persistentSelection: 'PASS'
                });
              } finally {
                await touchContext.close();
                await writeAudit();
              }
            }

            const catalogSurfaceScreenshotCount = audit.screenshots.filter(item => item.stage === 'catalog-controls-resting-state').length;
            const activationFrameScreenshotCount = audit.screenshots.filter(item => item.stage === 'activation-midframe').length;
            const settledSelectionScreenshotCount = audit.screenshots.filter(item => item.stage === 'selection-settled').length;
            audit.captureCompleted = catalogSurfaceScreenshotCount === 8 &&
              activationFrameScreenshotCount === 8 && settledSelectionScreenshotCount === 8;
            audit.passed = audit.captureCompleted &&
              audit.accessBlocked === false &&
              audit.runtimeErrors.length === 0 &&
              audit.sameOriginHttpErrors.length === 0 &&
              audit.readOnlyViolations.length === 0 &&
              audit.filterChecks.length === 8 &&
              audit.stateChecks.length === 8 &&
              audit.touchChecks.length === 2;
            audit.status = audit.passed ? 'CAPTURED_AWAITING_OWNER_VISUAL_ACCEPTANCE' : 'CAPTURED_WITH_ISSUES';
            audit.finishedAtUtc = new Date().toISOString();
            await writeAudit();
            assert.equal(catalogSurfaceScreenshotCount, 8, 'Expected one element-only screenshot of the catalog filter panel for each of eight viewport/theme pairs.');
            assert.equal(activationFrameScreenshotCount, 8, 'Expected one live activation animation frame for each viewport/theme pair.');
            assert.equal(settledSelectionScreenshotCount, 8, 'Expected one settled selected-chip frame for each viewport/theme pair.');
            assert.equal(audit.runtimeErrors.length, 0, 'Runtime errors were detected.');
            assert.equal(audit.sameOriginHttpErrors.length, 0, 'Same-origin HTTP errors were detected.');
            assert.equal(audit.readOnlyViolations.length, 0, 'Non-read-only requests were attempted.');
            assert.equal(audit.filterChecks.length, 8, 'Some viewport/theme filter checks did not complete.');
            assert.equal(audit.stateChecks.length, 8, 'Some hover/pressed/focus/selection state checks did not complete.');
            assert.equal(audit.touchChecks.length, 2, 'Both light/dark real-touch category-selection checks must pass.');
            assert.equal(audit.accessBlocked, false, 'Cloudflare Access blocked the Preview request.');
            assert.equal(audit.passed, true, 'The catalog-only Preview audit did not pass.');
            console.log(JSON.stringify({
              status: audit.status,
              sourceHeadSha: audit.sourceHeadSha,
              deployedPreviewSha: audit.deployedPreviewSha,
              exactSourceHeadMatch: audit.exactSourceHeadMatch,
              sourcePublicTreeEquivalentToDeployment: audit.sourcePublicTreeEquivalentToDeployment,
              screenshots: audit.screenshots.length,
              catalogSurfaceScreenshots: catalogSurfaceScreenshotCount,
              activationMidframeScreenshots: activationFrameScreenshotCount,
              settledSelectionScreenshots: settledSelectionScreenshotCount,
              filterChecks: audit.filterChecks.length,
              stateChecks: audit.stateChecks.length,
              touchChecks: audit.touchChecks.length,
              runtimeErrors: audit.runtimeErrors.length,
              sameOriginHttpErrors: audit.sameOriginHttpErrors.length,
              readOnlyViolations: audit.readOnlyViolations.length,
              accessBlocked: audit.accessBlocked
            }, null, 2));
          } catch (error) {
            audit.status = audit.accessBlocked ? 'BLOCKED_ACCESS' : 'FAILED';
            audit.error = sanitizeText(error?.message || 'Catalog Preview audit failed.');
            audit.finishedAtUtc = new Date().toISOString();
            await writeAudit();
            throw error;
          } finally {
            if (browser) await browser.close();
          }
          NODE

      - name: Upload catalog-only screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sindarealest-catalog-filter-preview-${{ github.run_number }}
          path: artifacts/catalog-filter-preview/
          if-no-files-found: warn
          retention-days: 14
