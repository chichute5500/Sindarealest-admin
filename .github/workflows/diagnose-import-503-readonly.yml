name: Read-only Import 503 Cloudflare Diagnostics
on:
  push:
    branches:
      - feature/admin-bulk-folder-import-2026-10-26
    paths:
      - 'scripts/qa-bulk-import-503-readonly.mjs'
      - '.github/workflows/diagnose-import-503-readonly.yml'
permissions:
  contents: read
jobs:
  cloudflare-503:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Inspect Preview isolation, unsigned endpoint errors and Workers 24h failure metrics (READ ONLY)
        run: node scripts/qa-bulk-import-503-readonly.mjs
