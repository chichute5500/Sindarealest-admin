name: Product selections Chrome PC/mobile (no Production access)
on:
  push:
    branches: [feat/product-options-shoes-belts-phone-2026-10-28]
    paths:
      - '.github/workflows/qa-product-options-20261028.yml'
      - 'public/index.html'
      - 'functions/api/orders.js'
      - 'functions/_product-options.js'
      - 'tests/product-options-flow.test.mjs'
      - 'tests/e2e/product-options-mobile-desktop.spec.js'
      - 'package.json'
permissions:
  contents: read
concurrency:
  group: sd-product-selections-browser-qa
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify isolated source and no Production mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/feat/product-options-shoes-belts-phone-2026-10-28'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --no-fund
          npm run check
          npm test
      - name: Install browser QA runner
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo 'SD_OWNER_QA_SYSTEM_CHROME=1' >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test selectors and checkout in isolated local Chrome
        shell: bash
        env:
          SD_OPTIONS_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public >/tmp/product-options-web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep .3
          done
          npx playwright test tests/e2e/product-options-mobile-desktop.spec.js --config=playwright.owner-gesture.config.js --reporter=list
      - name: Attach PC/mobile dark/light screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-selections-${{ github.sha }}
          path: |
            artifacts/product-options/
            test-results/
          if-no-files-found: warn
          retention-days: 14
