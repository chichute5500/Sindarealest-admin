name: Owner-approved synthetic D1 QA and complete 12-screen captures

on:
  push:
    branches:
      - feature/admin-isolated-handoff-2026-10-20
    paths:
      - ".github/workflows/admin-12-screen-synthetic-qa-20261024.yml"

permissions:
  contents: read

concurrency:
  group: isolated-admin-synthetic-fixture
  cancel-in-progress: false

jobs:
  synthetic-qa:
    name: Isolated synthetic fixtures + 12-screen QA + verified cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Guard owner-approved isolated feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/feature/admin-isolated-handoff-2026-10-20"
          test -n "$ADMIN_TEST_PASSWORD"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install tooling and browser
        run: |
          npm install --no-fund
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Assert test run owns latest feature branch SHA
        run: |
          remote="$(git ls-remote origin refs/heads/feature/admin-isolated-handoff-2026-10-20 | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"
      - name: Seed, capture, then clean all synthetic Preview D1 rows even on test failure
        run: node scripts/qa-admin-d1-synthetic-lifecycle.mjs run
      - name: Final best-effort cleanup on failure or cancellation
        if: always()
        run: node scripts/qa-admin-d1-synthetic-lifecycle.mjs cleanup
      - name: Verify tested SHA remains branch HEAD
        if: always()
        run: |
          remote="$(git ls-remote origin refs/heads/feature/admin-isolated-handoff-2026-10-20 | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA" || { echo "::error::QA screenshots no longer latest branch HEAD"; exit 1; }
      - name: Upload sanitized screenshot and cleanup manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-12-screen-with-synthetic-evidence-${{ github.run_number }}
          path: |
            artifacts/admin-12-screen-live/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
