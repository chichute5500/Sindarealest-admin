name: Profile catalogue for AI descriptions (read only)
on:
  push:
    branches:
      - chore/ai-descriptions-catalog-2026-10-28
    paths:
      - .github/workflows/ai-description-audit.yml
      - scripts/audit-ai-description-catalog.mjs
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only D1 and Workers AI check
        run: node scripts/audit-ai-description-catalog.mjs
