name: PR174 Owner-approved Production D1 warranty schema (one-time)
on:
  push:
    branches: [feat/manual-warranty-management-20261105]
    paths:
      - docs/qa/PR174_PRODUCTION_D1_RELEASE_20261105.trigger
permissions:
  contents: read
concurrency:
  group: prod-warranty-schema-174
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate all source checks, CSS and warranty tests
        run: |
          npm run check
          npm test
      - name: Back up exact Production D1 SQL after verifying scope
        run: node scripts/migrate-warranty-production-174.mjs backup
      - name: Store private backup before mutation
        uses: actions/upload-artifact@v4
        with:
          name: pr174-production-d1-pre-schema-${{ github.run_id }}
          path: artifacts/pr174-production-db/
          if-no-files-found: error
          retention-days: 7
  migrate:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply only 0019-0021 on verified Production D1
        run: node scripts/migrate-warranty-production-174.mjs migrate
