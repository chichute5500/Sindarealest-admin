name: Exact 921 Photo Production R2 Progress (Read-only)
on:
  push:
    branches:
      - audit/import-218-921-readonly-2026-10-26
    paths:
      - scripts/monitor-prod-r2-import-readonly.mjs
      - .github/workflows/monitor-prod-r2-import-readonly.yml
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @aws-sdk/client-s3@3.914.0
      - run: node scripts/monitor-prod-r2-import-readonly.mjs
