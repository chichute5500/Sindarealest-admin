name: Activate automatic image backup in Production D1 (guarded)
on:
  push:
    branches:
      - feat/automatic-r2-image-backup-20261105
    paths:
      - '.github/workflows/activate-image-backup-d1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_API_TOKEN }}
      WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
    steps:
      - name: Strict branch and credentials gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/feat/automatic-r2-image-backup-20261105'
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_R2_READ_API_TOKEN" && test -n "$WORKERS_TOKEN"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Reverify Production bucket identities and private backup R2 before enabling
        run: node scripts/check-image-backup-cloudflare-readonly.mjs
      - name: Reverify deployed Free-safe Cron schedule (GET only)
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/sindarealest-image-backup/schedules"
          curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer ${WORKERS_TOKEN}" "$api" > "$RUNNER_TEMP/schedules.json"
          jq -e '.success == true and ([.result.schedules[]? | select(.cron == "*/5 * * * *")] | length == 1)' "$RUNNER_TEMP/schedules.json" >/dev/null
          echo "PASS: Free-safe Cron interval deployed."
      - name: Activate ONLY image_backup_enabled_v1 setting
        shell: bash
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$root/pages/projects/sindarealest2" > "$RUNNER_TEMP/page.json"
          db_id="$(jq -r '.result.deployment_configs.production.d1_databases.DB.id // .result.deployment_configs.production.d1_databases.DB.database_id // empty' "$RUNNER_TEMP/page.json")"
          test -n "$db_id" || { echo "::error::DB id not verified"; exit 1; }
          url="$root/d1/database/$db_id/query"
          jq -n '{sql:"SELECT value FROM settings WHERE key = \"image_backup_enabled_v1\" LIMIT 1"}' > "$RUNNER_TEMP/select.json"
          status="$(curl --silent --show-error --max-time 25 -o "$RUNNER_TEMP/before.json" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/select.json" "$url")"
          test "$status" = "200" || { echo "::error::D1 read failed HTTP $status";exit 1; }
          jq -e '.success == true and ([.result[].results[]?.value] | length == 0 or all(. == "0" or . == "1"))' "$RUNNER_TEMP/before.json" >/dev/null || {
            echo "::error::Unexpected backup flag, refusing to change D1";exit 1;
          }
          jq -n '{sql:"INSERT INTO settings(key,value,updated_at) VALUES (\"image_backup_enabled_v1\", \"1\", datetime(\"now\")) ON CONFLICT(key) DO UPDATE SET value = \"1\", updated_at = datetime(\"now\") WHERE settings.value IN (\"0\",\"1\")"}' > "$RUNNER_TEMP/write.json"
          status="$(curl --silent --show-error --max-time 25 -o "$RUNNER_TEMP/written.json" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/write.json" "$url")"
          test "$status" = "200" || { echo "::error::D1 write not authorized HTTP $status; no retry without reviewing account permissions";exit 1; }
          jq -e '.success == true and all(.result[]; .success == true)' "$RUNNER_TEMP/written.json" >/dev/null
          curl --fail --silent --show-error --max-time 25 \
            -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/select.json" "$url" > "$RUNNER_TEMP/verify.json"
          jq -e '.success == true and ([.result[].results[]?.value] == ["1"])' "$RUNNER_TEMP/verify.json" >/dev/null
          echo "PASS: Production D1 image_backup_enabled_v1 = 1. No other D1 settings/records were changed."
          echo "Cron Worker will copy only into sin-images-backup; no source image writes." >> "$GITHUB_STEP_SUMMARY"
