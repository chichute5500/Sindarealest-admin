name: Owner Catalog Poststage Readiness (Read-only)
on:
  push:
    branches:
      - audit/import-218-921-readonly-2026-10-26
    paths:
      - scripts/catalog-poststage-readiness-readonly.mjs
      - .github/workflows/catalog-poststage-readiness-readonly.yml
      - docs/import/CATALOG-POSTSTAGE-READINESS.trigger
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify 218 staging records and 15 live filter categories
        run: node scripts/catalog-poststage-readiness-readonly.mjs
