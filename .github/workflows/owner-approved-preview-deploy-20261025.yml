name: Owner-approved one-shot isolated Admin Preview deploy and QA
on:
  push:
    branches:
      - feature/admin-isolated-handoff-2026-10-20
    paths:
      - ".github/workflows/owner-approved-preview-deploy-20261025.yml"

permissions:
  contents: read

concurrency:
  group: isolated-admin-owner-approved-deployment
  cancel-in-progress: false

jobs:
  isolated-deploy-and-qa:
    name: Deploy approved source to isolated Preview, then QA and clean fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      APPROVED_SOURCE_SHA: fc760be6fe8a67cc07aa1d32f17d1d5be7b305ac
      ISOLATED_PROJECT: sindarealest-admin-preview
      ISOLATED_DEPLOY_BRANCH: feature-admin-isolated-handoff-2026-10-20
      EXPECTED_FEATURE_SHA: fc760be6fe8a67cc07aa1d32f17d1d5be7b305ac
    steps:
      - name: Enforce owner-approved source and single-workflow-only commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/feature/admin-isolated-handoff-2026-10-20"
          test "$GITHUB_EVENT_NAME" = "push"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ADMIN_TEST_PASSWORD"
          test "$ISOLATED_PROJECT" = "sindarealest-admin-preview"
          test "$ISOLATED_DEPLOY_BRANCH" = "feature-admin-isolated-handoff-2026-10-20"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
      - name: Verify pinned approved source and latest branch SHA
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$APPROVED_SOURCE_SHA" HEAD
          test "$(git diff --name-only "$APPROVED_SOURCE_SHA" HEAD)" = ".github/workflows/owner-approved-preview-deploy-20261025.yml"
          test "$(git ls-remote origin refs/heads/feature/admin-isolated-handoff-2026-10-20 | awk '{print $1}')" = "$GITHUB_SHA"
          echo "Only temporary deploy workflow differs from explicitly approved application SHA."
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies and validate approved source
        run: |
          npm install --no-fund
          npm run check
          npm test
      - name: Read-only verify isolated Pages project and Preview D1 separation
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl -fsSS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest-admin-preview" > "$RUNNER_TEMP/owner-preview-project.json"
          curl -fsSS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/owner-storefront-project.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/owner-preview-project.json','utf8'));
          const s=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/owner-storefront-project.json','utf8'));
          const a=p.result?.deployment_configs?.preview?.d1_databases?.DB?.id;
          const b=p.result?.deployment_configs?.production?.d1_databases?.DB?.id;
          const c=s.result?.deployment_configs?.production?.d1_databases?.DB?.id;
          const good=x=>typeof x==='string'&&/^[a-f0-9-]{36}$/i.test(x);
          if(p.success!==true||s.success!==true||
            p.result?.name!=='sindarealest-admin-preview'||
            s.result?.name!=='sindarealest2'||p.result?.production_branch!=='main'||
            !good(a)||!good(c)||a===c||(good(b)&&a===b))
            throw Error('Isolated Preview project/D1 bindings not safely verified; deploy refused');
          console.info('[ISOLATED_DEPLOY_PREFLIGHT] PASS - production branch main; Preview D1 differs from production');
          NODE
      - name: Deploy ONLY approved source to isolated non-production Pages branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/admin-isolated-handoff-2026-10-20 | awk '{print $1}')" = "$GITHUB_SHA"
          npx wrangler pages deploy public \
            --project-name "$ISOLATED_PROJECT" \
            --branch "$ISOLATED_DEPLOY_BRANCH" \
            --commit-hash "$APPROVED_SOURCE_SHA" \
            --commit-message "Owner-approved isolated Admin Preview ${APPROVED_SOURCE_SHA}"
      - name: Verify reported Preview alias SHA from Cloudflare read-only metadata
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node --input-type=module -e "import {main} from './scripts/admin-preview-provenance-readonly.mjs'; const r=await main(); if(r.status!=='REPORTED_SHA_MATCH') process.exitCode=1"; then
              echo "[PREVIEW_PROVENANCE] REPORTED_SHA_MATCH"
              exit 0
            fi
            echo "[PREVIEW_PROVENANCE] Not matched yet; bounded retry $attempt"
            sleep 8
          done
          echo "::error::Isolated Preview metadata not confirmed at approved SHA; QA refused."
          exit 1
      - name: Install isolated QA browser
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Authenticated isolated QA of order PATCH and 12-screen captures
        shell: bash
        run: node scripts/qa-admin-d1-synthetic-lifecycle.mjs run
      - name: Final run-owned QA cleanup even on test failure
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        run: node scripts/qa-admin-d1-synthetic-lifecycle.mjs cleanup
      - name: Upload SHA evidence and scrubbed QA manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-approved-preview-deploy-qa-${{ github.run_id }}
          path: |
            artifacts/admin-preview-evidence/
            artifacts/admin-12-screen-live/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
