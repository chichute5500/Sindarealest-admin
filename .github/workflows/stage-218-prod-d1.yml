name: Stage 218 New D1 Drafts (No Publish Or Delete)
on:
  push:
    branches:
      - audit/import-218-921-readonly-2026-10-26
    paths:
      - docs/import/RUN-PRODUCTION-D1-STAGE-2026-10-26.trigger
permissions:
  contents: read
concurrency:
  group: owner-import-prod-d1-stage-2026-10-26
  cancel-in-progress: false
jobs:
  stage-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_PRODUCTION_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
      R2_PRODUCTION_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
    steps:
      - name: Guard exact isolated cutover branch
        run: |
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/audit/import-218-921-readonly-2026-10-26"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install S3 HEAD client
        run: npm install --no-save --no-package-lock --no-audit --no-fund @aws-sdk/client-s3@3.914.0
      - name: Check source syntax
        run: node --check scripts/stage-218-imported-products-production-d1.mjs
      - name: Migrate only missing product image colors field and stage 218 unpublished items
        run: node scripts/stage-218-imported-products-production-d1.mjs
