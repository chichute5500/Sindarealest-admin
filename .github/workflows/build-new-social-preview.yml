name: Build new brand social preview
on:
  push:
    branches:
      - fix/new-real-logo-sharing-preview-2026-10-27
    paths:
      - .github/workflows/build-new-social-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Render exact-logo share card
        run: python scripts/build-new-social-preview.py
      - name: Validate JPEG and inspect compact visual thumbnail
        run: |
          python - <<'PY'
          from PIL import Image
          import io,base64
          im=Image.open('public/og-sindarealest-20261027.jpg')
          assert im.size==(1200,630)
          assert im.mode=="RGB"
          thumb=im.resize((480,252))
          bio=io.BytesIO();thumb.save(bio,format='JPEG',quality=65)
          print('OG_ART_THUMB_BASE64='+base64.b64encode(bio.getvalue()).decode('ascii'))
          PY
      - name: Commit only the new preview binary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-sindarealest-20261027.jpg
          if ! git diff --cached --quiet; then
            git commit -m "build(brand): render new social preview from original website logo"
            git push origin HEAD:fix/new-real-logo-sharing-preview-2026-10-27
          fi
