name: Deploy SinDarealest to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    # Must match the currently verified Cloudflare Pages Production branch.
    branches:
      - fix/ai-review-quota-scope-2026-10-15

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_PAGES_BRANCH: fix/ai-review-quota-scope-2026-10-15
      CLOUDFLARE_D1_DATABASE: sindarealest-db
      CLOUDFLARE_PAGES_ORIGINALS_READY: ${{ vars.CLOUDFLARE_PAGES_ORIGINALS_READY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-fund

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Validate project integrity
        run: npm run check

      - name: Run API and data smoke tests
        run: npm test

      - name: Require explicit Cloudflare target
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "::error::Missing CLOUDFLARE_PAGES_PROJECT repository variable"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_BRANCH" || { echo "::error::Missing CLOUDFLARE_PAGES_BRANCH repository variable"; exit 1; }


      - name: Diagnose Cloudflare Pages project access
        run: npx wrangler pages project list --json

      - name: Skip production deploy until ORIGINALS is verified
        if: vars.CLOUDFLARE_PAGES_ORIGINALS_READY != 'true'
        run: echo "::notice::Production deploy skipped safely; verify private ORIGINALS binding before enabling it."

      - name: Diagnose actual Production R2 bindings
        if: success()
        continue-on-error: ${{ vars.CLOUDFLARE_PAGES_ORIGINALS_READY != 'true' }}
        run: node scripts/verify-pages-bindings.mjs

      - name: Deploy to verified Pages project
        if: vars.CLOUDFLARE_PAGES_ORIGINALS_READY == 'true'
        run: npm run deploy
