name: Deploy SinDarealest to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # No Production deploy for AI/QA instructions alone; runtime changes still deploy.
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.cursor/rules/**'
      - '.github/copilot-instructions.md'
      - 'docs/QA_RESOURCE_POLICY.md'
      - 'scripts/qa-resource-guard.mjs'
      - '.github/workflows/qa-resource-policy.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_PAGES_BRANCH: main
      CLOUDFLARE_D1_DATABASE: sindarealest-db

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-fund

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Validate project integrity
        run: npm run check

      - name: Run API and data smoke tests
        run: npm test

      - name: Require explicit Cloudflare target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_R2_READ_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_R2_READ_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "::error::Missing CLOUDFLARE_PAGES_PROJECT repository variable"; exit 1; }
          test "$CLOUDFLARE_PAGES_BRANCH" = "main" || { echo "::error::Production branch must be main"; exit 1; }

      - name: Set Cloudflare Pages Production branch to main
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
            --data '{"production_branch":"main"}')"
          printf '%s' "$response" | jq -e '.success == true and .result.production_branch == "main"' >/dev/null
          echo "Cloudflare Pages Production branch is main."

      - name: Diagnose Cloudflare Pages project access
        run: npx wrangler pages project list --json

      - name: Verify Production Pages and private R2 bindings
        run: node scripts/verify-pages-bindings.mjs

      # Production catalog cutover was completed on 2026-10-27.
      # NEVER run a mutating D1 cutover from the routine production deploy.
      # Restore/migrations/catalog changes need a separately reviewed manual run.

      # Build the exact public assets used by the Storefront before any
      # production Pages upload. The source images and font TTFs are preserved;
      # these scripts only create generated files under public/.
      - name: Generate and verify lightweight Storefront media
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow fonttools brotli
          python3 scripts/build-material-thumbnails.py
          python3 scripts/build-logo-asset.py
          python3 scripts/build-font-assets.py
          test -s public/logo-ui.webp
          test -s public/images/brand-emblem-nav.webp
          test -s public/images/theme-croc-dark-tile.webp
          test -s public/images/theme-croc-albino-tile.webp
          for weight in NotoSans-Regular NotoSans-Bold NotoSerif-Regular NotoSerif-Bold; do
            test -s "public/fonts/${weight}.woff2"
          done

      - name: Deploy to verified Cloudflare Pages project
        if: success()
        env:
          # This is only set after the mandatory private-R2 verifier succeeds.
          CLOUDFLARE_PAGES_ORIGINALS_READY: 'true'
        run: npm run deploy
