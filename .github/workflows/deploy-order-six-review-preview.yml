name: Review Preview — 6-step tracking + completion warranty (NO PRODUCTION)
on:
  push:
    branches:
      - feat/warranty-short-code-2026-10-27
    paths:
      - 'public/**'
      - 'functions/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/deploy-order-six-review-preview.yml'
permissions:
  contents: read
concurrency:
  group: order-six-isolated-review-preview
  cancel-in-progress: false
jobs:
  deploy-review:
    name: Validate and deploy isolated six-step review Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: sindarealest-admin-preview
      CF_PREVIEW_BRANCH: order-six-review-1027
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact review source and nonproduction target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/feat/warranty-short-code-2026-10-27"
          test "$CF_PROJECT" = "sindarealest-admin-preview"
          test "$CF_PREVIEW_BRANCH" = "order-six-review-1027"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and run full source + transaction regression tests
        run: |
          npm install --no-fund
          npm run check
          npm test
      - name: Verify isolated Preview bindings cannot touch Production
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$base/sindarealest-admin-preview" > "$RUNNER_TEMP/review-preview-project.json"
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$base/sindarealest2" > "$RUNNER_TEMP/review-production-project.json"
          node scripts/admin-preview-binding-safety.mjs \
            "$RUNNER_TEMP/review-preview-project.json" "$RUNNER_TEMP/review-production-project.json"
      - name: Deploy to isolated review branch only
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name "$CF_PROJECT" \
            --branch "$CF_PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "6-step tracking review $GITHUB_SHA"
      - name: Print exact deployed review URL and SHA
        run: |
          echo "Review URL: https://order-six-review-1027.sindarealest-admin-preview.pages.dev/"
          echo "Deployed source commit: $GITHUB_SHA"
          echo "Production site remains unchanged."
