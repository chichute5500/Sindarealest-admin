name: Storefront SEO and UX audit — isolated Preview
on:
  push:
    branches:
      - fix/storefront-seo-content-motion-2026-10-31
    paths:
      - 'public/**'
      - 'functions/_middleware.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/storefront-seo-ux-preview-20261031.yml'
permissions:
  contents: read
concurrency:
  group: sd-storefront-seo-ux-20261031
  cancel-in-progress: false
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PREVIEW_PROJECT: sindarealest-admin-preview
      CF_PREVIEW_BRANCH: seo-ux-audit-1031
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require exact branch and separate Preview
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/fix/storefront-seo-content-motion-2026-10-31'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CF_PREVIEW_PROJECT" = 'sindarealest-admin-preview'
          test "$CF_PREVIEW_BRANCH" = 'seo-ux-audit-1031'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-fund
      - name: Validate full source + UI/order contracts
        run: |
          npm run check
          node tests/storefront-source-seo-audit.test.mjs
          node tests/order-trust-layout.test.mjs
          node tests/catalog-direct-links-bootstrap.test.mjs
          node tests/catalog-listing-routes.test.mjs
          node tests/pages-routing.test.mjs
      - name: Ensure nonproduction D1/R2 bindings are isolated (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl -fsS --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest-admin-preview" > "$RUNNER_TEMP/sd-seo-preview.json"
          curl -fsS --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/sd-seo-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/sd-seo-preview.json" "$RUNNER_TEMP/sd-seo-production.json"
      - name: Deploy exact tested SHA to isolated Preview only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/storefront-seo-content-motion-2026-10-31'
          npx wrangler pages deploy public --project-name "$CF_PREVIEW_PROJECT" --branch "$CF_PREVIEW_BRANCH" --commit-hash "$GITHUB_SHA" --commit-message "Storefront SEO UX Preview $GITHUB_SHA"
          echo "Preview: https://seo-ux-audit-1031.sindarealest-admin-preview.pages.dev/"
          echo "Source: $GITHUB_SHA"
