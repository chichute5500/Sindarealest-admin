              test -n "$same_sku_key_1" && test -n "$same_sku_key_2" || { echo "::error::Same-SKU pair route did not return both image keys."; exit 1; }
              second_status="$(curl --connect-timeout 10 --max-time 30 --silent --show-error -o /tmp/ai-test-sku-pair-second-source -w "%{http_code}" -H "Authorization: Bearer $smoke_token" "$base/api/ai-smoke-ci?key=$same_sku_key_2")"
              test "$second_status" = "200" || { echo "::error::Could not fetch the second same-SKU gallery image (HTTP $second_status)."; exit 1; }
              SAME_SKU_KEY_1="$same_sku_key_1" SAME_SKU_KEY_2="$same_sku_key_2" node --input-type=module - <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import sharp from "sharp";
          const keys = [decodeURIComponent(process.env.SAME_SKU_KEY_1), decodeURIComponent(process.env.SAME_SKU_KEY_2)];
          const sources = [await readFile("/tmp/ai-test-sku-pair-source"), await readFile("/tmp/ai-test-sku-pair-second-source")];
          const data = [];
          for (let i = 0; i < sources.length; i++) {
            const jpeg = await sharp(sources[i], { failOn: "error" }).rotate().resize({ width: 384, height: 384, fit: "inside", withoutEnlargement: true }).jpeg({ quality: 65, mozjpeg: true }).toBuffer();
            if (!jpeg.length || jpeg.length > 180000) throw new Error("Same-SKU test image exceeds safe size.");
            data.push({ key: keys[i], dataUrl: "data:image/jpeg;base64," + jpeg.toString("base64") });
          }
          if (data[0].dataUrl === data[1].dataUrl) throw new Error("Same-SKU gallery pair contains identical decoded image bytes; different-angle matching cannot be validated by this pair.");
          await writeFile("/tmp/ai-test-same-sku-compare-request.json", JSON.stringify({ action: "compare", imageKeys: keys, imageData: data, testSameSku: true }));
          NODE
              sku_status="$(curl --connect-timeout 10 --max-time 90 --silent --show-error -o /tmp/ai-test-same-sku-compare.json -w "%{http_code}" -X POST -H "Authorization: Bearer $smoke_token" -H "Content-Type: application/json" --data-binary @/tmp/ai-test-same-sku-compare-request.json "$base/api/ai-smoke-ci")"
              if [ "$sku_status" != "200" ]; then
                diagnostic="$(jq -c '{ok,reason,status,detail,error,message}' /tmp/ai-test-same-sku-compare.json 2>/dev/null || true)"
                echo "::error::Same-SKU different-image AI comparison failed with HTTP $sku_status. Safe diagnostic: ${diagnostic:-no JSON diagnostic returned}."; exit 1
              fi
              jq -e '.ok == true and (((.matches|type)=="number" and .matches>=1) or ((.matches|type)=="array" and (.matches|length)>=1))' /tmp/ai-test-same-sku-compare.json >/dev/null || { echo "::error::AI did not identify a high-confidence match between two distinct images assigned to the same SKU."; exit 1; }
              echo "PASS: real Workers AI matched two distinct Preview gallery images assigned to the same SKU; the no-write DB prevented persistence."
            elif [ "$sku_pair_status" = "424" ]; then
              echo "::warning::Preview D1 contains no product gallery with two distinct small raster images; same-product different-angle matching remains unverified."
            else
              echo "::error::Could not discover a same-SKU gallery pair (HTTP $sku_pair_status)."; exit 1
            fi
          rm -f /tmp/ai-test-cookies /tmp/ai-test-login.json /tmp/ai-test-inventory.json /tmp/ai-test-source-image /tmp/ai-test-source-image.jpg /tmp/ai-test-source-image.b64 /tmp/ai-test-classify.json /tmp/ai-test-classify-request.json /tmp/ai-test-vision-source /tmp/ai-test-vision-headers /tmp/ai-test-vision-jpeg.b64 /tmp/ai-test-vision-request.json /tmp/ai-test-vision.json
          echo "Test project deployment: $base"
          echo "::notice::This workflow changes only $TARGET_PROJECT. Source Production branch, D1, and R2 are never deployed to or modified."
