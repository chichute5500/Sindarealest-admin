name: Bootstrap separate AI image test project

on:
  push:
    branches:
      - feature/ai-image-grouping

permissions:
  contents: read

jobs:
  create-isolated-pages-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify isolation and create a separate Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_PROJECT: sindarealest2
          TARGET_PROJECT: sindarealest-ai-image-test
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          source="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api/pages/projects/$SOURCE_PROJECT")"
          printf '%s' "$source" | jq -e '.success == true' >/dev/null
          production_branch="$(printf '%s' "$source" | jq -r '.result.production_branch // empty')"
          preview_db="$(printf '%s' "$source" | jq -r '.result.deployment_configs.preview.d1_databases.DB.id // empty')"
          production_db="$(printf '%s' "$source" | jq -r '.result.deployment_configs.production.d1_databases.DB.id // empty')"
          preview_images="$(printf '%s' "$source" | jq -r '.result.deployment_configs.preview.r2_buckets.IMAGES.name // empty')"
          production_images="$(printf '%s' "$source" | jq -r '.result.deployment_configs.production.r2_buckets.IMAGES.name // empty')"

          test "$production_branch" = "main" || { echo "::error::Source Production branch is not main. Stopping."; exit 1; }
          test -n "$preview_db" && test -n "$production_db" || { echo "::error::Cannot verify both D1 bindings. Stopping."; exit 1; }
          test "$preview_db" != "$production_db" || { echo "::error::Source Preview DB is Production DB. Stopping."; exit 1; }
          test -n "$preview_images" && test -n "$production_images" || { echo "::error::Cannot verify both IMAGES buckets. Stopping."; exit 1; }
          test "$preview_images" != "$production_images" || { echo "::error::Source Preview IMAGES bucket is Production. Stopping."; exit 1; }

          printf 'Isolation verified. Target project: %s\n' "$TARGET_PROJECT"
          current="$(curl --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api/pages/projects/$TARGET_PROJECT")"
          exists="$(printf '%s' "$current" | jq -r '.success // false')"
          if [ "$exists" = "true" ]; then
                        target_db="$(printf '%s' "$current" | jq -r '.result.deployment_configs.production.d1_databases.DB.id // empty')"
                        target_images="$(printf '%s' "$current" | jq -r '.result.deployment_configs.production.r2_buckets.IMAGES.name // empty')"
            echo "Existing project found; isolated bindings will be applied below."
            echo "Separate Pages project already exists."
          else
            payload="$(jq -n --arg name "$TARGET_PROJECT" --arg db "$preview_db" --arg images "$preview_images" '{
              name:$name,
              production_branch:"main",
              deployment_configs:{
                preview:{
                  compatibility_date:"2026-10-17",
                  d1_databases:{DB:{id:$db}},
                  r2_buckets:{IMAGES:{name:$images}}
                },
                production:{compatibility_date:"2026-10-17"}
              }
            }')"
            http_status="$(curl --silent --show-error -o /tmp/pages-create-response.json -w "%{http_code}" -X POST "$api/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" --data "$payload")"
            created="$(cat /tmp/pages-create-response.json)"
            if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
              echo "::error::Cloudflare Pages project creation returned HTTP $http_status."
              printf '%s' "$created" | jq -c '{errors, messages}' || true
              exit 1
            fi
            printf '%s' "$created" | jq -e '.success == true' >/dev/null || { printf '%s' "$created" | jq -c '{errors, messages}'; exit 1; }
            echo "Created separate Pages project with isolated Preview D1 and IMAGES bindings."
          fi

      - name: Configure isolated test bindings and optional test credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_PROJECT: sindarealest-ai-image-test
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          source="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api/pages/projects/sindarealest2")"
          printf '%s' "$source" | jq -e '.success == true' >/dev/null
          preview_db="$(printf '%s' "$source" | jq -r '.result.deployment_configs.preview.d1_databases.DB.id // empty')"
          preview_images="$(printf '%s' "$source" | jq -r '.result.deployment_configs.preview.r2_buckets.IMAGES.name // empty')"
          production_db="$(printf '%s' "$source" | jq -r '.result.deployment_configs.production.d1_databases.DB.id // empty')"
          production_images="$(printf '%s' "$source" | jq -r '.result.deployment_configs.production.r2_buckets.IMAGES.name // empty')"
          production_branch="$(printf '%s' "$source" | jq -r '.result.production_branch // empty')"
          test "$production_branch" = "main" || { echo "::error::Source Production branch is not main."; exit 1; }
          test -n "$preview_db" && test -n "$production_db" && test "$preview_db" != "$production_db" || { echo "::error::Preview D1 is missing or points to Production."; exit 1; }
          test -n "$preview_images" && test -n "$production_images" && test "$preview_images" != "$production_images" || { echo "::error::Preview IMAGES is missing or points to Production."; exit 1; }

          payload="$(jq -n --arg db "$preview_db" --arg images "$preview_images" '{deployment_configs:{production:{compatibility_date:"2026-10-17",d1_databases:{DB:{id:$db}},r2_buckets:{IMAGES:{name:$images}}}}}')"
          response="$(curl --fail --silent --show-error -X PATCH "$api/pages/projects/$TARGET_PROJECT" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" --data "$payload")"
          printf '%s' "$response" | jq -e '.success == true' >/dev/null
          echo "PASS: test project's D1 and R2 bindings point to the checked Preview resources, not source Production."

          # Always create disposable credentials for the isolated test site. If a
          # dedicated test-only password secret exists, use it; otherwise generate
          # a random one so authenticated Preview/AI smoke tests are not silently skipped.
          test_admin_password="${AI_TEST_ADMIN_PASSWORD:-$(openssl rand -hex 24)}"
          test "${#test_admin_password}" -ge 12 || { echo "::error::Dedicated test password must be at least 12 characters."; exit 1; }
          session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$test_admin_password"
          echo "AI_TEST_ADMIN_PASSWORD=$test_admin_password" >> "$GITHUB_ENV"
          env_vars="$(jq -n --arg password "$test_admin_password" --arg session "$session_secret" '{ADMIN_PASSWORD:{type:"secret_text",value:$password},SESSION_SECRET:{type:"secret_text",value:$session}}')"
          unset session_secret test_admin_password
          echo "Configuring disposable admin credentials and a fresh random SESSION_SECRET only on the isolated test project; values are not logged."
          secret_payload="$(jq -n --argjson env_vars "$env_vars" '{deployment_configs:{production:{env_vars:$env_vars}}}')"
          secret_response="$(curl --fail --silent --show-error -X PATCH "$api/pages/projects/$TARGET_PROJECT" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" --data "$secret_payload")"
          printf '%s' "$secret_response" | jq -e '.success == true' >/dev/null
          unset env_vars secret_payload secret_response
          echo "PASS: disposable test admin credentials were saved as Cloudflare secret_text values."

      - name: Install Wrangler and image smoke-test converter
        run: npm install --no-save --no-package-lock wrangler sharp

      - name: Deploy AI-enabled configuration to the separate test project only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_PROJECT: sindarealest-ai-image-test
          AI_TEST_ADMIN_PASSWORD: ${{ secrets.AI_TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          # Re-check isolation in the deployment step itself. Never deploy a test
          # config if the source project's Preview DB or IMAGES points to Production.
          source="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$api/pages/projects/sindarealest2")"
          printf '%s' "$source" | jq -e '.success == true' >/dev/null
          source_production_branch="$(printf '%s' "$source" | jq -r '.result.production_branch // empty')"
          preview_db="$(printf '%s' "$source" | jq -r '.result.deployment_configs.preview.d1_databases.DB.id // empty')"
          production_db="$(printf '%s' "$source" | jq -r '.result.deployment_configs.production.d1_databases.DB.id // empty')"
          preview_images="$(printf '%s' "$source" | jq -r '.result.deployment_configs.preview.r2_buckets.IMAGES.name // empty')"
          production_images="$(printf '%s' "$source" | jq -r '.result.deployment_configs.production.r2_buckets.IMAGES.name // empty')"
          test "$source_production_branch" = "main" || { echo "::error::Source Production branch is not main; refusing test deployment."; exit 1; }
          test -n "$preview_db" && test -n "$production_db" && test "$preview_db" != "$production_db" || { echo "::error::Preview D1 is missing or not isolated; refusing test deployment."; exit 1; }
          test -n "$preview_images" && test -n "$production_images" && test "$preview_images" != "$production_images" || { echo "::error::Preview IMAGES is missing or not isolated; refusing test deployment."; exit 1; }

          d1="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$api/d1/database/$preview_db")"
          printf '%s' "$d1" | jq -e '.success == true' >/dev/null
          preview_db_name="$(printf '%s' "$d1" | jq -r '.result.name // empty')"
          test -n "$preview_db_name" || { echo "::error::Could not resolve the isolated Preview D1 name."; exit 1; }

          target="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$api/pages/projects/$TARGET_PROJECT")"
          printf '%s' "$target" | jq -e '.success == true' >/dev/null
          target_branch="$(printf '%s' "$target" | jq -r '.result.production_branch // empty')"
          test "$target_branch" = "main" || { echo "::error::Target test project's Production branch is not main; refusing deploy."; exit 1; }

          # Preserve plain-text Dashboard vars if present. Secrets are not removed
          # by Wrangler deployments and their values are never read or logged here.
          target_vars="$(printf '%s' "$target" | jq -c '
            ((.result.deployment_configs.production.env_vars // {})
              | with_entries(select(.value.type == "plain_text"))
              | with_entries(.value = .value.value))')"
          # Pages Wrangler accepts its standard config filenames only. Keep the
          # repository's local-only TOML out of the way for this runner step,
          # generate a temporary wrangler.jsonc, and always restore the original.
          config="$GITHUB_WORKSPACE/wrangler.jsonc"
          original_config="$RUNNER_TEMP/wrangler.toml.original"
          smoke_route="$GITHUB_WORKSPACE/functions/api/ai-smoke-ci.js"
          smoke_token="$(openssl rand -hex 32)"
          echo "::add-mask::$smoke_token"
          cp "$GITHUB_WORKSPACE/wrangler.toml" "$original_config"
          cleanup() {
            status=$?
            set +e
            rm -f "$smoke_route"
            # Remove the temporary inference route from the deployed test project
            # even if the smoke request or later checks fail.
            if [ -f "$config" ] && [ -f "$original_config" ]; then
              npx wrangler pages deploy public --project-name "$TARGET_PROJECT" --branch main --commit-dirty=true > /tmp/ai-test-cleanup-deploy.log 2>&1
              cleanup_status=$?
              if [ "$cleanup_status" -eq 0 ]; then
                echo "PASS: temporary AI smoke route removed from the test deployment."
              else
                echo "::error::Could not confirm cleanup deployment; inspect the test project before reuse."
                if [ "$status" -eq 0 ]; then status=1; fi
              fi
            fi
            rm -f "$config"
            cp "$original_config" "$GITHUB_WORKSPACE/wrangler.toml"
            rm -f "$original_config"
            rm -f /tmp/ai-test-cleanup-deploy.log
            trap - EXIT
            exit "$status"
          }
          trap cleanup EXIT
          rm "$GITHUB_WORKSPACE/wrangler.toml"
          jq -n \
            --arg name "$TARGET_PROJECT" \
            --arg db_name "$preview_db_name" \
            --arg db_id "$preview_db" \
            --arg images "$preview_images" \
            --argjson vars "$target_vars" \
            '{
              name: $name,
              pages_build_output_dir: "public",
              compatibility_date: "2026-10-17",
              ai: { binding: "AI" },
              d1_databases: [{ binding: "DB", database_name: $db_name, database_id: $db_id }],
              r2_buckets: [{ binding: "IMAGES", bucket_name: $images }]
            } + (if ($vars | length) > 0 then { vars: $vars } else {} end)' > "$config"

          # Install a one-run, token-gated smoke route only in the isolated test project.
          # It reads one small Preview R2 raster, calls Workers AI once, and writes no data.
          mkdir -p "$GITHUB_WORKSPACE/functions/api"
          cat > "$smoke_route" <<'SMOKE_ROUTE'
          import { onRequestPost as classifyImages } from "./admin/image-groups.js";
          import { createSession } from "../_lib.js";
          function response(body, status = 200, headers = {}) {
            return new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json", "Cache-Control": "no-store", ...headers } });
          }
          async function findSmallRaster(env) {
            let cursor;
            for (let pageNumber = 0; pageNumber < 20; pageNumber++) {
              const page = await env.IMAGES.list({ limit: 1000, ...(cursor ? { cursor } : {}), include: ["httpMetadata"] });
              for (const object of page.objects || []) {
                const supplied = String(object.httpMetadata?.contentType || "").split(";")[0].trim().toLowerCase();
                const ext = String(object.key || "").split(".").pop().toLowerCase();
                const fallback = {jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp"}[ext] || "";
                const declared = supplied ? (["image/jpeg","image/png","image/webp"].includes(supplied) ? supplied : "") : fallback;
                if (!declared || Number(object.size) <= 0 || Number(object.size) > 350000) continue;
                // Metadata and file extensions can be stale. Verify the bytes before
                // selecting a candidate, otherwise an HTML/XML placeholder can make
                // Sharp fail before the AI request is even reached.
                const candidate = await env.IMAGES.get(object.key);
                if (!candidate) continue;
                const bytes = new Uint8Array(await candidate.arrayBuffer());
                if (!bytes.length || bytes.length > 350000) continue;
                let mime = "";
                if (bytes.length >= 3 && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) mime = "image/jpeg";
                else if (bytes.length >= 8 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47 && bytes[4] === 0x0d && bytes[5] === 0x0a && bytes[6] === 0x1a && bytes[7] === 0x0a) mime = "image/png";
                else if (bytes.length >= 12 && String.fromCharCode(...bytes.slice(0,4)) === "RIFF" && String.fromCharCode(...bytes.slice(8,12)) === "WEBP") mime = "image/webp";
                if (mime) return { key: object.key, mime, bytes };
              }
              if (!page.truncated || !page.cursor) break;
              cursor = page.cursor;
            }
            return null;
          }
          export async function onRequestGet({ request, env }) {
            if (request.headers.get("Authorization") !== "Bearer __SMOKE_TOKEN__") return response({ ok: false }, 404);
            if (typeof env?.IMAGES?.list !== "function") return response({ ok: false, reason: "r2_binding_missing" }, 503);
            try {
              const chosen = await findSmallRaster(env);
              if (!chosen) return response({ ok: false, reason: "no_small_preview_raster" }, 424);
              const bytes = chosen.bytes;
              return new Response(bytes, { status: 200, headers: { "Content-Type": chosen.mime, "X-Preview-Image-Key": encodeURIComponent(chosen.key), "Cache-Control": "no-store" } });
            } catch (error) {
              return response({ ok: false, reason: "r2_read_error", message: String(error?.message || error).replace(/[\r\n]+/g, " ").slice(0, 120) }, 502);
            }
          }
          export async function onRequestPost({ request, env }) {
            if (request.headers.get("Authorization") !== "Bearer __SMOKE_TOKEN__") return response({ ok: false }, 404);
            try {
              const body = await request.json();
              if (!body || typeof body.imageKey !== "string" || !body.imageKey || typeof body.dataUrl !== "string" || !/^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/.test(body.dataUrl) || body.dataUrl.length > 250000) return response({ ok: false, reason: "invalid_jpeg_payload" }, 400);
              // Invoke the real admin classification handler with a short-lived
              // synthetic session and a no-write rate-limit stub. This exercises
              // the same validation, prompt, response parser and R2 existence check.
              const sessionSecret = "__SMOKE_TOKEN__";
              const session = await createSession(sessionSecret);
              const origin = new URL(request.url).origin;
              const internalRequest = new Request(origin + "/api/admin/image-groups", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Cookie": "sd_admin_session=" + session,
                  "Origin": origin,
                  "Sec-Fetch-Site": "same-origin"
                },
                body: JSON.stringify({ action: "classify-categories", imageKeys: [body.imageKey], imageData: [{ key: body.imageKey, dataUrl: body.dataUrl }] })
              });
              const fakeDB = {
                prepare(sql) {
                  return { sql, bind() { return this; }, async run() { return { meta: { changes: 1 } }; }, async first() { return null; }, async all() { return { results: [] }; } };
                },
                async batch() { return [{ meta: { changes: 1 } }, { results: [{ attempts: 1 }] }]; }
              };
              const handlerResponse = await classifyImages({
                request: internalRequest,
                env: { ...env, DB: fakeDB, ADMIN_PASSWORD: sessionSecret, SESSION_SECRET: sessionSecret },
                context: { request: internalRequest }
              });
              const result = await handlerResponse.json();
              if (handlerResponse.status !== 200 || result?.ok !== true || !Array.isArray(result.items) || result.items.length !== 1) {
                return response({ ok: false, reason: "classification_handler_failed", status: handlerResponse.status, detail: String(result?.error || result?.message || "No validated classification").slice(0, 160) }, 502);
              }
              return response({ ok: true, category: result.items[0].category, confidence: result.items[0].confidence, status: result.items[0].status, adminPasswordConfigured: typeof env.ADMIN_PASSWORD === "string" && env.ADMIN_PASSWORD.length >= 12, sessionSecretConfigured: typeof env.SESSION_SECRET === "string" && env.SESSION_SECRET.length >= 32, imageBytes: body.dataUrl.length });
            } catch (error) {
              return response({ ok: false, reason: "classification_handler_exception", message: String(error?.message || error).replace(/[\r\n]+/g, " ").slice(0, 160) }, 502);
            }
          }
          SMOKE_ROUTE
          sed -i "s/__SMOKE_TOKEN__/$smoke_token/" "$smoke_route"

          echo "Deploying the AI binding only to $TARGET_PROJECT. DB/IMAGES point to the checked source Preview resources."
          npx wrangler pages deploy public --project-name "$TARGET_PROJECT" --branch main --commit-dirty=true

          # Every deploy gets public-route/auth-guard smoke checks. The temporary AI route is token-gated and removed by the EXIT cleanup above.
          base="https://${TARGET_PROJECT}.pages.dev"
          home_status="$(curl --silent --show-error -o /tmp/ai-test-home.html -w "%{http_code}" "$base/")"
          admin_status="$(curl --silent --show-error -o /tmp/ai-test-admin.html -w "%{http_code}" "$base/admin/")"
          test "$home_status" = "200" || { echo "::error::AI test project home smoke check returned HTTP $home_status."; exit 1; }
          test "$admin_status" = "200" || { echo "::error::AI test project admin route smoke check returned HTTP $admin_status."; exit 1; }
          grep -q "Đăng nhập quản trị" /tmp/ai-test-admin.html || { echo "::error::Admin login content missing from test deployment."; exit 1; }
          api_status="$(curl --silent --show-error -o /tmp/ai-test-api.json -w "%{http_code}" "$base/api/admin/image-groups")"
          test "$api_status" = "401" || { echo "::error::Unauthenticated admin API should return 401, received HTTP $api_status."; exit 1; }
          echo "PASS: test site, admin route, and protected API smoke checks."

          source_status="$(curl --connect-timeout 10 --max-time 30 --silent --show-error -D /tmp/ai-test-vision-headers -o /tmp/ai-test-vision-source -w "%{http_code}" -H "Authorization: Bearer $smoke_token" "$base/api/ai-smoke-ci")"
          if [ "$source_status" = "424" ]; then
            echo "::warning::No suitable small raster image exists in Preview R2; actual vision inference could not be tested."
          elif [ "$source_status" = "200" ]; then
            node --input-type=module - <<'NODE'
          import sharp from "sharp";
          import { readFile, writeFile } from "node:fs/promises";
          const source = await readFile("/tmp/ai-test-vision-source");
          const jpeg = await sharp(source, { failOn: "error" }).rotate().resize({ width: 384, height: 384, fit: "inside", withoutEnlargement: true }).jpeg({ quality: 65, mozjpeg: true }).toBuffer();
          if (!jpeg.length || jpeg.length > 180000) throw new Error("Converted smoke image exceeds safe size.");
          await writeFile("/tmp/ai-test-vision-jpeg.b64", jpeg.toString("base64"));
          NODE
            image_key_encoded="$(awk 'tolower($1)=="x-preview-image-key:" {gsub("\\r","",$2); print $2}' /tmp/ai-test-vision-headers)"
            test -n "$image_key_encoded" || { echo "::error::Preview R2 image key header is missing."; exit 1; }
            AI_TEST_IMAGE_KEY_ENCODED="$image_key_encoded" node --input-type=module - <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const encoded = (await readFile("/tmp/ai-test-vision-jpeg.b64", "utf8")).trim();
          const imageKey = decodeURIComponent(process.env.AI_TEST_IMAGE_KEY_ENCODED || "");
          await writeFile("/tmp/ai-test-vision-request.json", JSON.stringify({ imageKey, dataUrl: "data:image/jpeg;base64," + encoded }));
          NODE
            ai_smoke_status="$(curl --connect-timeout 10 --max-time 60 --silent --show-error -o /tmp/ai-test-vision.json -w "%{http_code}" -X POST -H "Authorization: Bearer $smoke_token" -H "Content-Type: application/json" --data-binary @/tmp/ai-test-vision-request.json "$base/api/ai-smoke-ci")"
            if [ "$ai_smoke_status" = "200" ]; then
              jq -e '.ok == true and (.category | type == "string") and (.confidence | type == "number") and (.status == "classified" or .status == "needs_review") and (.imageBytes > 0)' /tmp/ai-test-vision.json >/dev/null || {
                echo "::error::Real Workers AI smoke response was invalid. Response body omitted."; exit 1;
              }
              result_summary="$(jq -r '"category=" + .category + ", confidence=" + (.confidence|tostring) + ", status=" + .status' /tmp/ai-test-vision.json)"
              echo "PASS: real admin classifier on Preview R2 image: $result_summary. No database or product gallery was modified."
              if jq -e '.adminPasswordConfigured == true and .sessionSecretConfigured == true' /tmp/ai-test-vision.json >/dev/null; then
                echo "PASS: test-project admin security secrets are present (values not read or logged)."
              else
                echo "::warning::AI inference passed, but ADMIN_PASSWORD and/or SESSION_SECRET is missing/too short on the test project; admin browser login remains unverified."
              fi
            else
              diagnostic="$(jq -r '[.reason // empty, .message // empty] | map(select(length > 0)) | join(": ")' /tmp/ai-test-vision.json 2>/dev/null | tr '\r\n' ' ' | cut -c1-180 || true)"
              echo "::error::Real Workers AI smoke test failed with HTTP $ai_smoke_status. Safe diagnostic: ${diagnostic:-no JSON diagnostic returned}. Auth tokens and request headers are not logged."
              exit 1
            fi
          else
            diagnostic="$(jq -r '[.reason // empty, .message // empty] | map(select(length > 0)) | join(": ")' /tmp/ai-test-vision-source 2>/dev/null | tr '\r\n' ' ' | cut -c1-180 || true)"
            echo "::error::Could not retrieve a test image from Preview R2 (HTTP $source_status). Safe diagnostic: ${diagnostic:-no JSON diagnostic returned}."
            exit 1
          fi

          if [ -n "${AI_TEST_ADMIN_PASSWORD:-}" ]; then
            login_payload="$(jq -n --arg password "$AI_TEST_ADMIN_PASSWORD" '{password:$password}')"
            login_status="$(curl --silent --show-error -o /tmp/ai-test-login.json -w "%{http_code}" \
              -X POST "$base/api/admin/login" \
              -H "Origin: $base" -H "Sec-Fetch-Site: same-origin" -H "Content-Type: application/json" \
              -c /tmp/ai-test-cookies --data "$login_payload")"
            test "$login_status" = "200" || { echo "::error::Dedicated test admin login failed with HTTP $login_status. Response body omitted to avoid exposing details."; exit 1; }
            echo "PASS: dedicated test admin credentials work."

            inventory_status="$(curl --silent --show-error -o /tmp/ai-test-inventory.json -w "%{http_code}" \
              -b /tmp/ai-test-cookies "$base/api/admin/image-groups-inventory?limit=100")"
            test "$inventory_status" = "200" || { echo "::error::Authenticated D1/R2 inventory returned HTTP $inventory_status."; exit 1; }
            echo "PASS: authenticated D1/R2 inventory endpoint responded. Real image bytes and Workers AI inference are verified by the isolated, format-checked vision smoke route above."
          else
            echo "::warning::Authenticated/AI runtime smoke tests skipped because AI_TEST_ADMIN_PASSWORD is not configured as a dedicated GitHub Actions secret."
          fi
          rm -f /tmp/ai-test-cookies /tmp/ai-test-login.json /tmp/ai-test-inventory.json /tmp/ai-test-source-image /tmp/ai-test-source-image.jpg /tmp/ai-test-source-image.b64 /tmp/ai-test-classify.json /tmp/ai-test-classify-request.json /tmp/ai-test-vision-source /tmp/ai-test-vision-headers /tmp/ai-test-vision-jpeg.b64 /tmp/ai-test-vision-request.json /tmp/ai-test-vision.json
          echo "Test project deployment: $base"
          echo "::notice::This workflow changes only $TARGET_PROJECT. Source Production branch, D1, and R2 are never deployed to or modified."
