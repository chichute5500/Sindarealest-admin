name: D1 Rows read analytics — read only (Preview + Production)

on:
  push:
    branches:
      - perf/d1-rows-read-safe-2026-10-30
    paths:
      - 'scripts/d1-rows-read-insights-readonly.mjs'
      - '.github/workflows/d1-rows-read-insights-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    name: Analyze account-level D1 Rows read (NO D1 queries/writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guard repository, branch and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/perf/d1-rows-read-safe-2026-10-30"
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare API token is absent"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare Account ID is absent"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned Wrangler CLI
        run: npm install --no-fund
      - name: Fetch read-only GraphQL analytics and D1 Insights (never execute SQL)
        run: node scripts/d1-rows-read-insights-readonly.mjs
      - name: Upload sanitized metrics only (no raw SQL or secrets)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-rows-readonly-insights
          path: artifacts/d1-readonly/summary.json
          if-no-files-found: ignore
          retention-days: 3
