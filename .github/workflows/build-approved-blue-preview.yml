name: Build user-approved blue share preview
on:
  push:
    branches:
      - fix/light-blue-approved-share-image-2026-10-27
    paths:
      - .github/workflows/build-approved-blue-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet Pillow
      - name: Decode/checksum and upscale the exact approved light-blue artwork
        run: python scripts/build-approved-blue-preview.py
      - name: Commit share image to the isolated fix branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-sindarealest-light-blue-20261027.jpg
          if ! git diff --cached --quiet; then
            git commit -m "build(preview): publish approved ice-blue share image"
            git push origin HEAD:fix/light-blue-approved-share-image-2026-10-27
          fi
