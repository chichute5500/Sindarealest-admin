name: Mobile ordering UX — isolated Storefront Preview

on:
  push:
    branches:
      - feat/mobile-checkout-sheet-motion-2026-10-31
    paths:
      - 'public/**'
      - 'tests/mobile-ordering-motion.test.mjs'
      - 'package.json'
      - '.github/workflows/mobile-ordering-isolated-preview.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ordering-ux-preview-20261031
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Validate and deploy ONLY isolated Preview project
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PREVIEW_PROJECT: sindarealest-admin-preview
      CF_PREVIEW_BRANCH: mobile-order-ux-1031
    steps:
      - name: Checkout pinned preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse production or unexpected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/feat/mobile-checkout-sheet-motion-2026-10-31'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CF_PREVIEW_PROJECT" = 'sindarealest-admin-preview'
          test "$CF_PREVIEW_BRANCH" = 'mobile-order-ux-1031'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund
      - name: Validate Storefront source and unchanged checkout contract
        run: |
          npm run check
          node tests/mobile-ordering-motion.test.mjs

      - name: Verify separate Preview and Production bindings (read only)
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest-admin-preview" > "$RUNNER_TEMP/mobile-order-preview.json"
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/sindarealest2" > "$RUNNER_TEMP/mobile-order-production.json"
          node scripts/admin-preview-binding-safety.mjs "$RUNNER_TEMP/mobile-order-preview.json" "$RUNNER_TEMP/mobile-order-production.json"
          jq -e '.result.production_branch == "main" and .success == true' "$RUNNER_TEMP/mobile-order-preview.json" >/dev/null

      - name: Deploy only independent Preview Pages project
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/mobile-checkout-sheet-motion-2026-10-31'
          npx wrangler pages deploy public --project-name "$CF_PREVIEW_PROJECT" --branch "$CF_PREVIEW_BRANCH" --commit-hash "$GITHUB_SHA" --commit-message "Mobile order UX Preview $GITHUB_SHA"

      - name: Print expected preview address and exact source SHA
        run: |
          echo 'Expected Preview: https://mobile-order-ux-1031.sindarealest-admin-preview.pages.dev/'
          echo "Source SHA: $GITHUB_SHA"
          echo 'No Production deploy; no D1/R2 mutation in this workflow.'
