name: Generate favicon assets from official website logo

on:
  push:
    branches:
      - fix/official-brand-favicon-share-preview-2026-10-27
    paths:
      - .github/workflows/generate-official-favicons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout brand assets
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Render favicons from official emblem
        run: python scripts/build-official-favicons.py
      - name: Confirm original owner-approved share image
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          im=Image.open('public/og-sindarealest.jpg')
          assert im.size==(1200,630) and im.format=='JPEG', (im.size,im.format)
          print('OFFICIAL_OG=PASS 1200x630 actual-brand JPEG')
          PY
      - name: Commit generated assets to this fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.ico public/favicon-16x16.png public/favicon-32x32.png public/favicon-48x48.png public/apple-touch-icon.png public/android-chrome-192x192.png public/android-chrome-512x512.png
          if git diff --cached --quiet; then
            echo "Official favicon assets already up-to-date"
          else
            git commit -m "build(brand): add favicons resized from real SinDarealest emblem"
            git push origin HEAD:fix/official-brand-favicon-share-preview-2026-10-27
          fi
