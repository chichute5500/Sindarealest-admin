name: Production D1 payment delivery migration 0018 (Owner approved once)

on:
  push:
    branches:
      - feat/storefront-payment-cod-sync-20261101
    paths:
      - '.github/workflows/production-payment-migration-0018-once.yml'

permissions:
  contents: read

concurrency:
  group: sindarealest-production-d1-schema-migration-0018
  cancel-in-progress: false

jobs:
  apply-approved-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Check pinned repository and explicit approval marker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chichute5500/Sindarealest-admin'
          test "$GITHUB_REF" = 'refs/heads/feat/storefront-payment-cod-sync-20261101'
          [[ "$GITHUB_EVENT_HEAD_COMMIT_MESSAGE" == *'[production-migration-0018-approved]'* ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Check out exact approved candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install migration tool and validate migration source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
      - name: Backup via Time Travel bookmark then apply exactly migration 0018
        run: node scripts/apply-production-payment-migration-0018.mjs
      - name: Record non-sensitive result
        if: always()
        run: |
          echo 'Owner-authorized migration 0018; Production D1 identity guarded, Time Travel bookmark required.' >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
