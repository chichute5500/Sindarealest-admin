name: Audit newest product titles in Production D1 (read-only)
on:
  push:
    branches: [audit/recent-product-titles-2026-10-28]
    paths:
      - 'scripts/audit-recent-product-titles-readonly.mjs'
      - '.github/workflows/audit-recent-product-titles-20261028.yml'
permissions:
  contents: read
concurrency:
  group: sd-recent-title-audit-1028
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout immutable auditing source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Production identity and latest 60 product titles (SELECT only)
        run: node scripts/audit-recent-product-titles-readonly.mjs
