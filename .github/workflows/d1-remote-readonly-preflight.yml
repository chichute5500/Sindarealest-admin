name: D1 Preview/Production index preflight — read only

on:
  push:
    branches:
      - perf/d1-rows-read-safe-2026-10-30
    paths:
      - '.github/workflows/d1-remote-readonly-preflight.yml'
      - 'scripts/d1-remote-readonly-preflight.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Verify exact D1 identities, existing indexes and recovery bookmark (NO changes)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guard exact repository and D1 optimization branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chichute5500/Sindarealest-admin"
          test "$GITHUB_REF" = "refs/heads/perf/d1-rows-read-safe-2026-10-30"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run strictly read-only schema/index checks
        run: node scripts/d1-remote-readonly-preflight.mjs
      - name: Upload D1 metadata/plan evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-remote-readonly-preflight
          path: artifacts/d1-readonly/preflight.json
          if-no-files-found: ignore
          retention-days: 3
