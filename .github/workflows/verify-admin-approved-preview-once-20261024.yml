name: Post-deployment isolated Admin read-only verification

on:
  push:
    branches:
      - feature/admin-isolated-handoff-2026-10-20
    paths:
      - ".github/workflows/verify-admin-approved-preview-once-20261024.yml"

permissions:
  contents: read

jobs:
  verify-approved-preview:
    name: Verify Cloudflare reported SHA and GET-only Admin smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/admin-isolated-handoff-2026-10-20' && github.event.head_commit.message == '[CF-Pages-Skip] qa: verify deployed Admin Preview SHA 564ea556e6dee745eaaa491ee033a2a8cfbb595c' }}
    env:
      APPROVED_SOURCE_SHA: 564ea556e6dee745eaaa491ee033a2a8cfbb595c
      ADMIN_TEST_URL: https://feature-admin-isolated-hando.sindarealest-admin-preview.pages.dev/admin/
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Assert intended repository and ref
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "chichute5500/Sindarealest-admin"
          test "${GITHUB_REF}" = "refs/heads/feature/admin-isolated-handoff-2026-10-20"
          test -n "${ADMIN_TEST_PASSWORD}"
      - name: Checkout exact deployed source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APPROVED_SOURCE_SHA }}
      - name: Check approved source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${APPROVED_SOURCE_SHA}"
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install project dependencies and regression runner
        run: npm install --no-fund && npm install --no-save --no-package-lock @playwright/test
      - name: Test provenance parser fail-closed contracts
        run: node tests/admin-preview-provenance.test.mjs
      - name: Verify approved SHA using Cloudflare Pages GET-only API
        env:
          EXPECTED_FEATURE_SHA: ${{ env.APPROVED_SOURCE_SHA }}
        run: |
          node scripts/admin-preview-provenance-readonly.mjs
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("artifacts/admin-preview-evidence/"+process.env.APPROVED_SOURCE_SHA.slice(0,12)+"/deployment-provenance-readonly.json", "utf8")); if (p.status!=="REPORTED_SHA_MATCH" || p.observedSha!==process.env.APPROVED_SOURCE_SHA) { console.error("::error::Isolated Preview does not report the exact authorized SHA: "+p.status); process.exit(1); } console.log("PASS: isolated Cloudflare Pages alias reports approved deployed SHA; metadata evidence only")'
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated GET-only Preview smoke on approved source
        env:
          GITHUB_SHA: ${{ env.APPROVED_SOURCE_SHA }}
        run: npx playwright test tests/e2e/admin-isolated-preview.spec.js --reporter=line,html
      - name: Guard feature HEAD unchanged throughout read-only verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/feature/admin-isolated-handoff-2026-10-20 | awk '{print $1}')"
          test "${remote}" = "${GITHUB_SHA}" || { echo '::error::Feature HEAD changed during QA'; exit 1; }
      - name: Save sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-approved-preview-readonly-qa
          path: |
            artifacts/admin-preview-evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
