name: Independent 218 New And 237 Hidden Production Audit
on:
  push:
    branches:
      - audit/import-218-921-readonly-2026-10-26
    paths:
      - scripts/postcutover-catalog-verify-readonly.mjs
      - .github/workflows/postcutover-catalog-verify-readonly.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify audit syntax
        run: node --check scripts/postcutover-catalog-verify-readonly.mjs
      - name: Independently check D1 counts, public products, categories and reference images
        run: node scripts/postcutover-catalog-verify-readonly.mjs
