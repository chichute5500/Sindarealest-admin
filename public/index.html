/* Lightweight bidirectional reveal. Never blur a whole frosted-glass subtree:
   filter+backdrop-filter on the same moving card forces repeated offscreen paints.
   Reset is immediate outside the viewport; only entering animates. */
html.js-enabled [data-reveal]{
  opacity:0;
  filter:none;
  will-change:auto;
  transition:none;
}
html.js-enabled [data-reveal].is-visible{
  opacity:1;
  /* Keep existing card hover/press transform motion without moving cards during reveal. */
  transition:opacity .38s cubic-bezier(.22,.7,.25,1),transform .22s ease;
  transition-delay:min(var(--reveal-delay,0ms),90ms);
}
/* Move small editorial headings only, never full product/image/glass cards.
   Opacity-only on cards avoids new overlapping transform stacking contexts. */
html.js-enabled :is(.hero-copy,.section-head,.order-cta)[data-reveal]:not(.is-visible){
  transform:translateY(10px);
}
html.js-enabled :is(.hero-copy,.section-head,.order-cta)[data-reveal].is-visible{
  transform:none;
  transition:opacity .38s cubic-bezier(.22,.7,.25,1),transform .42s cubic-bezier(.22,.7,.25,1);
  transition-delay:min(var(--reveal-delay,0ms),90ms);
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html.js-enabled [data-reveal]{opacity:1;transform:none;filter:none}}

/* Preserve the approved internal scroll/sticky header and footer without resizing the Cart sheet. */
@media(max-width:760px){
  .cart-drawer:has(.cart-row) .cart-list{
    flex:0 0 auto!important;
    max-height:none;
    min-height:0!important;
    overflow:visible!important;
  }
  .cart-drawer:has(.cart-row) .cart-bottom{position:sticky;bottom:0;z-index:2;margin-top:auto}
  #cartDrawer .cart-header{position:sticky;top:0;z-index:2}
  #checkoutDrawer .checkout-header{position:sticky;top:0;z-index:3;flex-shrink:0}
  #checkoutDrawer .checkout-form{flex:0 0 auto!important;overflow:visible!important;min-height:0;max-height:none;align-self:stretch}
  #checkoutDrawer .sd-checkout-footer{
    position:sticky;
    /* Sticky bottom alone only prevents the footer from moving below the
       scrollport. At the order-code step, the 14px residual scroll used to
       pull it UP. The top threshold also pins its natural dock position. */
    top:calc(100% - var(--sd-checkout-footer-height,73px));
    bottom:0;
    z-index:3;
    margin-top:auto;
    flex-shrink:0;
  }
}

  backdrop-filter:blur(17px) saturate(114%);
}

/* Mobile first-viewport: skip offscreen catalog/collection layout until near scroll.
   This preserves the existing glass/card CSS, content and hydrated interactions.
   Direct /sanpham and public service routes retain their exact original layout.
   Intrinsic heights reserve scroll geometry before the real sections are painted. */
@media(max-width:760px){
 @supports(content-visibility:auto){
  html:not(.sd-catalog-route):not(.sd-service-route) #featured{content-visibility:auto;contain-intrinsic-size:auto 650px}
  html:not(.sd-catalog-route):not(.sd-service-route) #collections{content-visibility:auto;contain-intrinsic-size:auto 750px}
  html:not(.sd-catalog-route):not(.sd-service-route) #products{content-visibility:auto;contain-intrinsic-size:auto 1500px}
 }
}
