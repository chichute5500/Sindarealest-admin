<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="730" viewBox="0 0 1600 730" aria-hidden="true">
<!-- V15 pure decorative silk lighting and sculpted satin folds; no shoes, text, CTA, raster or screenshot. -->
<defs>
 <linearGradient id="silkAir" x1="0" y1="0" x2="1" y2=".77">
  <stop stop-color="#fdfefe"/><stop offset=".23" stop-color="#f7fbff"/>
  <stop offset=".51" stop-color="#d2e8f8"/><stop offset=".74" stop-color="#a9cde7"/>
  <stop offset="1" stop-color="#719ec0"/>
 </linearGradient>
 <radialGradient id="silkLeftRadiance" cx=".07" cy=".31" rx=".73" ry=".86">
  <stop stop-color="#ffffff" stop-opacity=".99"/><stop offset=".35" stop-color="#ffffff" stop-opacity=".83"/>
  <stop offset=".73" stop-color="#f8fdff" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="silkUpperSky" cx=".68" cy=".04" rx=".70" ry=".85">
  <stop stop-color="#f3faff" stop-opacity=".77"/><stop offset=".66" stop-color="#96bedc" stop-opacity=".42"/>
  <stop offset="1" stop-color="#85b1d1" stop-opacity=".13"/>
 </radialGradient>
 <linearGradient id="silkFoldA" x1=".20" y1=".11" x2=".68" y2=".88">
  <stop stop-color="#ffffff" stop-opacity=".96"/><stop offset=".20" stop-color="#fafcff" stop-opacity=".82"/>
  <stop offset=".47" stop-color="#83b4d6" stop-opacity=".48"/><stop offset=".67" stop-color="#5b8db5" stop-opacity=".33"/>
  <stop offset=".83" stop-color="#edf7ff" stop-opacity=".91"/><stop offset="1" stop-color="#ffffff" stop-opacity=".52"/>
 </linearGradient>
 <linearGradient id="silkFoldB" x1=".17" y1=".02" x2=".89" y2="1">
  <stop stop-color="#ffffff" stop-opacity=".97"/><stop offset=".18" stop-color="#eff8ff" stop-opacity=".57"/>
  <stop offset=".43" stop-color="#608fb8" stop-opacity=".34"/><stop offset=".62" stop-color="#c3e0f4" stop-opacity=".45"/>
  <stop offset=".83" stop-color="#ffffff" stop-opacity=".86"/><stop offset="1" stop-color="#ffffff" stop-opacity=".17"/>
 </linearGradient>
 <linearGradient id="silkFoldC" x1="0" y1="0" x2=".13" y2="1">
  <stop stop-color="#f7fcff" stop-opacity=".05"/><stop offset=".20" stop-color="#8fb7d6" stop-opacity=".18"/>
  <stop offset=".48" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".60" stop-color="#e3f4ff" stop-opacity=".75"/>
  <stop offset=".78" stop-color="#5687b0" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
 </linearGradient>
 <linearGradient id="silkRidge" x1="0" y1="0" x2="1" y2=".19">
  <stop stop-color="#fff" stop-opacity=".05"/><stop offset=".26" stop-color="#fff" stop-opacity=".82"/>
  <stop offset=".62" stop-color="#ffffff" stop-opacity=".96"/><stop offset=".85" stop-color="#f7fdff" stop-opacity=".73"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity=".16"/>
 </linearGradient>
 <linearGradient id="silkBlueShadow" x1="0" y1="0" x2=".16" y2="1">
  <stop stop-color="#a1c8e5" stop-opacity="0"/><stop offset=".4" stop-color="#6999bf" stop-opacity=".38"/>
  <stop offset=".62" stop-color="#487da6" stop-opacity=".32"/><stop offset=".88" stop-color="#d8edfb" stop-opacity=".06"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
 </linearGradient>
 <radialGradient id="silkFloor" cx=".43" cy=".60" rx=".78" ry=".67">
  <stop stop-color="#ffffff" stop-opacity=".96"/><stop offset=".30" stop-color="#f9fdff" stop-opacity=".68"/>
  <stop offset=".74" stop-color="#b3d4ea" stop-opacity=".55"/><stop offset="1" stop-color="#9ac2e1" stop-opacity=".32"/>
 </radialGradient>
 <linearGradient id="silkFloorReflect" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#fafdff" stop-opacity=".03"/><stop offset=".41" stop-color="#ffffff" stop-opacity=".76"/>
  <stop offset=".7" stop-color="#a8cfe6" stop-opacity=".28"/><stop offset="1" stop-color="#e0f4ff" stop-opacity=".02"/>
 </linearGradient>
 <linearGradient id="silkGoldFilament" x1="0" y1="0" x2="1" y2="0">
  <stop stop-color="#caa474" stop-opacity="0"/><stop offset=".38" stop-color="#ffefce" stop-opacity=".58"/>
  <stop offset=".65" stop-color="#e4b67d" stop-opacity=".48"/><stop offset="1" stop-color="#f6e9d1" stop-opacity=".03"/>
 </linearGradient>
 <filter id="silkFabricMicro" x="-3%" y="-6%" width="106%" height="112%">
  <feTurbulence type="fractalNoise" baseFrequency=".003 .029" numOctaves="3" seed="16" result="thread"/>
  <feColorMatrix in="thread" type="saturate" values="0"/>
 </filter>
 <filter id="silkFoldDistortion" x="-6%" y="-8%" width="112%" height="116%">
  <feTurbulence baseFrequency=".005 .014" numOctaves="2" seed="18" result="undulation"/>
  <feDisplacementMap in="SourceGraphic" in2="undulation" scale="9" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="silkSoftLight"><feGaussianBlur stdDeviation="12"/></filter>
 <mask id="silkGlassMask"><rect width="1600" height="730" fill="white"/><rect x="0" y="0" width="1600" height="730" fill="url(#silkLeftRadiance)" opacity=".1"/></mask>
</defs>
<rect width="1600" height="730" fill="url(#silkAir)"/>
<rect width="1600" height="730" fill="url(#silkUpperSky)"/>
<!-- Backlit upper sweep, shadow pocket and illuminated shoulder. -->
<path d="M-145 -112 C168 72 337 230 599 215 C938 192 1274 72 1745 -208 L1745 19 C1321 231 1084 320 719 310 C425 290 169 235 -145 52Z" fill="url(#silkBlueShadow)" opacity=".68" filter="url(#silkFoldDistortion)"/>
<path d="M-160 -141 C207 90 350 253 661 220 C1044 183 1313 19 1745 -220 L1745 -66 C1285 172 1035 257 691 271 C372 282 171 177 -160 0Z" fill="url(#silkFoldA)" filter="url(#silkFoldDistortion)"/>
<path d="M-126 -77 C237 134 371 239 660 203 C1028 160 1340 13 1730 -214" fill="none" stroke="url(#silkRidge)" stroke-width="19" opacity=".78" filter="url(#silkFoldDistortion)"/>
<path d="M-145 -43 C250 199 417 281 737 238 C1034 199 1405 61 1760 -127" fill="none" stroke="#ffffff" stroke-width="3.8" opacity=".53"/>
<!-- Middle fold: broad organic contour, narrow shade followed by soft specular highlight. -->
<path d="M-181 175 C161 376 354 443 641 384 C1030 305 1341 270 1738 40 L1738 201 C1331 401 1067 464 688 479 C333 492 108 383 -181 289Z" fill="url(#silkBlueShadow)" opacity=".62" filter="url(#silkFoldDistortion)"/>
<path d="M-178 144 C162 359 364 423 666 360 C1060 283 1394 223 1739 13 L1739 146 C1389 367 1106 425 690 446 C337 468 108 367 -178 258Z" fill="url(#silkFoldB)" filter="url(#silkFoldDistortion)"/>
<path d="M-145 170 C204 355 389 411 691 342 C1060 260 1367 207 1729 6" fill="none" stroke="url(#silkRidge)" stroke-width="14" opacity=".66"/>
<path d="M-148 225 C189 412 410 458 694 387 C1040 316 1367 265 1732 68" fill="none" stroke="#5e91b8" stroke-width="38" opacity=".042"/>
<!-- Forward low-wave and mirrored floor band, converging into a gentle photographic horizon. -->
<path d="M-199 509 C140 440 372 521 687 482 C1018 429 1385 402 1750 210 L1750 730 L-199 730Z" fill="url(#silkFloor)"/>
<path d="M-170 503 C165 429 376 548 714 478 C1064 414 1393 395 1731 219 L1731 362 C1384 526 1142 592 730 568 C362 573 148 493 -170 570Z" fill="url(#silkBlueShadow)" opacity=".34"/>
<path d="M-170 484 C172 442 409 525 694 475 C1072 403 1383 363 1741 187 L1741 296 C1400 459 1116 540 736 548 C371 548 183 468 -170 553Z" fill="url(#silkFoldC)" opacity=".76" filter="url(#silkFoldDistortion)"/>
<path d="M-170 487 C153 428 376 528 695 465 C1067 391 1398 364 1740 183" stroke="url(#silkRidge)" stroke-width="14" opacity=".68" fill="none"/>
<!-- Radiant semi-transparent scrim keeps native HTML ink sharply legible. -->
<rect width="1600" height="730" fill="url(#silkLeftRadiance)" opacity=".70"/>
<path d="M-130 612 C150 570 418 635 718 573 C1054 502 1414 515 1730 377 L1730 730 L-130 730Z" fill="url(#silkFloorReflect)" opacity=".54"/>
<path d="M-85 630 C284 562 485 661 842 580 C1162 509 1465 550 1705 419" fill="none" stroke="#ffffff" stroke-width="8" opacity=".40" filter="url(#silkSoftLight)"/>
<path d="M-104 674 C233 601 524 692 875 620 C1193 551 1458 572 1730 458" fill="none" stroke="#ffffff" stroke-width="5" opacity=".45"/>
<path d="M-80 710 C241 642 509 729 841 665 C1131 603 1473 614 1730 507" fill="none" stroke="#b5d9ef" stroke-width="16" opacity=".20"/>
<!-- Extremely faint gold filaments in upper-right satin, not artwork or objects. -->
<path d="M1180 271 C1335 209 1435 203 1550 161 S1625 132 1721 112" fill="none" stroke="url(#silkGoldFilament)" stroke-width="1.6" opacity=".58"/>
<path d="M1220 297 C1397 247 1490 232 1629 180" fill="none" stroke="#fff7e5" stroke-width="1.0" opacity=".30"/>
<rect width="1600" height="730" filter="url(#silkFabricMicro)" opacity=".035" style="mix-blend-mode:soft-light"/>
</svg>