<!-- V16: translucent mineral grain and sharp irregular micro-faults. All artwork exclusively independent marble. -->
<filter id="sdStoneMineralV16" x="-8%" y="-10%" width="116%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".028 .10" numOctaves="4" seed="17" stitchTiles="stitch" />
  <feColorMatrix type="matrix" values=".38 0 0 0 .33  0 .42 0 0 .42  0 0 .47 0 .49  0 0 0 .48 0"/>
</filter>
<linearGradient id="sdMicroGoldV16" x1="0" y1="0" x2="1" y2=".9">
