  <stop offset=".69" stop-color="#ad8049"/><stop offset="1" stop-color="#fff9de"/>
</linearGradient>
<filter id="sdGoldBloomV16"><feGaussianBlur stdDeviation="3"/></filter>
<!-- V25: independent natural mineral fracture network from multiscale coherent noise.
