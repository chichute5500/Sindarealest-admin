<style>

h2{margin:0 0 12px;font:400 clamp(22px,6vw,31px)/1.2 Georgia,serif}
p{font-size:14px;line-height:1.7;color:var(--muted)}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:12px;padding:10px 22px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font-size:13px;font-weight:650;text-decoration:none}
