<title>Không tìm thấy trang | SinDarealest</title>
<script>
try { if (localStorage.getItem('sd-theme-mode') === 'dark') document.documentElement.classList.add('dark'); } catch {}
</script>
<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100svh;display:grid;place-items:center;padding:28px;color:#142a3c;background-color:#eaf3fb;background-image:url('/images/liquid-glass-light-mobile.svg?v=20261022-3');background-position:center;background-size:cover;background-attachment:fixed;font-family:Arial,Helvetica,sans-serif}
html.dark body{color:#eaf3fb;background-color:#061a2a;background-image:url('/images/liquid-glass-dark-mobile.svg?v=20261022-3')}
html.dark body::after{content:"";position:fixed;inset:-12%;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 12% 14%,rgba(124,176,211,.22),transparent 30%),radial-gradient(ellipse at 88% 36%,rgba(67,126,166,.20),transparent 32%),radial-gradient(ellipse at 28% 78%,rgba(55,112,151,.17),transparent 34%),linear-gradient(138deg,transparent 3%,rgba(145,192,220,.16) 13%,rgba(7,22,36,.05) 18%,transparent 24%,rgba(145,192,220,.13) 34%,rgba(3,16,28,.22) 40%,transparent 47%,rgba(116,170,202,.17) 57%,transparent 63%,rgba(2,14,26,.24) 71%,rgba(110,164,196,.12) 79%,transparent 88%);filter:blur(12px);opacity:1}
.not-found-page{position:relative;z-index:1;width:100%;min-height:calc(100svh - 56px);display:grid;place-items:center}
.not-found-card{width:min(100%,520px);padding:clamp(28px,7vw,56px);border:1px solid rgba(92,145,185,.35);border-radius:28px;background:rgba(255,255,255,.42);box-shadow:0 18px 60px rgba(20,42,60,.09);backdrop-filter:blur(22px);text-align:center}
html.dark .not-found-card{background:rgba(7,27,43,.62);border-color:rgba(92,145,185,.45);box-shadow:0 18px 60px rgba(0,0,0,.22)}
.not-found-eyebrow{margin:0 0 14px;font-size:10px;letter-spacing:.16em;color:#55718a}
.not-found-card h1{margin:0;font:400 clamp(64px,16vw,104px)/.95 Georgia,serif;letter-spacing:-.06em;color:#142a3c}
html.dark .not-found-card h1{color:#eaf3fb}
.not-found-card h2{margin:18px 0 10px;font:400 clamp(23px,5vw,30px)/1.2 Georgia,serif}
.not-found-card p:not(.not-found-eyebrow){margin:0 auto 24px;max-width:36ch;color:#55718a;font-size:14px;line-height:1.7}
html.dark .not-found-card p:not(.not-found-eyebrow),html.dark .not-found-eyebrow{color:#a8c0d3}
.not-found-home{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:44px;padding:0 22px;border:1px solid rgba(92,145,185,.55);border-radius:999px;color:inherit;text-decoration:none;background:rgba(255,255,255,.36);font-size:13px;font-weight:650}
html.dark .not-found-home{background:rgba(92,145,185,.18)}
@media(min-width:761px){body{background-image:url('/images/liquid-glass-light.svg?v=20261022-3')}html.dark body{background-image:url('/images/liquid-glass-dark.svg?v=20261022-3')}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="notFoundPage" class="not-found-page" aria-labelledby="notFoundTitle">
<section class="not-found-card">
<p class="not-found-eyebrow">SINDAREALEST · THỜI TRANG DA CÁ SẤU</p>
<h1 id="notFoundTitle">404</h1>
<h2>Không tìm thấy trang</h2>
<p>Đường dẫn này không tồn tại hoặc nội dung đã được chuyển đi.</p>
<a class="not-found-home" href="/">Về trang chủ <span aria-hidden="true">→</span></a>
</section>
</main>
</body>
</html>
