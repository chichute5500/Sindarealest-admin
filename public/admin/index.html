<script>
/* Apply the device-first theme before styles paint, including Android browser chrome.
   Explicit Admin preference applies only within the current tab navigation. */
(()=>{
  let mode='auto';
  try{
    const navigation=typeof performance!=='undefined'&&performance.getEntriesByType?.('navigation')?.[0]?.type||'navigate';
    let sameSiteEntry=false;
    try{sameSiteEntry=Boolean(document.referrer&&new URL(document.referrer).origin===location.origin)}catch{}
    if(navigation==='reload'||(!sameSiteEntry&&navigation!=='back_forward'))
      sessionStorage.removeItem('sd-admin-theme-override-v2');
    else{
      const saved=sessionStorage.getItem('sd-admin-theme-override-v2');
      if(saved==='dark'||saved==='light')mode=saved;
    }
  }catch{}
  const dark=mode==='dark'||(mode==='auto'&&!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches));
  document.documentElement.dataset.adminTheme=dark?'dark':'light';
  const color=document.querySelector('#adminThemeColor');
  if(color)color.setAttribute('content',dark?'#061522':'#eaf3fb');
})();
</script>

/* ADMIN-only visual pass: pale ice glass / navy, isolated from the public storefront. */
:root{
  color-scheme:only light;
  font-family:"SD Sans",Inter,"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  --bg:#eaf3fb;
  --paper:rgba(255,255,255,.78);
  --ink:var(--sd-admin-ink);
  --muted:#5b7488;
  --line:rgba(235,247,255,.88);
  --gold:#5c91b9;
  --danger:#a54343;
  --shadow:0 18px 44px rgba(41,84,119,.15);
  --r:20px;
}
body{
  background:
    radial-gradient(ellipse at 0 0,rgba(92,145,185,.18),transparent 38%),
    radial-gradient(ellipse at 100% 18%,rgba(188,218,238,.36),transparent 34%),
    var(--bg);
}
.sidebar{
  background:rgba(234,243,251,.62);
  border-color:rgba(62,105,139,.18);
  backdrop-filter:blur(22px) saturate(155%);
  -webkit-backdrop-filter:blur(22px) saturate(155%);
}
.mark{
  background:linear-gradient(140deg,#142a3c,#315b79);
  color:#eaf3fb;
}
.btn.primary{
  border-color:#5c91b9;
  color:#fff;
}
.btn.dark{
  background:#142a3c;
  border-color:#142a3c;
  color:#eaf3fb;
}
.nav.active{
}
.eyebrow,.field label,.fieldlabel{color:var(--reference-blue)}
.control{
}
.control:focus-visible,button:focus-visible{
  outline:3px solid rgba(92,145,185,.62);
  outline-offset:2px;
}
.callout{
  --sd-admin-surface-face:var(--sd-admin-inset-face);
  color:var(--sd-admin-ink);
}
.topbar{}
:root[data-admin-theme="dark"]{
  color-scheme:only dark;
  --bg:#061522;
  --paper:rgba(8,27,46,.78);
  --ink:#edf7ff;
  --muted:#abc3d7;
  --line:rgba(176,215,243,.36);
  --gold:#8ebce0;
  --danger:#ffb6a7;
  --shadow:0 18px 44px rgba(0,7,18,.46);
}
:root[data-admin-theme="dark"] body{
  background:
    radial-gradient(ellipse at 0 0,rgba(92,145,185,.20),transparent 38%),
    radial-gradient(ellipse at 100% 35%,rgba(52,100,136,.17),transparent 38%),
    var(--bg);
}
:root[data-admin-theme="dark"] .topbar,
:root[data-admin-theme="dark"] .sidebar,
:root[data-admin-theme="dark"] .mobiletabs{
  background:rgba(9,19,29,.70);
  border-color:var(--line);
  backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
}
:root[data-admin-theme="dark"] .btn.primary{
  border-color:#6ca5ce;
}
:root[data-admin-theme="dark"] .btn.dark{
  background:#203d54;
  border-color:#315f82;
  color:#eaf3fb;
}

:root[data-admin-theme="dark"] .callout{
  color:var(--sd-admin-ink);
}


/* Admin logout: a recognizable red power-off control, same on PC and mobile.
   The actual sign-out behavior, id, hidden state and accessible name remain unchanged. */
#logout{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;min-width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;
  color:#b4232f;background:rgba(219,50,62,.10);
  border:1px solid rgba(180,35,47,.35);
  box-shadow:0 5px 14px rgba(117,25,37,.10),inset 0 1px 0 rgba(255,255,255,.88);
}
#logout .logout-power-icon{display:block;flex:none;width:20px;height:20px}
#logout:hover{color:#921a24;background:rgba(219,50,62,.17);border-color:rgba(180,35,47,.60)}
#logout:focus-visible{outline:3px solid #b4232f;outline-offset:2px}
:root[data-admin-theme="dark"] #logout{
  color:#ff7983;background:rgba(240,80,94,.13);
  border-color:rgba(255,121,131,.46)
}
:root[data-admin-theme="dark"] #logout:hover{background:rgba(240,80,94,.23)}
/* Correct HTML hidden-state rendering for buttons styled with display:flex. */
[hidden]{display:none!important}
/* Keep the ADMIN top bar usable at narrow Android widths without clipped labels. */
@media(max-width:390px){
  .topbar{gap:7px;padding-left:10px;padding-right:10px}
  .topbar>.brand{gap:5px;min-width:0;flex:1 1 auto}
  .topbar .brand-logo{width:36px;height:36px;flex:0 0 36px}
  .topbar .brand>div{min-width:0}
  .topbar .brand h1{letter-spacing:.075em}
  .topbar .brand p{letter-spacing:.045em;line-height:1.25}
  .topright{gap:5px;flex:0 0 auto}
  .topright #adminThemeToggle,
  .topright #notificationToggle,
  .topright #logout{
    width:38px;min-width:38px;min-height:38px;
    padding:0!important;justify-content:center;
    font-size:0!important;gap:0;
    flex:0 0 38px;
  }
  .topright #adminThemeToggle::before{
    content:"◐";font-size:18px;line-height:1;
  }
  .topright #adminThemeToggle[aria-pressed="true"]::before{content:"☀"}
  .topright #notificationToggle>span:not(.notif-count){display:none}
  .topright #notificationToggle .bell-icon{width:18px;height:18px}
  .topright #logout .logout-power-icon{width:19px;height:19px}
}

/* Login shell: hide duplicate app chrome while keeping the theme toggle available. */
body:has(#loginView:not(.hidden)) .topbar{
  position:fixed;top:14px;right:14px;z-index:20;width:auto;
  padding:0;border:0;background:transparent;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
body:has(#loginView:not(.hidden)) .topbar>.brand,
body:has(#loginView:not(.hidden)) #conn,
body:has(#loginView:not(.hidden)) #notificationToggle,
body:has(#loginView:not(.hidden)) #logout,
body:has(#loginView:not(.hidden)) #adminMenuToggle{display:none!important}
body:has(#loginView:not(.hidden)) .topright{gap:0}

/* ADMIN-only albino crocodile-scale texture, intentionally very low contrast. */
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 18px 10px at 50% 0%,transparent 54%,rgba(92,145,185,.028) 59%,transparent 67%),
    radial-gradient(ellipse 18px 10px at 50% 100%,transparent 54%,rgba(255,255,255,.12) 59%,transparent 67%),
    radial-gradient(ellipse at 0 0,rgba(188,218,238,.42),transparent 38%),
    radial-gradient(ellipse at 100% 18%,rgba(188,218,238,.36),transparent 34%);
  background-size:36px 20px,36px 20px,auto,auto;
  background-position:0 0,18px 10px,0 0,100% 18%;
  background-repeat:repeat,repeat,no-repeat,no-repeat;
  background-attachment:fixed;
}
:root[data-admin-theme="dark"] body{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 18px 10px at 50% 0%,transparent 54%,rgba(142,188,224,.025) 59%,transparent 67%),
    radial-gradient(ellipse 18px 10px at 50% 100%,transparent 54%,rgba(234,243,251,.025) 59%,transparent 67%),
    radial-gradient(ellipse at 0 0,rgba(142,188,224,.18),transparent 38%),
    radial-gradient(ellipse at 100% 18%,rgba(142,188,224,.12),transparent 34%);
  background-size:36px 20px,36px 20px,auto,auto;
  background-position:0 0,18px 10px,0 0,100% 18%;
  background-repeat:repeat,repeat,no-repeat,no-repeat;
  background-attachment:fixed;
}

/* Custom accessible SKU verification checkbox aligned with the reference glass controls. */
.admin-check-control{
  appearance:none;-webkit-appearance:none;
  display:grid;place-content:center;flex:0 0 20px;
  width:20px;height:20px;margin:0;padding:0;
  border:1px solid rgba(92,145,185,.42);border-radius:6px;
  background:rgba(255,255,255,.82);color:#fff;
  box-shadow:inset 0 1px 2px rgba(20,42,60,.08);
  cursor:pointer;transition:background-color .18s,border-color .18s,box-shadow .18s;
}
.admin-check-control::before{
  content:"";width:9px;height:5px;
  border:solid currentColor;border-width:0 0 2px 2px;
  transform:rotate(-45deg) scale(0);transform-origin:center;
}
.admin-check-control:checked{background-color:#5c91b9;border-color:#5c91b9;color:#fff}

.admin-check-control:checked::before{transform:rotate(-45deg) scale(1)}
.admin-check-control:focus-visible{outline:3px solid rgba(92,145,185,.38);outline-offset:3px}
:root[data-admin-theme="dark"] .admin-check-control{
  background:rgba(12,27,40,.88);border-color:rgba(142,188,224,.44);color:#eaf3fb;
}
:root[data-admin-theme="dark"] .admin-check-control:checked{
  background-color:#8ebce0;border-color:#8ebce0;color:#09131d;
}

@media(prefers-reduced-motion:reduce){.admin-check-control{transition:none}}
