plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sindarealest.admin'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sindarealest.admin'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
