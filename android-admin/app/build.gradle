plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sindarealest.admin'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sindarealest.admin'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        // These are Firebase public CLIENT config fields, not server credentials.
        resValue 'string', 'sd_firebase_app_id', System.getenv('SD_FIREBASE_APP_ID') ?: ''
        resValue 'string', 'sd_firebase_sender_id', System.getenv('SD_FIREBASE_SENDER_ID') ?: ''
        resValue 'string', 'sd_firebase_project_id', System.getenv('SD_FIREBASE_PROJECT_ID') ?: ''
        resValue 'string', 'sd_firebase_api_key', System.getenv('SD_FIREBASE_API_KEY') ?: ''
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.firebase:firebase-messaging:26.0.1'
}
