plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sindarealest.photoai'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sindarealest.photoai'
        minSdk 28
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 12
        versionName '0.6.0-alpha'
    }
    androidResources { noCompress += ['tflite'] }
    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('releaseStoreFile')) {
                signingConfig signingConfigs.create('releaseKey') {
                    storeFile file(project.property('releaseStoreFile'))
                    storePassword project.property('releaseStorePassword')
                    keyAlias project.property('releaseKeyAlias')
                    keyPassword project.property('releaseKeyPassword')
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:1.1.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

 